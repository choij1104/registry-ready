<style>
/* Layout: one column, phone-first; a chevron-striped header band like rig livery, sticky bottom nav. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#11212B; --muted:#56666E; --line:#D3DBDC;
  --accent:#D9480F; --accent-ink:#FFFFFF; --navy:#16324A; --navy-ink:#F2F6F7;
  --good:#1D7A3F; --good-bg:#E3F3E8; --bad:#B42318; --bad-bg:#FBE7E5; --warn:#9A5B00; --warn-bg:#FBF0DC;
  --chev-a:#D9480F; --chev-b:#F4C430;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E171C; --surface:#152229; --ink:#E5EDEF; --muted:#93A4AB; --line:#26363F;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --navy:#0A1A26; --navy-ink:#E5EDEF;
  --good:#5CCB84; --good-bg:#14301F; --bad:#FF7B6E; --bad-bg:#3A1A17; --warn:#F2B54A; --warn-bg:#352A12;
  --chev-a:#E2551B; --chev-b:#D9AE2B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E171C; --surface:#152229; --ink:#E5EDEF; --muted:#93A4AB; --line:#26363F;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --navy:#0A1A26; --navy-ink:#E5EDEF;
  --good:#5CCB84; --good-bg:#14301F; --bad:#FF7B6E; --bad-bg:#3A1A17; --warn:#F2B54A; --warn-bg:#352A12;
  --chev-a:#E2551B; --chev-b:#D9AE2B; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--navy);color:var(--navy-ink)}
header.top .wrap{padding-block:18px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:2rem;letter-spacing:.04em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:.8rem;letter-spacing:.02em;text-transform:none;opacity:.8;margin-top:6px}
.chev{height:14px;background:repeating-linear-gradient(-45deg,var(--chev-a) 0 14px,var(--chev-b) 14px 28px)}
.sync{font-family:var(--f-mono);font-size:.72rem;opacity:.8}
main .wrap{padding-block:18px 24px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
h1{font-size:1.9rem;line-height:1.05}
h2{font-size:1.4rem;line-height:1.1}
h3{font-size:1.1rem;text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
.muted{color:var(--muted)}
.label{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.82rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:10px 16px;border-radius:4px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 10px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.seg button:focus-visible,nav.tabs button:focus-visible,.chk input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--f-mono);font-weight:700;font-size:2.2rem;line-height:1}
.pill{display:inline-block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;padding:3px 8px;border-radius:3px}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border-left:4px solid var(--line);padding-left:10px;min-width:0}
.stat.hot{border-left-color:var(--accent)}
/* domain bars */
.dom{display:grid;gap:4px}
.dom .head{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.bar{position:relative;height:12px;background:var(--bg);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--navy)}
:root[data-theme="dark"] .bar i{background:#5A87A8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar i{background:#5A87A8}}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent)}
/* question */
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stem{font-size:1.12rem;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:5px;padding:12px;cursor:pointer;min-height:48px}
.opt .k{font-family:var(--f-mono);font-weight:700;min-width:1.4em;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--bg)}
:root[data-theme="dark"] .opt[aria-pressed="true"]{border-color:#7FA9C7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt[aria-pressed="true"]{border-color:#7FA9C7}}
.opt.is-right{border-color:var(--good);background:var(--good-bg)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.olist{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.olist li{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:5px;padding:8px 10px;background:var(--surface)}
.olist li span.t{flex:1;min-width:0}
.olist li.is-right{border-color:var(--good)} .olist li.is-wrong{border-color:var(--bad)}
.trow{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.9rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:6px 10px;cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--navy-ink)}
.seg button.is-right{border-color:var(--good);outline:2px solid var(--good)}
.feedback{border-left:5px solid var(--good);background:var(--good-bg);padding:12px;border-radius:0 4px 4px 0;display:grid;gap:6px}
.feedback.wrong{border-left-color:var(--bad);background:var(--bad-bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
/* skills */
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--good);flex:none}
.crit{border:2px solid var(--bad);border-radius:5px;padding:12px;display:grid;gap:6px}
.crit ul{margin:0;padding-left:20px}
.timer{font-family:var(--f-mono);font-weight:700;font-size:2rem}
.list{display:grid;gap:0}
.list > *{padding:10px 0;border-bottom:1px solid var(--line)}
.confirm{border:2px solid var(--bad);padding:12px;border-radius:5px;display:grid;gap:10px}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px}
nav.tabs button{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.88rem;background:none;border:0;color:var(--muted);padding:10px 2px;border-top:3px solid transparent;cursor:pointer;min-height:48px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
.ot{display:grid;gap:4px;min-width:0}
.why-not{display:block;font-size:.88rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:4px}
.keyline{border-left:3px solid var(--accent);padding-left:10px;font-weight:700}
.feedback .keyline .label{font-weight:700}
.flash .cardfront{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.15;text-wrap:balance}
.flash .cardans{font-size:1.1rem;font-weight:700}
.cardback{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.listen-stage{display:grid;gap:10px;min-height:120px}
.chk.now{background:var(--warn-bg);outline:2px solid var(--warn);outline-offset:-2px}
.foot{font-size:.82rem;color:var(--muted);display:grid;gap:6px}
@media (max-width:420px){.big{font-size:1.6rem}h1{font-size:1.6rem}.stat{padding-left:8px}}
@media (prefers-reduced-motion:no-preference){.opt,.seg button,.chip{transition:border-color .12s,background .12s}}
</style>

<script>
/* Registry Ready — domains (NREMT EMT Examination Specifications, 2023 BLS Practice Analysis; in use since April 2025) and source labels. */
const DOMAINS = {
  SCENE:     { name: "Scene Size-up and Safety",        lo: 15, hi: 19 },
  PRIMARY:   { name: "Primary Assessment",              lo: 39, hi: 43 },
  SECONDARY: { name: "Secondary Assessment",            lo: 5,  hi: 9  },
  TREAT:     { name: "Patient Treatment and Transport", lo: 20, hi: 24 },
  OPS:       { name: "Operations",                      lo: 10, hi: 14 }
};
const SRC = {
  AHA: "2025 AHA Guidelines for CPR and ECC",
  NRP: "2025 AHA/AAP Neonatal Resuscitation Guidelines",
  STD: "National EMS Education Standards and Scope of Practice Model, EMT level",
  START: "START / JumpSTART mass-casualty triage",
  ERG: "Emergency Response Guidebook (PHMSA)",
  FTG: "2021 National Guideline for the Field Triage of Injured Patients",
  SMR: "2018 ACS-COT/ACEP/NAEMSP joint statement on spinal motion restriction"
};

const BANK = [{"id":"SA-001","d":"SECONDARY","topic":"History","concept":"targeted-history-questions","b":-1.5,"type":"mc","stem":"A 57-year-old man called 911 for chest discomfort. He tells you it began about 30 minutes ago while he was watching TV, nothing makes it better or worse, it feels like \"a heavy weight,\" and he rates it 7 out of 10. He is pale and diaphoretic. To complete an OPQRST pain history, which question should you ask next?","opts":["Have you taken any medications today, including any for erectile dysfunction?","Does the discomfort spread to your arm, neck, jaw, or back?","When did you last have something to eat or drink?","Has anyone in your family had a heart attack?"],"ans":1,"key":"Complete OPQRST by asking the missing element; here onset, provocation, quality, severity, and time are known, so ask about radiation.","why":"He has already described onset (at rest), provocation (nothing changes it), quality (heavy weight), severity (7/10), and time (30 minutes). Radiation is the only OPQRST element still missing, and spread to the arm, jaw, or back adds weight to a cardiac cause.","wrong":["Medication history matters, especially before any nitroglycerin, but it belongs to SAMPLE and does not complete the pain history.","","Last oral intake is a SAMPLE element; it does not complete the OPQRST pain history.","Family history adds little to the immediate prehospital assessment and is not part of OPQRST."],"src":"STD"},{"id":"SA-002","d":"SECONDARY","topic":"History","concept":"targeted-history-questions","b":-1,"type":"mc","stem":"A 61-year-old man with type 1 diabetes is sweaty, confused, and slow to answer, but he follows commands and can swallow. His glucose meter reading is low. His wife is with him. Which question to his wife is most useful right now?","opts":["Has he had any recent surgery or hospital stays?","Is he allergic to any medications or foods?","When did he last eat, and when did he last take insulin?","Who is his regular doctor, and which pharmacy does he use?"],"ans":2,"key":"Pick the SAMPLE question that explains the current problem: last oral intake and insulin timing explain a diabetic low.","why":"Last oral intake and the events leading up (insulin taken without eating) explain the hypoglycemia and predict whether it may recur after oral glucose. This answer directly shapes treatment and what you report to the receiving facility.","wrong":["Recent surgery is part of past history, but it does not explain his low glucose or change your immediate care.","Allergy history is part of SAMPLE, but it does not explain the low glucose and does not affect giving oral glucose.","","Provider and pharmacy details are administrative and do not guide his immediate assessment or treatment."],"src":"STD"},{"id":"SA-003","d":"SECONDARY","topic":"History","concept":"targeted-history-questions","b":0,"type":"mr","stem":"A 34-year-old woman reports sudden shortness of breath that began an hour ago. She returned yesterday from a 14-hour flight and takes an oral contraceptive. Her chest pain is sharp and worse with deep breaths. She says she has had no cough or fever and has never had a blood clot. Select TWO statements in your report that are pertinent negatives.","opts":["Pain worsens with deep inspiration.","Denies cough or fever.","Takes an oral contraceptive daily.","No previous history of blood clots.","Returned yesterday from a long flight."],"ans":[1,3],"key":"A pertinent negative is a relevant sign, symptom, or history item the patient does NOT have, documented because it shapes the picture.","why":"Absence of cough and fever makes an infectious cause less likely, and no prior clot history is relevant to her clot risk. Both are expected findings that are absent, which is what makes them pertinent negatives.","wrong":["This is a pertinent positive: a relevant symptom she does have.","","This is medication history and a positive risk factor she has, not an absent finding.","","This is a positive risk factor she has, not an absent finding."],"src":"STD"},{"id":"SA-004","d":"SECONDARY","topic":"History","concept":"medication-list-changes-picture","b":0.5,"type":"mc","stem":"A 78-year-old woman tripped on a rug and struck her forehead on a table. She is alert and oriented, has a small forehead bruise, and wants to stay home. Her vital signs are normal. Her medication list includes apixaban, metformin, atorvastatin, and omeprazole. Which medication most changes your assessment?","opts":["Atorvastatin, because statins commonly cause dizziness that leads to falls","Metformin, because it most likely caused low blood sugar and the fall","Omeprazole, because it can mask the early signs of internal bleeding","Apixaban, because an anticoagulant raises the risk of a delayed brain bleed"],"ans":3,"key":"An anticoagulant on the medication list makes a minor head strike high risk, even when the patient looks well.","why":"Patients taking anticoagulants who strike their head can develop intracranial bleeding hours later despite a normal initial exam. This finding supports strongly encouraging transport for evaluation and must be documented and reported.","wrong":["Statins can cause muscle aches, but they do not make a head strike more dangerous; the anticoagulant does.","Metformin alone rarely causes hypoglycemia; check glucose if indicated, but it does not raise bleeding risk.","Omeprazole reduces stomach acid; it does not mask bleeding or raise head-injury risk.",""],"src":"STD"},{"id":"SA-005","d":"SECONDARY","topic":"History","concept":"medication-list-changes-picture","b":1.5,"type":"mc","stem":"A 69-year-old man has had black, tarry stools for two days and now feels faint when he stands. He is pale, and his skin is cool and moist. BP 96/62 mm Hg, HR 64, RR 20. He takes metoprolol for high blood pressure. How should his medication change your interpretation?","opts":["The beta blocker can blunt his heart rate response, so a normal rate does not rule out shock","The beta blocker explains his low blood pressure, so blood loss is an unlikely cause","His normal heart rate shows compensation is adequate, so routine transport is appropriate","The beta blocker darkens the stool, so the stool color is a medication side effect"],"ans":0,"key":"Beta blockers can prevent the expected tachycardia of shock; judge perfusion by the whole picture, not heart rate alone.","why":"Metoprolol limits the heart rate rise that normally signals blood loss. With melena, orthostatic faintness, and cool, pale, moist skin, he should be treated as a patient in shock from GI bleeding despite a heart rate of 64.","wrong":["","Metoprolol may lower blood pressure, but melena with cool, pale, moist skin and faintness points to blood loss.","A normal rate here may reflect the beta blocker, not adequate compensation; his skin and history indicate shock.","Metoprolol does not darken stool; tarry stool with these signs suggests upper GI bleeding."],"src":"STD"},{"id":"SA-006","d":"SECONDARY","topic":"Physical exam","concept":"exam-finding-to-injury","b":-0.5,"type":"table","stem":"During one shift you examine four trauma patients. Match each physical exam finding with the injury it most suggests.","cols":["Basilar skull fracture","Flail chest","Pericardial tamponade","Intra-abdominal injury"],"rows":[["Bruising behind one ear that appeared the day after a fall",0],["A section of the right chest wall moves inward as the patient inhales",1],["Distended neck veins, muffled heart sounds, and low blood pressure after a stab wound to the chest",2],["Rigid, guarded abdomen that is painful to palpation after a bicycle handlebar injury",3]],"key":"Key exam findings point to specific injuries: Battle sign, paradoxical motion, Beck triad, and abdominal rigidity/guarding.","why":"Bruising behind the ear (Battle sign) develops hours after a basilar skull fracture. Paradoxical chest motion marks a flail segment. JVD, muffled heart sounds, and hypotension after penetrating chest trauma suggest tamponade, and a rigid, guarded abdomen suggests bleeding or organ injury in the abdomen.","src":"STD"},{"id":"SA-007","d":"SECONDARY","topic":"Physical exam","concept":"exam-finding-to-injury","b":0,"type":"mc","stem":"A 44-year-old unrestrained driver struck the steering wheel. He is short of breath, and his SpO2 is 90% on room air. While palpating his upper chest and neck, you feel a crackling, crispy sensation spread through the skin. What does this finding most suggest?","opts":["Fluid in the alveoli from acute heart failure","Rib ends grinding together at a single fracture site","Air leaking from an injured lung or airway into the soft tissues","Bleeding into the chest wall muscles from the impact"],"ans":2,"key":"Crackling under the skin of the chest or neck (subcutaneous emphysema) means air is leaking from the lung or airway.","why":"Subcutaneous emphysema after blunt chest trauma indicates a pneumothorax or airway injury, and his breathing may get worse. Give oxygen, reassess breath sounds and work of breathing often, and transport promptly to a trauma center.","wrong":["Alveolar fluid is heard as crackles with a stethoscope; it is not felt under the skin of the neck.","Bony crepitus is felt at the fracture site itself, not as crackling spread through the soft tissue of the neck.","","Chest wall bleeding causes bruising and swelling, not a crackling sensation under the skin."],"src":"STD"},{"id":"SA-008","d":"SECONDARY","topic":"Physical exam","concept":"head-injury-exam-findings","b":0.5,"type":"mc","stem":"A 25-year-old man was struck in the face with a bat 3 hours ago. He has bruising around both eyes and clear fluid draining from his nose. He is drowsy but breathing adequately at 14/min with no snoring sounds. Which action is most appropriate based on these findings?","opts":["Insert a nasal airway to keep his airway open while he is drowsy","Pack both nostrils firmly with gauze to stop the drainage","Apply ice packs over both eyes and let him sleep until arrival","Avoid a nasal airway, have suction ready, and reassess his mental status often"],"ans":3,"key":"Raccoon eyes with clear nasal drainage suggest a basilar skull fracture: no nasal airway, and watch mental status closely.","why":"Bruising around both eyes and clear fluid from the nose suggest a basilar skull fracture with a cerebrospinal fluid leak. A nasal airway is contraindicated, and a drowsy head-injured patient needs a ready airway plan, frequent reassessment, and spinal motion restriction.","wrong":["A nasal airway is contraindicated with signs of basilar skull fracture; his airway is currently open.","Packing blocks the drainage and raises infection risk; cover loosely with sterile gauze instead.","Letting him sleep hides a decline in mental status; a drowsy head-injured patient needs frequent checks.",""],"src":"STD"},{"id":"SA-009","d":"SECONDARY","topic":"Physical exam","concept":"head-injury-exam-findings","b":1,"type":"mc","stem":"A 52-year-old woman fell down a flight of stairs. On your arrival she opened her eyes to voice. Ten minutes later she responds only to pain. Her right pupil is now dilated and sluggish to light; the left pupil is normal. Which interpretation and action are most appropriate?","opts":["Expanding brain injury pressing on a nerve; support airway and breathing and transport rapidly to a trauma center","Likely an old eye injury; document the finding and complete the exam on scene","Probable opioid effect; give naloxone and recheck her pupils in five minutes","Normal variation in pupil size; recheck her pupils on arrival at the hospital"],"ans":0,"key":"A new unequal pupil with falling responsiveness after head trauma signals rising intracranial pressure: a true emergency.","why":"A newly dilated, sluggish pupil together with a decreasing level of responsiveness suggests an expanding intracranial bleed compressing the brain. She needs airway support, oxygenation, ventilation if breathing becomes inadequate, spinal motion restriction, and rapid transport with reassessment every 5 minutes.","wrong":["","The pupil change is new and comes with falling responsiveness, so it cannot be dismissed as an old injury.","Opioids cause small pupils on both sides, not one dilated pupil; her history points to head injury.","A new unequal pupil with declining mental status is not normal variation and needs immediate action."],"src":"STD"},{"id":"SA-010","d":"SECONDARY","topic":"Physical exam","concept":"rapid-trauma-vs-focused-exam","b":-0.5,"type":"mr","stem":"You respond to several trauma calls during one shift. Select TWO patients who should receive a rapid full-body trauma assessment rather than an exam focused on one injury.","opts":["A 30-year-old ejected from a rolled vehicle who is confused and cannot recall the crash","A 22-year-old who cut her palm on a kitchen knife, is alert, and has controlled bleeding","A 45-year-old who twisted his ankle stepping off a curb and has no other complaints","A 67-year-old pedestrian struck by a car at 30 mph who reports back and hip pain","A 19-year-old who jammed a finger playing basketball and is otherwise uninjured"],"ans":[0,3],"key":"Significant mechanism or altered mental status calls for a rapid head-to-toe trauma assessment; isolated minor injury gets a focused exam.","why":"Ejection with confusion and a pedestrian struck by a vehicle are significant mechanisms that can hide multiple injuries, and the confused patient cannot reliably report pain. Both need a rapid full-body assessment to find life threats.","wrong":["","An alert patient with an isolated hand cut and no significant mechanism needs a focused exam of the injury.","An isolated ankle injury from a low-energy mechanism in an alert patient calls for a focused exam.","","A minor isolated finger injury in an alert patient calls for a focused exam."],"src":"STD"},{"id":"SA-011","d":"SECONDARY","topic":"Physical exam","concept":"rapid-trauma-vs-focused-exam","b":-1,"type":"mc","stem":"A 35-year-old man slipped on a wet floor and landed on an outstretched hand. He is alert and oriented, did not hit his head, and denies neck or back pain. His only complaint is a painful, swollen right wrist. His primary assessment is normal. What is the most appropriate secondary assessment?","opts":["A focused exam of the wrist and arm, including pulse, motor function, and sensation below the injury","A rapid full-body trauma assessment from head to toe before splinting","No exam is needed; splint the wrist because the injury is obvious","Spinal motion restriction first, followed by a full neurologic exam"],"ans":0,"key":"An alert patient with an isolated injury from a low-energy mechanism gets a focused exam, including distal pulse, motor, and sensation.","why":"With a minor mechanism, normal mental status, and one complaint, a focused exam of the injured extremity is appropriate. Checking pulse, motor function, and sensation before and after splinting detects nerve or vessel compromise.","wrong":["","A rapid full-body assessment is for significant mechanisms or patients who cannot reliably report injuries.","Even an obvious injury must be examined, including distal pulse, motor, and sensation, before splinting.","He has no indication for spinal motion restriction: he is alert, has no spinal pain, and no neurologic deficit."],"src":"STD"},{"id":"SA-012","d":"SECONDARY","topic":"Reassessment","concept":"trend-not-snapshot","b":1,"type":"mc","stem":"A 40-year-old man struck his head in a fall from a roof. Your first vital signs: BP 132/84 mm Hg, HR 90, RR 18 and regular. Twenty minutes later during transport: BP 176/96 mm Hg, HR 54, RR irregular with pauses. He is now harder to arouse. What does this trend most suggest?","opts":["Pain and anxiety producing a stress response","Rising pressure inside the skull from an expanding brain injury","Compensated hemorrhagic shock from a hidden injury","Spinal cord injury causing neurogenic shock"],"ans":1,"key":"Rising BP, falling heart rate, and irregular breathing (Cushing triad) in a head injury signal rising intracranial pressure.","why":"Hypertension, bradycardia, and an irregular respiratory pattern with declining mental status form the Cushing triad, a late sign of increasing intracranial pressure. Support airway and ventilation, notify the receiving trauma center, and reassess every 5 minutes.","wrong":["A stress response raises the heart rate; it does not cause bradycardia and irregular breathing.","","Hemorrhagic shock causes a rising heart rate and falling blood pressure, the opposite of this trend.","Neurogenic shock causes low blood pressure with a slow heart rate, not rising blood pressure."],"src":"STD"},{"id":"SA-013","d":"SECONDARY","topic":"Reassessment","concept":"trend-not-snapshot","b":1.5,"type":"mc","stem":"A 33-year-old woman has an open femur fracture after a motorcycle crash; bleeding is controlled with a tourniquet. Over 15 minutes her vital signs change from BP 122/76 mm Hg, HR 98, RR 20 to BP 112/90 mm Hg, HR 124, RR 28. She is now restless, and her skin is cool and pale. What is the best interpretation?","opts":["Her rising diastolic pressure shows she is stabilizing after the tourniquet","Her compensated shock is worsening; she needs shock care and rapid transport","Her restlessness reflects tourniquet pain; reassure her and recheck in 15 minutes","Her vital signs remain in an acceptable range, so continue care on scene"],"ans":1,"key":"Rising heart and respiratory rates, a narrowing pulse pressure, and restlessness mean shock is progressing even before systolic BP drops.","why":"Her pulse pressure narrowed from 46 to 22 mm Hg while heart rate and respiratory rate climbed and she became restless with cool, pale skin. These are signs of worsening compensated shock, so expedite transport to a trauma center, keep her warm, and reassess every 5 minutes.","wrong":["A rising diastolic pressure with a falling systolic reflects vasoconstriction from compensation, not stabilization.","","Restlessness with tachycardia and cool skin suggests poor perfusion; a stable-patient recheck interval is too long.","A systolic BP still above 100 does not mean she is stable; the trend shows she is getting worse."],"src":"STD"},{"id":"SA-014","d":"SECONDARY","topic":"Reassessment","concept":"trend-not-snapshot","b":1.5,"type":"mc","stem":"A 16-year-old with asthma had loud wheezing and could speak only in short phrases. After you assisted with his prescribed inhaler, you reassess: he is drowsy, breath sounds are faint with no wheezing, RR 8, and SpO2 86%. What is the most appropriate action?","opts":["Document improvement, since the wheezing resolved after the inhaler","Assist with a second inhaler dose and recheck him in 15 minutes","Apply a nonrebreather mask, position him upright, and continue routine transport","Begin bag-valve-mask ventilation with oxygen and expedite transport"],"ans":3,"key":"Loss of wheezing with drowsiness, slow breathing, and falling SpO2 is respiratory failure, not improvement: ventilate.","why":"Faint breath sounds without wheezing mean little air is moving, and drowsiness with a rate of 8 and SpO2 of 86% shows he is tiring and failing. He needs assisted ventilation with a BVM and oxygen, rapid transport, and continuous reassessment.","wrong":["Wheezing that disappears while mental status and SpO2 fall signals worsening air movement, not improvement.","Another dose may be allowed per protocol, but a patient breathing 8/min with falling SpO2 needs ventilation first.","A nonrebreather cannot help a patient who is not breathing adequately; he needs ventilations.",""],"src":"STD"},{"id":"SA-015","d":"SECONDARY","topic":"Reassessment","concept":"when-and-how-to-reassess","b":-0.5,"type":"order","stem":"During transport, a 70-year-old woman being treated for generalized weakness suddenly becomes less responsive but is still moaning. Place your reassessment steps in the correct order.","opts":["Check her level of responsiveness using AVPU","Check that the airway is open and clear","Assess the rate and quality of her breathing","Check her pulse, skin, and for any bleeding","Obtain a full set of vital signs"],"key":"When a patient changes, repeat the primary assessment first, in order, before obtaining a new set of vital signs.","why":"Any change in condition means starting over with the primary assessment: mental status, airway, breathing, then circulation, so life threats are found and treated in priority order. A full set of vital signs follows once the primary assessment is complete.","src":"STD"},{"id":"SA-016","d":"SECONDARY","topic":"Reassessment","concept":"when-and-how-to-reassess","b":-0.5,"type":"mc","stem":"You are transporting a 50-year-old man with an isolated lower leg fracture that you have splinted. He is alert, his vital signs have been normal and unchanged, and the trip will take 35 minutes. How often should you reassess him?","opts":["About every 15 minutes, and immediately if his condition changes","About every 5 minutes for the entire transport","Once more when you arrive at the hospital","Only if he reports a change in his pain"],"ans":0,"key":"Reassess a stable patient about every 15 minutes, an unstable patient about every 5, and any patient immediately when something changes.","why":"He is stable, so reassessment about every 15 minutes is appropriate, including checks of his splint and distal circulation. Any change in his condition triggers an immediate reassessment.","wrong":["","Every 5 minutes is the interval for unstable patients; he is stable.","A single check in 35 minutes would miss changes in his condition or distal circulation.","Waiting for him to report a change misses findings he may not notice, such as loss of distal pulse."],"src":"STD"},{"id":"SA-017","d":"SECONDARY","topic":"Burns","concept":"burn-extent-and-severity","b":-0.5,"type":"mc","stem":"A 35-year-old man was burned when a gas grill flared. He has partial-thickness burns covering his entire chest and abdomen and his entire right arm. His back and legs are not burned. Using the adult rule of nines, what is the approximate total body surface area burned?","opts":["18%","27%","36%","45%"],"ans":1,"key":"Adult rule of nines: anterior trunk 18%, each arm 9%, so the front of the trunk plus one arm is about 27%.","why":"In an adult, the entire anterior trunk (chest and abdomen) is 18% and each entire arm is 9%. Together that is about 27% of body surface area.","wrong":["18% counts only the anterior trunk and leaves out the burned arm.","","36% counts the arm as 18% or doubles the trunk; an adult arm is 9%.","45% adds the posterior trunk, which is not burned."],"src":"STD"},{"id":"SA-018","d":"SECONDARY","topic":"Burns","concept":"burn-extent-and-severity","b":0.5,"type":"mc","stem":"On separate calls you care for four adults with burns. All are alert with no breathing difficulty. Which patient's injury is most severe and most clearly warrants care at a burn center?","opts":["A 30-year-old with red, painful sunburn without blisters over his back and shoulders","A 28-year-old with a blistered steam burn on one forearm, about 2% of body surface","A 40-year-old with blistered grease burns that encircle both hands","A 50-year-old with a blistered scald on the front of one thigh, about 4% of body surface"],"ans":2,"key":"Partial-thickness burns of the hands, and circumferential burns, are severe regardless of the percentage burned.","why":"Burns involving the hands threaten long-term function, and burns that encircle a body part can constrict circulation as swelling develops. Both features make this a critical burn that meets burn center referral criteria despite a small percentage.","wrong":["Superficial burns without blisters are painful but are not counted in burn size and rarely need a burn center.","A small partial-thickness burn on the forearm without special-area or circumferential involvement is a minor burn.","","A 4% partial-thickness thigh burn is small and does not involve a critical area or encircle the limb."],"src":"STD"}];

/* Registry Ready — engine: grading, ability estimate, adaptive selection, spaced review, weak-domain analysis.
   Pure functions; no DOM. */

const ENGINE = (() => {
  const DKEYS = Object.keys(DOMAINS);
  const target = d => (DOMAINS[d].lo + DOMAINS[d].hi) / 2 / 100;
  const byId = Object.fromEntries(BANK.map(i => [i.id, i]));

  /* ---- grading: dichotomous, like the real exam ---- */
  function grade(item, resp) {
    if (resp == null) return false;
    if (item.type === "mc") return resp === item.ans;
    if (item.type === "mr") {
      const a = [...item.ans].sort().join(","), r = [...resp].sort().join(",");
      return a === r;
    }
    if (item.type === "order") return resp.every((v, i) => v === i) && resp.length === item.opts.length;
    if (item.type === "table") return item.rows.every((row, i) => resp[i] === row[1]);
    return false;
  }

  /* ---- Rasch ability estimate (EAP, N(0,1) prior) ---- */
  const GRID = []; for (let t = -4; t <= 4.0001; t += 0.05) GRID.push(t);
  function eap(responses) { // [{b, ok}]
    let w = GRID.map(t => Math.exp(-t * t / 2));
    for (const r of responses) {
      w = w.map((v, k) => { const p = 1 / (1 + Math.exp(-(GRID[k] - r.b))); return v * (r.ok ? p : 1 - p); });
      const s = w.reduce((a, c) => a + c, 0); w = w.map(v => v / s);
    }
    const s = w.reduce((a, c) => a + c, 0);
    const mean = GRID.reduce((a, t, k) => a + t * w[k], 0) / s;
    const v = GRID.reduce((a, t, k) => a + (t - mean) ** 2 * w[k], 0) / s;
    return { theta: mean, se: Math.sqrt(v) };
  }

  /* ---- adaptive practice exam ---- */
  const CAT = { min: 70, max: 120, cut: 0, z: 1.96, seconds: 7200 };
  function nextCatItem(session, rand = Math.random) {
    const used = new Set(session.items.map(x => x.id));
    const n = session.items.length;
    const counts = Object.fromEntries(DKEYS.map(d => [d, 0]));
    session.items.forEach(x => counts[byId[x.id].d]++);
    const order = DKEYS.map(d => ({ d, def: target(d) * (n + 1) - counts[d] })).sort((a, b) => b.def - a.def);
    const theta = session.theta ?? 0;
    for (const { d } of order) {
      const pool = BANK.filter(i => i.d === d && !used.has(i.id));
      if (!pool.length) continue;
      pool.sort((a, b) => Math.abs(a.b - theta) - Math.abs(b.b - theta));
      const top = pool.slice(0, Math.min(3, pool.length));
      return top[Math.floor(rand() * top.length)];
    }
    return null;
  }
  function catRecord(session, item, ok) {
    session.items.push({ id: item.id, ok });
    const est = eap(session.items.map(x => ({ b: byId[x.id].b, ok: x.ok })));
    session.theta = est.theta; session.se = est.se;
    return est;
  }
  function catShouldStop(session) {
    const n = session.items.length;
    if (n >= CAT.max) return "max";
    if (n >= CAT.min) {
      const lo = session.theta - CAT.z * session.se, hi = session.theta + CAT.z * session.se;
      if (lo > CAT.cut || hi < CAT.cut) return "confident";
    }
    if (!nextCatItem(session, () => 0)) return "bank";
    return null;
  }
  function catVerdict(session) {
    const lo = session.theta - CAT.z * session.se, hi = session.theta + CAT.z * session.se;
    if (lo > CAT.cut) return "above";
    if (hi < CAT.cut) return "below";
    return session.theta >= CAT.cut ? "near-above" : "near-below";
  }

  /* ---- spaced review (Leitner boxes) ---- */
  const DAY = 86400000;
  const INTERVAL = [0, 0, 1, 3, 7, 16, 35]; // days, index = box (1..6)
  function srsUpdate(srs, id, ok, now = Date.now()) {
    const c = srs[id] || { box: 0, due: now, seen: 0, right: 0 };
    c.seen++; if (ok) c.right++;
    c.box = ok ? Math.min(6, Math.max(1, c.box) + 1) : 1;
    c.due = now + (ok ? INTERVAL[c.box] * DAY : 10 * 60000); // missed: back in 10 minutes
    srs[id] = c;
    return c;
  }
  function dueItems(srs, now = Date.now()) {
    return Object.entries(srs).filter(([id, c]) => c.due <= now && byId[id]).sort((a, b) => a[1].due - b[1].due).map(([id]) => byId[id]);
  }

  /* ---- weak-domain analysis ---- */
  function domainStats(hist, window = 40) {
    const out = {};
    for (const d of DKEYS) {
      const rows = hist.filter(h => byId[h.id] && byId[h.id].d === d).slice(-window);
      const n = rows.length, right = rows.filter(r => r.ok).length;
      const acc = n ? right / n : null;
      const accForPriority = n >= 3 ? acc : 0.5;
      out[d] = { n, right, acc, weight: target(d), priority: target(d) * (1 - accForPriority), bank: BANK.filter(i => i.d === d).length };
    }
    return out;
  }
  function topicStats(hist) {
    const t = {};
    for (const h of hist) {
      const it = byId[h.id]; if (!it) continue;
      const k = it.d + "|" + it.topic;
      t[k] = t[k] || { d: it.d, topic: it.topic, n: 0, right: 0 };
      t[k].n++; if (h.ok) t[k].right++;
    }
    return Object.values(t).filter(x => x.n >= 2).map(x => ({ ...x, acc: x.right / x.n })).sort((a, b) => a.acc - b.acc);
  }
  function overallAbility(hist, last = 150) {
    const rows = hist.slice(-last).filter(h => byId[h.id]).map(h => ({ b: byId[h.id].b, ok: h.ok }));
    return rows.length ? { ...eap(rows), n: rows.length } : null;
  }

  /* ---- build a smart review queue: due first, then unseen items from the weakest domain ---- */
  function reviewQueue(state, size = 15, now = Date.now()) {
    const q = dueItems(state.srs, now).slice(0, size);
    if (q.length < size) {
      const ds = domainStats(state.hist);
      const ranked = DKEYS.slice().sort((a, b) => ds[b].priority - ds[a].priority);
      const seen = new Set(Object.keys(state.srs));
      const inQ = new Set(q.map(i => i.id));
      for (const d of ranked) {
        for (const it of BANK.filter(i => i.d === d && !seen.has(i.id) && !inQ.has(i.id)).sort((a, b) => a.b - b.b)) {
          if (q.length >= size) break;
          q.push(it); inQ.add(it.id);
        }
      }
      if (q.length < size) { // everything seen: earliest-due next
        const rest = Object.entries(state.srs).filter(([id]) => !inQ.has(id) && byId[id]).sort((a, b) => a[1].due - b[1].due);
        for (const [id] of rest) { if (q.length >= size) break; q.push(byId[id]); }
      }
    }
    return q;
  }

  function related(item) { return BANK.filter(i => i.concept && i.concept === item.concept && i.id !== item.id); }

  return { related, DKEYS, target, byId, grade, eap, CAT, nextCatItem, catRecord, catShouldStop, catVerdict, srsUpdate, dueItems, domainStats, topicStats, overallAbility, reviewQueue };
})();

/* Registry Ready — speech. Android app: native text-to-speech through the Capacitor bridge.
   Browser: Web Speech API. Every call returns a promise that settles when speaking ends or is stopped. */
const AUDIO = (() => {
  const cap = () => { const C = window.Capacitor; return !!(C && C.isNativePlatform && C.isNativePlatform() && typeof C.nativePromise === "function" && Array.isArray(C.PluginHeaders) && C.PluginHeaders.some(p => p && p.name === "TextToSpeech")); };
  const web = () => "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function";
  let rate = 1, gen = 0;
  try { rate = +localStorage.getItem("rr-rate") || 1; } catch (e) {}
  function pickVoice() {
    try {
      const v = speechSynthesis.getVoices().filter(x => /^en[-_]US/i.test(x.lang));
      return v.find(x => /natural|enhanced|premium|google/i.test(x.name)) || v[0] || null;
    } catch (e) { return null; }
  }
  function available() { return !!(cap() || web()); }
  function speak(text) {
    const my = gen;
    if (cap()) return window.Capacitor.nativePromise("TextToSpeech", "speak", { text, lang: "en-US", rate, pitch: 1, volume: 1 }).catch(() => {}).then(() => my === gen);
    if (!web()) return Promise.resolve(false);
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = rate; const v = pickVoice(); if (v) u.voice = v;
      u.onend = () => res(my === gen); u.onerror = () => res(false);
      speechSynthesis.speak(u);
    });
  }
  function stop() {
    gen++;
    if (cap()) window.Capacitor.nativePromise("TextToSpeech", "stop", {}).catch(() => {});
    else if (web()) try { speechSynthesis.cancel(); } catch (e) {}
  }
  const wait = ms => { const my = gen; return new Promise(r => setTimeout(() => r(my === gen), ms)); };
  function setRate(r) { rate = r; try { localStorage.setItem("rr-rate", String(r)); } catch (e) {} }
  return { available, speak, stop, wait, setRate, get rate() { return rate; }, get gen() { return gen; } };
})();

/* ---------- tiny DOM helper ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.setAttribute("style", v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}
const pct = x => x == null ? "—" : Math.round(x * 100) + "%";
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });

/* ---------- state + persistence ---------- */
const blank = () => ({ v: 1, srs: {}, hist: [], exams: [], skills: [], cards: {}, updated: 0 });
let S = blank();
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
let dbRef = null, saveTimer = null, writing = Promise.resolve();

function trim() {
  if (S.hist.length > 3000) S.hist = S.hist.slice(-3000);
  if (S.exams.length > 40) S.exams = S.exams.slice(-40);
  if (S.skills.length > 300) S.skills = S.skills.slice(-300);
}
function save() {
  S.updated = Date.now(); trim();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!dbRef) return;
    const body = JSON.parse(JSON.stringify(S));
    writing = writing.then(() => dbRef.set(body)).then(() => { $sync.textContent = "Synced to your account"; }).catch(() => { $sync.textContent = "Saved on this device"; });

}

/* ---------- speech helpers ---------- */
function itemSpeech(item, letters) {
  const parts = [item.stem];
  if (item.type === "mr") parts.push(`Select ${item.ans.length === 2 ? "two" : "three"}.`);
  (letters || item.opts.map((_, i) => i)).forEach((orig, k) => parts.push(`${LET[k]}. ${item.opts[orig]}.`));
  return parts.join(" ");
}
function answerSpeech(item, letters) {
  const pos = orig => LET[(letters || item.opts.map((_, i) => i)).indexOf(orig)];
  const keyed = item.type === "mc" ? [item.ans] : item.ans;
  const lead = keyed.length === 1 ? `The answer is ${pos(keyed[0])}. ${item.opts[keyed[0]]}.` : `The answers are ${keyed.map(pos).join(" and ")}.`;
  return `${lead} ${item.key || ""} ${item.why}`;
}
function speakButton(label, getText) {
  if (!AUDIO.available()) return null;
  let on = false;
  const b = h("button", { class: "btn small", type: "button", onclick: async () => {
    if (on) { AUDIO.stop(); return; }
    AUDIO.stop(); on = true; b.textContent = "Stop";
    await AUDIO.speak(getText());
    on = false; b.textContent = label;

}

/* ---------- question player ---------- */
function player(item, { feedback, onDone, footer, practice }) {
  const box = h("section", { class: "panel", "aria-live": "polite" });
  const dom = DOMAINS[item.d];
  let resp = null, done = false;
  const submit = h("button", { class: "btn primary", disabled: true, onclick: () => finish() }, "Submit");
  const body = h("div", { class: "opts" });
  let need = 0, perm = null, order, cells = [];

  const typeLabel = { mc: "Choose one", mr: "", order: "Put in order", table: "Classify each row" }[item.type];
  if (item.type === "mc" || item.type === "mr") {
    perm = shuffle(item.opts.map((_, i) => i));
    need = item.type === "mr" ? item.ans.length : 1;
    resp = item.type === "mr" ? [] : null;
    perm.forEach((orig, k) => {
      const b = h("button", { class: "opt", "aria-pressed": "false", "data-o": orig, onclick: () => {
        if (done) return;
        if (item.type === "mc") { resp = orig; body.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false")); }
        else {
          const on = resp.includes(orig);
          if (!on && resp.length >= need) return;
          resp = on ? resp.filter(x => x !== orig) : resp.concat(orig);
          b.setAttribute("aria-pressed", on ? "false" : "true");
        }
        submit.disabled = item.type === "mc" ? resp == null : resp.length !== need;
      } }, h("span", { class: "k" }, LET[k]), h("span", { class: "ot" }, item.opts[orig]));
      body.append(b);
    });
  } else if (item.type === "order") {
    do { order = shuffle(item.opts.map((_, i) => i)); } while (order.every((v, i) => v === i));
    const ol = h("ol", { class: "olist" });
    const draw = () => {
      ol.replaceChildren(...order.map((orig, k) => h("li", { "data-o": orig },
        h("span", { class: "k mono" }, k + 1), h("span", { class: "t" }, item.opts[orig]),
        h("button", { class: "btn small", "aria-label": "Move up", disabled: k === 0 || done, onclick: () => { [order[k - 1], order[k]] = [order[k], order[k - 1]]; draw(); } }, "↑"),
        h("button", { class: "btn small", "aria-label": "Move down", disabled: k === order.length - 1 || done, onclick: () => { [order[k + 1], order[k]] = [order[k], order[k + 1]]; draw(); } }, "↓"))));
    };
    draw(); body.append(ol); submit.disabled = false;
    resp = order;
  } else if (item.type === "table") {
    resp = item.rows.map(() => null);
    item.rows.forEach((row, r) => {
      const seg = h("div", { class: "seg", role: "group", "aria-label": row[0] });
      item.cols.forEach((c, ci) => seg.append(h("button", { "aria-pressed": "false", "data-c": ci, onclick: (ev) => {
        if (done) return; resp[r] = ci;
        seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === ev.currentTarget ? "true" : "false"));
        submit.disabled = resp.some(x => x == null);
      } }, c)));
      cells.push(seg);
      body.append(h("div", { class: "trow" }, h("div", null, row[0]), seg));
    });
  }

  const listen = (item.type === "mc" || item.type === "mr") ? speakButton("Listen", () => itemSpeech(item, perm)) : null;
  box.append(
    h("div", { class: "qmeta" }, h("span", { class: "label" }, dom.name), h("span", { class: "label" }, item.topic)),
    h("p", { class: "stem" }, item.stem),
    item.type === "mr" ? h("p", { class: "label", style: "color:var(--accent)" }, `Select ${need === 2 ? "two" : "three"}`) : h("p", { class: "label" }, typeLabel),
    body, h("div", { class: "row" }, submit, listen, footer || null));

  function finish() {
    if (done) return; done = true;
    AUDIO.stop();
    const ok = E.grade(item, item.type === "order" ? order.slice() : resp);
    submit.remove(); if (listen) listen.remove();
    if (!feedback) { onDone(ok, resp); return; }
    if (item.type === "mc" || item.type === "mr") {
      const right = item.type === "mc" ? [item.ans] : item.ans;
      body.querySelectorAll(".opt").forEach(b => {
        const o = +b.dataset.o;
        if (right.includes(o)) b.classList.add("is-right");
        else if (b.getAttribute("aria-pressed") === "true") b.classList.add("is-wrong");
        const reason = item.wrong && item.wrong[o];
        if (reason) b.querySelector(".ot").append(h("span", { class: "why-not" }, reason));
      });
    } else if (item.type === "order") {
      body.querySelectorAll("li").forEach((li, k) => li.classList.add(+li.dataset.o === k ? "is-right" : "is-wrong"));
      body.querySelectorAll("button").forEach(b => b.disabled = true);
    } else {
      cells.forEach((seg, r) => seg.querySelectorAll("button").forEach(b => { if (+b.dataset.c === item.rows[r][1]) b.classList.add("is-right"); }));
    }
    const rel = E.related(item);
    const fb = h("div", { class: "feedback" + (ok ? "" : " wrong") },
      h("strong", null, ok ? "Correct" : "Not quite"),
      item.type === "order" && !ok ? h("ol", { style: "margin:0;padding-left:20px" }, item.opts.map(s => h("li", null, s))) : null,
      item.key ? h("p", { class: "keyline" }, h("span", { class: "label" }, "Core principle"), h("br"), item.key) : null,
      h("p", null, item.why),
      h("p", { class: "muted", style: "font-size:.85rem" }, "Reference: " + (SRC[item.src] || item.src)));
    const next = h("button", { class: "btn primary", onclick: () => { AUDIO.stop(); onDone(ok, resp); } }, "Next");
    const more = practice && rel.length ? h("button", { class: "btn", onclick: () => { AUDIO.stop(); practice(rel, ok); } }, `Practice this principle (${rel.length})`) : null;
    const say = (item.type === "mc" || item.type === "mr") ? speakButton("Listen to explanation", () => answerSpeech(item, perm)) : speakButton("Listen to explanation", () => `${item.key || ""} ${item.why}`);
    box.append(fb, h("div", { class: "row" }, next, more, say));
    next.focus({ preventScroll: true });
  }
  return box;
}

function readiness() {
  const a = E.overallAbility(S.hist);
  if (!a || a.n < 15) return { text: "Not enough data", cls: "warn", detail: `Answer ${Math.max(0, 15 - (a ? a.n : 0))} more questions for a first estimate.`, est: null };
  const lo = a.theta - 1.96 * a.se, hi = a.theta + 1.96 * a.se;
  const est = 1 / (1 + Math.exp(-a.theta));
  if (lo > E.CAT.cut) return { text: "Above practice cut", cls: "good", est, a };
  if (hi < E.CAT.cut) return { text: "Below practice cut", cls: "bad", est, a };

        c.i++; stepSet(); window.scrollTo(0, 0);
      },
      onDone: ok => { record(item, ok, c.mode); if (ok) c.right++; else c.missed.push(item.id); c.i++; stepSet(); window.scrollTo(0, 0); } }));
}
function endSet() {
  const c = ctx; ctx = null; AUDIO.stop();
  const n = c.i;
  $view.replaceChildren(h("h1", null, "Set complete"),
    h("section", { class: "panel" },
      h("p", null, h("span", { class: "big" }, `${c.right}/${n}`), " ", h("span", { class: "muted" }, "correct")),
      c.missed.length ? h("p", null, `${c.missed.length} missed question${c.missed.length > 1 ? "s" : ""} will come back in about 10 minutes.`) : n ? h("p", null, "Nothing missed. These questions move to longer intervals.") : null,
      h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => startSet("review", E.reviewQueue(S, 15)) }, "Another review set"), h("button", { class: "btn", onclick: () => go("today") }, "Today"))));
}

function startExam() {
  AUDIO.stop();
  ctx = { mode: "exam", s: { items: [] }, t0: Date.now() };
  stepExam();
}
function stepExam() {
  const c = ctx;
  const elapsedS = Math.floor((Date.now() - c.t0) / 1000);
  if (E.catShouldStop(c.s) || elapsedS >= E.CAT.seconds) return endExam();
  const item = E.nextCatItem(c.s);
  const remain = h("span", { class: "mono" });
  const upd = () => { const left = Math.max(0, E.CAT.seconds - Math.floor((Date.now() - c.t0) / 1000)); remain.textContent = fmtTime(left) + " left"; if (left <= 0) endExam(); };
  upd(); clearInterval(c.tid); c.tid = setInterval(upd, 1000);
  const confirm = h("div", { class: "confirm", hidden: true }, h("p", null, "End the exam now? Answers so far will be scored."),
    h("div", { class: "row" }, h("button", { class: "btn", onclick: endExam }, "End and score"), h("button", { class: "btn", onclick: () => confirm.hidden = true }, "Keep going")));
  $view.replaceChildren(
    h("div", { class: "row", style: "justify-content:space-between" }, h("span", { class: "label" }, `Practice exam · question ${c.s.items.length + 1}`), remain),
    player(item, { feedback: false, footer: h("button", { class: "btn small", onclick: () => confirm.hidden = false }, "End exam"), onDone: ok => { E.catRecord(c.s, item, ok); record(item, ok, "exam"); stepExam(); window.scrollTo(0, 0); } }),
    confirm);
}
function endExam() {
  const c = ctx; if (!c || c.mode !== "exam") return;
  clearInterval(c.tid); ctx = null; AUDIO.stop();
  const s = c.s;
  if (!s.items.length) return go("exam");
  const by = {};
  for (const x of s.items) { const d = E.byId[x.id].d; by[d] = by[d] || { n: 0, right: 0 }; by[d].n++; if (x.ok) by[d].right++; }
  const verdict = E.catVerdict(s);
  const sec = Math.floor((Date.now() - c.t0) / 1000);
  S.exams.push({ t: Date.now(), n: s.items.length, theta: +s.theta.toFixed(3), se: +s.se.toFixed(3), verdict, by, sec });
  save();
  const missed = s.items.filter(x => !x.ok).map(x => E.byId[x.id]);
  $view.replaceChildren(h("h1", null, "Practice exam result"),
    h("section", { class: "panel" },
      h("span", { class: "pill " + verdictCls(verdict) }, verdictText(verdict)),
      h("p", { class: "mono" }, `${s.items.length} questions · ${s.items.filter(x => x.ok).length} correct · ${fmtTime(sec)}`),
      h("p", { class: "muted", style: "font-size:.85rem" }, "Like the real exam, the verdict depends on the difficulty of what you answered correctly, not only on percent correct.")),
    h("section", { class: "panel" }, h("h3", null, "By domain"),
      h("div", { class: "list" }, E.DKEYS.filter(d => by[d]).map(d => h("div", { class: "row", style: "justify-content:space-between" }, h("span", null, DOMAINS[d].name), h("span", { class: "mono" }, `${by[d].right}/${by[d].n}`))))),
    missed.length ? h("section", { class: "panel" }, h("h3", null, `Missed questions (${missed.length})`),
      h("p", { class: "muted", style: "font-size:.88rem" }, "These are now in your review set."),
      h("div", { class: "list" }, missed.map(it => h("div", null, h("p", null, h("strong", null, it.stem)), it.key ? h("p", { class: "keyline" }, it.key) : null)))) : null,
    h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => startSet("review", missed.length ? missed : E.reviewQueue(S, 15), "Exam review") }, missed.length ? "Review missed questions" : "Review set"), h("button", { class: "btn", onclick: () => go("today") }, "Today")));
  window.scrollTo(0, 0);
}

/* ---------- routing ---------- */
const VIEWS = { today: viewToday, exam: viewExam, study: viewStudy, skills: viewSkills, progress: viewProgress };
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  $view.replaceChildren(...VIEWS[tab]().filter(Boolean));
}
function go(t) {
  if (ctx && ctx.mode === "exam") clearInterval(ctx.tid);
  AUDIO.stop();
  ctx = null; tab = t; render(); window.scrollTo(0, 0);
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
const start = (location.hash || "").slice(1);
if (VIEWS[start]) tab = start;
render();
})();

</script>
