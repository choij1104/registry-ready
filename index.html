f pain; continue routine monitoring","Progression to decompensated shock, a late and ominous sign","A measurement error; recheck with a larger cuff before acting"],"ans":2,"key":"A falling blood pressure with worsening mental status marks decompensated shock, a late sign.","why":"Hypotension appears when the body can no longer compensate for blood loss. Together with new confusion and gray skin, it shows she is deteriorating and needs urgent care and hospital notification.","wrong":["Falling BP means compensation is failing, not that it is no longer needed.","Pain does not explain hypotension, confusion, and gray skin together.","","The reading matches her worsening mental status and skin; delaying action to recheck is dangerous."],"src":"STD"},{"id":"PA2-026","d":"PRIMARY","topic":"Shock","concept":"pediatric-shock-bp-late","b":0.5,"type":"mc","stem":"A 5-year-old boy has had vomiting and diarrhea for 2 days. He is listless and barely looks at you. HR 162, RR 30, BP 98/60, which is normal for his age. His hands and feet are cool and mottled, and capillary refill is 4 seconds. What is the best interpretation?","opts":["He is not in shock because his blood pressure is normal for his age","Compensated shock; low blood pressure is a late sign in children","His fast heart rate is from fever and anxiety, so shock is unlikely","He is in shock only if his blood pressure falls below 70 mm Hg"],"ans":1,"key":"Children keep a normal BP until late in shock; tachycardia, poor perfusion, and altered mental status come first.","why":"Children compensate strongly with heart rate and vasoconstriction, so blood pressure stays normal until they are close to collapse. Listlessness, mottling, and slow capillary refill show shock now.","wrong":["Children maintain blood pressure until late; tachycardia, mottling, and slow refill already show shock.","","A listless child with mottled skin and slow refill has a perfusion problem, not simple anxiety.","Waiting for hypotension in a child means waiting for decompensation and impending arrest."],"src":"STD"},{"id":"PA2-027","d":"PRIMARY","topic":"Shock","concept":"beta-blocker-masks-tachycardia","b":1,"type":"mc","stem":"A 78-year-old woman fell down several stairs and has a deformed, swollen thigh. She takes metoprolol and says her blood pressure is 'usually around 150.' She is pale and cool. HR 72, BP 104/68, RR 20. Why is a heart rate of 72 not reassuring?","opts":["A heart rate of 72 confirms that her blood loss is minor","Pain from the fracture is lowering her heart rate","Femur fractures slow the heart by stimulating the vagus nerve","Her beta-blocker can blunt the tachycardia of shock"],"ans":3,"key":"Beta-blockers can mask tachycardia; in older adults, judge shock by perfusion and baseline BP, not heart rate alone.","why":"Metoprolol blunts the heart rate response to blood loss. Her pale, cool skin and a BP far below her usual baseline suggest significant bleeding into the thigh despite a normal-looking pulse.","wrong":["Beta-blockers blunt the heart rate response, so a normal rate cannot rule out significant bleeding.","Pain usually raises heart rate; it does not explain a lack of tachycardia.","Femur fractures do not slow the heart; they can cause major blood loss into the thigh.",""],"src":"STD"},{"id":"PA2-028","d":"PRIMARY","topic":"Shock","concept":"beta-blocker-masks-tachycardia","b":1.5,"type":"mc","stem":"An 81-year-old man has had black, tarry stools for 2 days and nearly fainted getting out of bed. He takes atenolol for high blood pressure. He is pale, sweaty, and anxious. HR 66, BP 96/58, RR 22. His wife says his usual BP is about 140/80. How should you manage this patient?","opts":["As a high-priority patient in shock from likely GI bleeding","As stable, since his heart rate is normal","As a simple fainting episode after standing too fast","As low priority unless his heart rate rises above 100"],"ans":0,"key":"In a beta-blocked patient, relative hypotension and poor perfusion signal shock even when heart rate is normal.","why":"Tarry stools suggest upper GI bleeding. His beta-blocker can keep his pulse near normal, so the drop from his usual BP, pale sweaty skin, and near-fainting are the real signs of shock.","wrong":["","His beta-blocker can blunt tachycardia; pale, sweaty skin and a BP well below baseline indicate shock.","Near-fainting with tarry stools and poor perfusion points to blood loss, not a harmless faint.","A beta-blocked patient may never become tachycardic; waiting for HR above 100 delays care."],"src":"STD"},{"id":"PA2-029","d":"PRIMARY","topic":"Shock","concept":"shock-type-recognition","b":-0.5,"type":"mc","stem":"A 29-year-old woman ate a cookie containing peanuts 10 minutes ago. She has hives on her chest and arms, feels lightheaded, and her skin is warm and flushed. HR 124, BP 78/44, RR 24 with faint wheezes. She carries a prescribed epinephrine auto-injector. What is the best interpretation and action?","opts":["Hypovolemic shock; lay her flat and wait for ALS before giving any medication","Panic attack; coach her breathing and recheck vital signs","Anaphylactic (distributive) shock; administer her epinephrine auto-injector","Mild allergic reaction; give oral fluids and monitor during transport"],"ans":2,"key":"Hives, warm flushed skin, and hypotension after allergen exposure indicate anaphylactic (distributive) shock: give epinephrine.","why":"Anaphylaxis dilates blood vessels and causes leaky capillaries, producing distributive shock. Epinephrine is the first-line treatment and should not be delayed.","wrong":["There is no fluid loss; this is allergic distributive shock, and epinephrine should not wait for ALS.","Hives, hypotension, and wheezing after a known allergen exposure are anaphylaxis, not panic.","","Hypotension and wheezing make this anaphylaxis, not a mild reaction, and oral intake is unsafe."],"src":"STD"},{"id":"PA2-030","d":"PRIMARY","topic":"Shock","concept":"shock-type-recognition","b":0.5,"type":"mc","stem":"A 67-year-old man has had crushing chest pain for an hour. He is pale, cool, and sweaty. HR 112, BP 84/56, RR 28, SpO2 89%. You hear crackles in both lower lungs, and his neck veins are distended while he sits upright. Which type of shock is most likely?","opts":["Hypovolemic shock","Cardiogenic shock","Distributive shock","Neurogenic shock"],"ans":1,"key":"Chest pain with hypotension, crackles, and distended neck veins suggests cardiogenic shock from pump failure.","why":"When the heart fails as a pump, blood backs up into the lungs (crackles) and the veins (distended neck veins) while output falls. Hypovolemic and distributive shock do not cause this backup.","wrong":["Hypovolemic shock causes flat neck veins and clear lungs, not crackles and distended neck veins.","","Distributive shock usually has warm, flushed skin and lacks signs of fluid backing up into the lungs.","Neurogenic shock follows spinal cord injury and typically has warm skin and a slow heart rate."],"src":"STD"},{"id":"PA2-031","d":"PRIMARY","topic":"Shock","concept":"obstructive-shock-recognition","b":1.5,"type":"mc","stem":"You sealed a stab wound to a 31-year-old man's right chest with an occlusive dressing taped on all four sides. Ten minutes later he is increasingly short of breath and anxious. HR 134, BP 78/50, his neck veins are distended, and breath sounds are absent on the right. ALS is 15 minutes away. What should you do?","opts":["Add a second occlusive dressing over the first","Lay him supine with his legs raised and continue transport unchanged","Insert a needle into the right chest to release the trapped air","Briefly lift one edge of the dressing to let air escape, then reseal"],"ans":3,"key":"Signs of tension pneumothorax after an occlusive dressing: briefly lift the dressing to let air escape.","why":"Air trapped in the chest is compressing the heart and great vessels, causing obstructive shock. Lifting the dressing lets the trapped air escape, which is within EMT scope; needle decompression is not.","wrong":["Another seal traps more air and worsens the tension pneumothorax.","Positioning does not relieve trapped air; this obstructive shock needs the pressure released.","Needle decompression is outside EMT scope.",""],"src":"STD"},{"id":"PA2-032","d":"PRIMARY","topic":"Shock","concept":"compensated-shock-recognition","b":-1,"type":"mr","stem":"A 22-year-old man has a deep leg laceration with heavy bleeding that you have just controlled. You are watching for signs that he is developing shock. Which findings are early signs of shock? Select TWO.","opts":["Restlessness or anxiety","Rising heart rate","Falling systolic blood pressure","Fixed, dilated pupils","Slowing heart rate"],"ans":[0,1],"key":"Anxiety and tachycardia are early shock signs; hypotension is a late sign.","why":"Early in shock, reduced blood flow to the brain causes restlessness, and the heart speeds up to maintain output. Blood pressure falls only when compensation fails.","wrong":["","","Falling blood pressure is a late sign that compensation is failing.","Fixed, dilated pupils are a very late finding near death.","A slowing heart rate in shock usually occurs late, just before arrest."],"src":"STD"},{"id":"PA2-033","d":"PRIMARY","topic":"Shock","concept":"shock-type-recognition","b":0,"type":"table","stem":"You are reviewing five patients transported in shock. Classify each patient's most likely type of shock.","cols":["Hypovolemic","Distributive","Cardiogenic","Obstructive"],"rows":[["Pale, cool skin and a rapid pulse after a femur fracture",0],["Warm, flushed skin, hives, and low BP after a bee sting",1],["Chest pain, crackles in both lungs, and low BP",2],["Penetrating chest wound, distended neck veins, absent breath sounds on one side, and low BP",3],["Fever, warm skin, confusion, and low BP in a patient with pneumonia",1]],"key":"Shock type is recognized by cause and findings: volume loss, vessel dilation, pump failure, or mechanical obstruction.","why":"Hypovolemic shock follows fluid or blood loss; anaphylaxis and sepsis are distributive; pump failure is cardiogenic; tension pneumothorax blocks blood return and is obstructive.","src":"STD"},{"id":"PA2-034","d":"PRIMARY","topic":"Priority and transport decision","concept":"stroke-last-known-well","b":0.5,"type":"mc","stem":"At 0730 a man calls because his 69-year-old wife cannot lift her right arm and her speech is garbled. He noticed it when she woke up at 0700. She was normal when they went to bed at 2300. What time should you report as last known well?","opts":["2300, when she was last seen normal","0700, when the symptoms were discovered","0730, when the call was placed","The time your unit arrived on scene"],"ans":0,"key":"Last known well is the last time the patient was seen at baseline, not when symptoms were found.","why":"Hospital stroke treatment choices depend on how long symptoms may have been present. For a patient who wakes with symptoms, the clock starts when she was last seen normal.","wrong":["","0700 is when symptoms were discovered, not when she was last seen normal.","0730 is the time of the call, not the last time she was normal.","Arrival time has no relation to when the stroke began."],"src":"AHA"},{"id":"PA2-035","d":"PRIMARY","topic":"Priority and transport decision","concept":"stroke-last-known-well","b":-1,"type":"mc","stem":"A 74-year-old man at a shopping mall has a sudden left-sided facial droop and left arm drift. His airway is clear and breathing is adequate. His adult son was with him all morning. Before you leave the scene, which information from the son is most important to obtain?","opts":["The name of the man's primary care physician","When the son last saw his father acting normally","Whether the man had similar symptoms several years ago","The man's health insurance company and policy number"],"ans":1,"key":"For suspected stroke, get the last known well time from a witness before leaving the scene.","why":"Eligibility for time-sensitive stroke treatment depends on the last known well time. A witness may not be available at the hospital, so it must be obtained on scene.","wrong":["Useful later, but it does not affect time-sensitive stroke treatment.","","Past history helps the hospital but does not drive time-critical treatment decisions like last known well does.","Insurance has no bearing on prehospital stroke care."],"src":"AHA"},{"id":"PA2-036","d":"PRIMARY","topic":"Priority and transport decision","concept":"atypical-acs","b":0.5,"type":"mc","stem":"A 68-year-old woman with diabetes calls because she feels 'wiped out' and nauseated and became short of breath carrying laundry upstairs. She denies chest pain. She is pale and slightly sweaty. HR 98, BP 146/88, RR 20, SpO2 96%. What is the best approach?","opts":["Treat as a likely viral illness and suggest she follow up with her doctor","Treat as low blood sugar and give oral glucose before checking her level","Treat as possible acute coronary syndrome; transport promptly, ALS per protocol","Treat as anxiety and coach slow breathing before deciding on transport"],"ans":2,"key":"Women, diabetics, and older adults often have ACS without chest pain: fatigue, nausea, dyspnea, or sweating.","why":"Her age, sex, diabetes, and exertional symptoms with pale, sweaty skin fit an atypical ACS presentation. She needs prompt transport and an ECG, which ALS or the hospital can obtain.","wrong":["Fatigue, nausea, and exertional shortness of breath in an older diabetic woman can be ACS; dismissing it risks a missed heart attack.","Glucose should be measured before treating, and her presentation is more concerning for ACS.","","Anxiety is a diagnosis of exclusion; these symptoms require evaluation for ACS."],"src":"AHA"},{"id":"PA2-037","d":"PRIMARY","topic":"Priority and transport decision","concept":"atypical-acs","b":1.5,"type":"mc","stem":"An 82-year-old man says he has 'indigestion' in his upper abdomen that began 40 minutes ago while he was shoveling snow. He also feels weak and lightheaded and is sweating heavily. HR 54, BP 102/64, RR 20, SpO2 95%. He asks you to just bring him an antacid. What is the most appropriate action?","opts":["Give him the antacid and advise him to rest indoors","Have him walk to the ambulance to see whether symptoms worsen with exertion","Wait 15 minutes to see whether the discomfort settles","Treat as possible acute coronary syndrome, request ALS, and transport"],"ans":3,"key":"Exertional 'indigestion' with sweating and weakness in an older adult is possible ACS until proven otherwise.","why":"Older adults often describe cardiac ischemia as indigestion or weakness. Onset during exertion, heavy sweating, and borderline vital signs make this time-critical.","wrong":["Exertional upper abdominal discomfort with sweating and weakness may be ACS; an antacid is not appropriate EMT care here.","Exertion increases the heart's oxygen demand and can worsen ischemia.","Waiting treats a possible heart attack as if it were harmless and loses time.",""],"src":"AHA"},{"id":"PA2-038","d":"PRIMARY","topic":"Priority and transport decision","concept":"sepsis-recognition","b":0.5,"type":"mr","stem":"An 86-year-old nursing home resident with a urinary catheter is 'not herself today,' according to staff. Which findings support suspicion of sepsis? Select THREE.","opts":["Temperature of 96.0°F (35.6°C)","New confusion compared with her usual baseline","Respiratory rate of 26","A history of high blood pressure","Blood pressure of 148/86","An old, healed surgical scar on her abdomen"],"ans":[0,1,2],"key":"Sepsis in older adults may show a low temperature, new confusion, and rapid breathing rather than fever.","why":"A likely infection source (catheter) plus abnormal temperature, altered mental status, and a fast respiratory rate point toward sepsis. Older adults often do not mount a fever.","wrong":["","","","Chronic high blood pressure is not a sign of infection or sepsis.","A normal-to-high BP does not support sepsis, though it also does not rule it out.","A healed scar is not a current source of infection."],"src":"STD"},{"id":"PA2-039","d":"PRIMARY","topic":"Priority and transport decision","concept":"sepsis-recognition","b":-0.5,"type":"mc","stem":"A 70-year-old man has had painful urination and chills for 3 days. Today he is confused. His skin is hot and flushed. HR 116, BP 90/56, RR 26, SpO2 95%, temperature 102.4°F. What should you do?","opts":["Recognize likely sepsis, transport promptly, and alert the hospital","Transport non-emergently, since his oxygen saturation of 95% is normal","Encourage oral fluids and recommend he see his doctor tomorrow","Delay transport until his family can bring a medication list"],"ans":0,"key":"Infection plus confusion, rapid breathing, and low BP suggests sepsis, a time-critical condition needing early notification.","why":"Sepsis outcomes depend on early hospital treatment. Alerting the receiving facility lets them prepare antibiotics and fluids on arrival.","wrong":["","Normal SpO2 does not exclude sepsis; his low BP, tachycardia, and confusion make this time-critical.","He has signs of septic shock; delaying hospital care increases the risk of death.","A medication list is helpful but must not delay transport of a time-critical patient."],"src":"STD"},{"id":"PA2-040","d":"PRIMARY","topic":"Priority and transport decision","concept":"load-and-go","b":-0.5,"type":"mc","stem":"A 28-year-old woman was ejected from a vehicle. She responds only to pain, her abdomen is rigid, and she is pale and cool. HR 132, BP 84/52. You have controlled her external bleeding and her airway is managed. The trauma center is 15 minutes away. What is the best plan?","opts":["Complete a full head-to-toe exam on scene before moving her","Splint each suspected extremity fracture before loading","Load and transport now, continuing assessment and care en route","Wait on scene for ALS to arrive before transporting"],"ans":2,"key":"A trauma patient in shock needs minimal on-scene time; begin transport and treat en route.","why":"She likely has internal bleeding that only surgery can stop. Every minute on scene delays definitive care, so further assessment and treatment happen in the ambulance.","wrong":["A detailed exam on scene delays definitive care; it can be done en route if time allows.","Detailed splinting delays transport in a patient in shock; it can be done en route if time allows.","","Waiting for ALS delays surgical care; ALS can meet you en route if available."],"src":"FTG"},{"id":"PA2-041","d":"PRIMARY","topic":"Priority and transport decision","concept":"load-and-go","b":1,"type":"mc","stem":"You are treating a 60-year-old man with chest pain who becomes pale and confused, with BP 80/50. ALS is 15 minutes from your location, and the nearest appropriate hospital is 10 minutes away. What is the best plan?","opts":["Stay on scene and wait for ALS, since he needs advanced care","Begin transport now and arrange an ALS intercept per protocol","Stay on scene until his blood pressure improves","Request a helicopter and wait on scene for it to land"],"ans":1,"key":"Do not wait on scene for ALS when it would delay hospital arrival; transport and coordinate an intercept per protocol.","why":"The hospital can be reached sooner than ALS can arrive. Starting transport gets him to definitive care fastest, and an intercept en route can add ALS care if it helps.","wrong":["Waiting 15 minutes on scene when the hospital is 10 minutes away delays definitive care.","","His blood pressure will not improve on its own; waiting wastes time.","Waiting for an aircraft takes longer than ground transport to a hospital 10 minutes away."],"src":"STD"},{"id":"PA2-042","d":"PRIMARY","topic":"Priority and transport decision","concept":"identify-high-priority","b":-1,"type":"mc","stem":"During a busy shift you assess four patients at separate calls. Which one is a high-priority patient who needs prompt transport?","opts":["A 30-year-old with an isolated swollen ankle and a strong pedal pulse","A 45-year-old with a minor forearm laceration controlled by a dressing","A 22-year-old with a sore throat and mild fever and normal vital signs","A 58-year-old with chest pain, pale sweaty skin, and BP 86/54"],"ans":3,"key":"Chest pain with signs of poor perfusion (shock) makes a patient high priority.","why":"Chest pain with hypotension and pale, sweaty skin suggests a cardiac emergency with shock. The other patients have stable, non-life-threatening problems.","wrong":["An isolated ankle injury with good circulation is low priority.","A minor laceration with controlled bleeding is low priority.","A sore throat with mild fever and normal vital signs is not time-critical.",""],"src":"STD"},{"id":"PA2-043","d":"PRIMARY","topic":"Priority and transport decision","concept":"identify-high-priority","b":1.5,"type":"mc","stem":"A 79-year-old woman tripped over a rug at home and struck her head on a table. She is alert and oriented, with a small scalp bruise and no other injuries. She takes apixaban, a blood thinner. Her vital signs are normal. Which statement best guides your decision?","opts":["She can safely remain home because she is alert with normal vital signs","Only patients who lose consciousness need transport after a head strike","Transport is needed only if she develops a headache within the next hour","Her age and anticoagulant raise bleed risk; transport per triage guidelines"],"ans":3,"key":"Anticoagulant use and a low-level fall with head impact at age 65+ are 2021 field triage risk factors: transport.","why":"Older adults on anticoagulants can bleed inside the skull after minor falls and may look well at first. The 2021 field triage guideline lists anticoagulant use and low-level falls with significant head impact in adults 65 and older as risk factors for EMS judgment; she needs transport and evaluation at an appropriate facility.","wrong":["Alertness and normal vital signs are common early in an intracranial bleed, especially in anticoagulated older adults.","Loss of consciousness is not required; anticoagulant use is a risk factor the 2021 field triage guideline asks EMS to weigh.","Symptoms of a brain bleed can appear hours later; waiting an hour does not make her safe to stay home.",""],"src":"FTG"},{"id":"PA2-044","d":"PRIMARY","topic":"Vital signs","concept":"pulse-ox-limitations","b":0.5,"type":"mc","stem":"A family of four complains of headaches and nausea after running a generator in a closed garage during a power outage. You have moved everyone outdoors. The 40-year-old father is drowsy. HR 104, BP 138/84, RR 20, SpO2 99%. How should you interpret the pulse oximeter reading?","opts":["It confirms adequate oxygenation, so oxygen is not needed","It suggests the headaches are from the stress of the outage","It may be falsely normal because carbon monoxide reads as oxygen","It is accurate as long as the waveform is strong and steady"],"ans":2,"key":"Standard pulse oximetry can read falsely normal in carbon monoxide poisoning; trust the history and symptoms.","why":"Carbon monoxide binds hemoglobin and standard oximeters read it as oxygenated hemoglobin. Several people with the same symptoms near a generator point to CO poisoning, which is treated with high-flow oxygen.","wrong":["Standard oximeters read carbon monoxide-bound hemoglobin as oxygenated, so a high value cannot be trusted; give high-flow oxygen.","Several people with the same symptoms in a space with a generator points to CO poisoning, not stress.","","A good waveform reflects pulse detection, not whether hemoglobin carries oxygen or carbon monoxide."],"src":"STD"},{"id":"PA2-045","d":"PRIMARY","topic":"Vital signs","concept":"pulse-ox-limitations","b":-0.5,"type":"mr","stem":"A 62-year-old man rescued from a cold lake is shivering hard, and his fingers are white and cold. HR 104, RR 18. The pulse oximeter shows a weak waveform reading 82%, yet he is talking in full sentences and his lips are pink. Which factors are most likely making this reading inaccurate? Select TWO.","opts":["Poor blood flow to his cold fingers","Shivering that moves the probe","His heart rate of 104 beats per minute","His age, which is over 60 years","The fact that he is lying supine on the stretcher"],"ans":[0,1],"key":"Poor peripheral perfusion and motion cause unreliable SpO2 readings; compare the number with the patient's condition.","why":"The oximeter needs a good pulse signal at the probe site. Cold, vasoconstricted fingers and shaking both degrade the signal, so the reading must be weighed against how the patient looks.","wrong":["","","A moderately fast heart rate does not by itself cause an inaccurate reading.","Age alone does not make pulse oximetry inaccurate.","Lying supine does not affect the accuracy of the probe."],"src":"STD"},{"id":"PA2-046","d":"PRIMARY","topic":"Vital signs","concept":"glucometer-in-altered-mental-status","b":-0.5,"type":"mc","stem":"Police ask you to evaluate a 50-year-old man found slumped in his car outside a bar. He smells of alcohol, is confused, and his speech is slurred. He is sweaty. HR 102, BP 136/82, RR 16, SpO2 97%. What assessment is most important to perform next?","opts":["A field sobriety test with the officers","A blood glucose reading with a glucometer","A detailed medication history from his phone","An orthostatic blood pressure check"],"ans":1,"key":"Check blood glucose in any patient with altered mental status; hypoglycemia can mimic intoxication.","why":"Low blood sugar causes confusion, slurred speech, and sweating that look like drunkenness. A glucometer reading quickly identifies a reversible cause that the smell of alcohol could hide.","wrong":["Sobriety testing is a police function and does not identify medical causes of altered mental status.","","Medication history is useful later, but a quick glucose reading can identify a reversible cause now.","Orthostatic testing in a confused patient risks a fall and does not explain his altered mental status."],"src":"STD"},{"id":"PA2-047","d":"PRIMARY","topic":"Vital signs","concept":"glucometer-in-altered-mental-status","b":1.5,"type":"mc","stem":"A 63-year-old man with diabetes developed right-sided weakness and slurred speech 30 minutes ago. He is awake, follows commands, and swallows without difficulty. Glucometer reading is 42 mg/dL. HR 96, BP 152/90. What should you do?","opts":["Give oral glucose per protocol, reassess neuro findings, and transport","Ignore the glucose reading because his symptoms clearly indicate a stroke","Withhold glucose because sugar can worsen brain injury in stroke","Give oral glucose and cancel transport if his weakness resolves"],"ans":0,"key":"Hypoglycemia can mimic stroke; a glucometer reading is a key diagnostic test in any stroke-like presentation.","why":"Low blood sugar can cause one-sided weakness and slurred speech. Because he can swallow, oral glucose is appropriate, followed by reassessment and transport, since a true stroke may still be present.","wrong":["","Hypoglycemia can cause one-sided weakness and slurred speech that mimics stroke; the low reading must be treated.","With a confirmed low reading, correcting hypoglycemia is the priority; untreated hypoglycemia itself injures the brain.","Even if symptoms resolve, he still needs transport and evaluation; a stroke may coexist."],"src":"STD"},{"id":"PA2-048","d":"PRIMARY","topic":"Vital signs","concept":"vital-sign-trends","b":1.5,"type":"mc","stem":"A 35-year-old man struck his head in a fall from a ladder. Over 20 minutes your vital signs are: BP 132/80, then 158/84, then 184/88; HR 88, then 70, then 54. His breathing is becoming irregular, and he is less responsive. What does this trend most likely indicate?","opts":["Pain from his injuries driving up his blood pressure","Hypovolemic shock from hidden internal bleeding","A vasovagal reaction to the stress of the injury","Rising pressure inside the skull from brain injury"],"ans":3,"key":"Rising BP, falling HR, and irregular breathing after head injury (Cushing's triad) suggest rising intracranial pressure.","why":"As pressure inside the skull rises, the body raises blood pressure to keep blood flowing to the brain, and the heart slows in response. With declining responsiveness, this is a late, ominous trend.","wrong":["Pain raises both BP and heart rate; it does not slow the pulse and cause irregular breathing.","Hypovolemic shock causes a rising heart rate and falling blood pressure, the opposite of this trend.","A vasovagal reaction lowers blood pressure rather than raising it.",""],"src":"STD"},{"id":"PA2-049","d":"PRIMARY","topic":"Vital signs","concept":"vital-sign-trends","b":0.5,"type":"mc","stem":"A 41-year-old woman has a closed femur fracture after a motorcycle crash. Your vital signs every 5 minutes are: HR 92, then 108, then 124; BP 128/80, then 126/82, then 124/80. Her skin is becoming pale and cool. What is the best interpretation?","opts":["She is stable because her blood pressure has not changed","The rising heart rate is from pain and can be disregarded","She is likely developing shock from blood loss into the thigh","The readings are inconsistent, so trending them is not useful"],"ans":2,"key":"A rising heart rate trend with cooling skin, even with a stable BP, signals developing shock.","why":"A femur fracture can bleed heavily into the thigh. Blood pressure holds until late, so the steady rise in heart rate and the change in skin are the early warning.","wrong":["Blood pressure is maintained until late; a steadily rising pulse with cooling skin shows worsening compensation.","Pain can raise heart rate, but a steady climb with pale, cool skin points to blood loss.","","The trend is consistent and meaningful; repeated vital signs are how early deterioration is detected."],"src":"STD"},{"id":"PA2-050","d":"PRIMARY","topic":"Vital signs","concept":"orthostatic-changes","b":0.5,"type":"mc","stem":"A 24-year-old woman has been vomiting for 2 days and cannot keep fluids down. Lying down, her HR is 88 and BP 118/76. After she sits up for 1 minute, her HR is 118 and BP 98/64, and she feels lightheaded and nearly faints. What do these findings suggest?","opts":["Significant fluid loss (volume depletion)","Normal changes expected when anyone sits up","Anxiety about having her vital signs taken","An inner-ear problem as the cause of all her symptoms"],"ans":0,"key":"A marked rise in HR and fall in BP with lightheadedness on sitting or standing indicates volume depletion.","why":"With low blood volume, the body cannot maintain blood pressure when the patient sits up, so the heart rate jumps and she becomes lightheaded. Two days of vomiting explain the fluid loss.","wrong":["","A healthy person's heart rate rises only slightly on sitting up; a 30-beat rise with a 20-point BP drop and near-fainting is abnormal.","Anxiety does not explain a postural BP drop with near-fainting after days of vomiting.","An inner-ear problem causes vertigo but not a postural fall in BP with a large rise in heart rate."],"src":"STD"},{"id":"PA2-051","d":"PRIMARY","topic":"Vital signs","concept":"orthostatic-changes","b":-1,"type":"order","stem":"A 72-year-old man felt lightheaded after several days of diarrhea. He is alert, has no trauma, and shows no signs of shock while lying down. Medical direction asks you to obtain orthostatic vital signs. Put the steps in the correct order.","opts":["Have the patient lie supine and rest for a few minutes","Measure pulse and blood pressure while he is supine","Assist him to sit or stand, staying ready to support him","After 1 to 3 minutes, remeasure pulse and blood pressure"],"key":"Orthostatic vital signs compare resting supine values with values taken within about 1 to 3 minutes of sitting or standing.","why":"A resting supine baseline is needed for comparison. Rechecking after the position change shows whether the body can maintain blood pressure, and staying close prevents a fall if he becomes faint.","src":"STD"},{"id":"SA-001","d":"SECONDARY","topic":"History","concept":"targeted-history-questions","b":-1.5,"type":"mc","stem":"A 57-year-old man called 911 for chest discomfort. He tells you it began about 30 minutes ago while he was watching TV, nothing makes it better or worse, it feels like \"a heavy weight,\" and he rates it 7 out of 10. He is pale and diaphoretic. To complete an OPQRST pain history, which question should you ask next?","opts":["Have you taken any medications today, including any for erectile dysfunction?","Does the discomfort spread to your arm, neck, jaw, or back?","When did you last have something to eat or drink?","Has anyone in your family had a heart attack?"],"ans":1,"key":"Complete OPQRST by asking the missing element; here onset, provocation, quality, severity, and time are known, so ask about radiation.","why":"He has already described onset (at rest), provocation (nothing changes it), quality (heavy weight), severity (7/10), and time (30 minutes). Radiation is the only OPQRST element still missing, and spread to the arm, jaw, or back adds weight to a cardiac cause.","wrong":["Medication history matters, especially before any nitroglycerin, but it belongs to SAMPLE and does not complete the pain history.","","Last oral intake is a SAMPLE element; it does not complete the OPQRST pain history.","Family history adds little to the immediate prehospital assessment and is not part of OPQRST."],"src":"STD"},{"id":"SA-002","d":"SECONDARY","topic":"History","concept":"targeted-history-questions","b":-1,"type":"mc","stem":"A 61-year-old man with type 1 diabetes is sweaty, confused, and slow to answer, but he follows commands and can swallow. His glucose meter reading is low. His wife is with him. Which question to his wife is most useful right now?","opts":["Has he had any recent surgery or hospital stays?","Is he allergic to any medications or foods?","When did he last eat, and when did he last take insulin?","Who is his regular doctor, and which pharmacy does he use?"],"ans":2,"key":"Pick the SAMPLE question that explains the current problem: last oral intake and insulin timing explain a diabetic low.","why":"Last oral intake and the events leading up (insulin taken without eating) explain the hypoglycemia and predict whether it may recur after oral glucose. This answer directly shapes treatment and what you report to the receiving facility.","wrong":["Recent surgery is part of past history, but it does not explain his low glucose or change your immediate care.","Allergy history is part of SAMPLE, but it does not explain the low glucose and does not affect giving oral glucose.","","Provider and pharmacy details are administrative and do not guide his immediate assessment or treatment."],"src":"STD"},{"id":"SA-003","d":"SECONDARY","topic":"History","concept":"targeted-history-questions","b":0,"type":"mr","stem":"A 34-year-old woman reports sudden shortness of breath that began an hour ago. She returned yesterday from a 14-hour flight and takes an oral contraceptive. Her chest pain is sharp and worse with deep breaths. She says she has had no cough or fever and has never had a blood clot. Select TWO statements in your report that are pertinent negatives.","opts":["Pain worsens with deep inspiration.","Denies cough or fever.","Takes an oral contraceptive daily.","No previous history of blood clots.","Returned yesterday from a long flight."],"ans":[1,3],"key":"A pertinent negative is a relevant sign, symptom, or history item the patient does NOT have, documented because it shapes the picture.","why":"Absence of cough and fever makes an infectious cause less likely, and no prior clot history is relevant to her clot risk. Both are expected findings that are absent, which is what makes them pertinent negatives.","wrong":["This is a pertinent positive: a relevant symptom she does have.","","This is medication history and a positive risk factor she has, not an absent finding.","","This is a positive risk factor she has, not an absent finding."],"src":"STD"},{"id":"SA-004","d":"SECONDARY","topic":"History","concept":"medication-list-changes-picture","b":0.5,"type":"mc","stem":"A 78-year-old woman tripped on a rug and struck her forehead on a table. She is alert and oriented, has a small forehead bruise, and wants to stay home. Her vital signs are normal. Her medication list includes apixaban, metformin, atorvastatin, and omeprazole. Which medication most changes your assessment?","opts":["Atorvastatin, because statins commonly cause dizziness that leads to falls","Metformin, because it most likely caused low blood sugar and the fall","Omeprazole, because it can mask the early signs of internal bleeding","Apixaban, because anticoagulants raise the risk of a delayed brain bleed"],"ans":3,"key":"An anticoagulant on the medication list makes a minor head strike high risk, even when the patient looks well.","why":"Patients taking anticoagulants who strike their head can develop intracranial bleeding hours later despite a normal initial exam. This finding supports strongly encouraging transport for evaluation and must be documented and reported.","wrong":["Statins can cause muscle aches, but they do not make a head strike more dangerous; the anticoagulant does.","Metformin alone rarely causes hypoglycemia; check glucose if indicated, but it does not raise bleeding risk.","Omeprazole reduces stomach acid; it does not mask bleeding or raise head-injury risk.",""],"src":"STD"},{"id":"SA-005","d":"SECONDARY","topic":"History","concept":"medication-list-changes-picture","b":1.5,"type":"mc","stem":"A 69-year-old man has had black, tarry stools for two days and now feels faint when he stands. He is pale, and his skin is cool and moist. BP 96/62 mm Hg, HR 64, RR 20. He takes metoprolol for high blood pressure. How should his medication change your interpretation?","opts":["The beta blocker may blunt his heart rate rise, so a normal rate does not rule out shock","The beta blocker explains his low blood pressure, so blood loss is an unlikely cause of his symptoms","His normal heart rate shows compensation is adequate, so routine transport is appropriate","The beta blocker darkens the stool, so the stool color is a medication side effect"],"ans":0,"key":"Beta blockers can prevent the expected tachycardia of shock; judge perfusion by the whole picture, not heart rate alone.","why":"Metoprolol limits the heart rate rise that normally signals blood loss. With melena, orthostatic faintness, and cool, pale, moist skin, he should be treated as a patient in shock from GI bleeding despite a heart rate of 64.","wrong":["","Metoprolol may lower blood pressure, but melena with cool, pale, moist skin and faintness points to blood loss.","A normal rate here may reflect the beta blocker, not adequate compensation; his skin and history indicate shock.","Metoprolol does not darken stool; tarry stool with these signs suggests upper GI bleeding."],"src":"STD"},{"id":"SA-006","d":"SECONDARY","topic":"Physical exam","concept":"exam-finding-to-injury","b":-0.5,"type":"table","stem":"During one shift you examine four trauma patients. Match each physical exam finding with the injury it most suggests.","cols":["Basilar skull fracture","Flail chest","Pericardial tamponade","Intra-abdominal injury"],"rows":[["Bruising behind one ear that appeared the day after a fall",0],["A section of the right chest wall moves inward as the patient inhales",1],["Distended neck veins, muffled heart sounds, and low blood pressure after a stab wound to the chest",2],["Rigid, guarded abdomen that is painful to palpation after a bicycle handlebar injury",3]],"key":"Key exam findings point to specific injuries: Battle sign, paradoxical motion, Beck triad, and abdominal rigidity/guarding.","why":"Bruising behind the ear (Battle sign) develops hours after a basilar skull fracture. Paradoxical chest motion marks a flail segment. JVD, muffled heart sounds, and hypotension after penetrating chest trauma suggest tamponade, and a rigid, guarded abdomen suggests bleeding or organ injury in the abdomen.","src":"STD"},{"id":"SA-007","d":"SECONDARY","topic":"Physical exam","concept":"exam-finding-to-injury","b":0,"type":"mc","stem":"A 44-year-old unrestrained driver struck the steering wheel. He is short of breath, and his SpO2 is 90% on room air. While palpating his upper chest and neck, you feel a crackling, crispy sensation spread through the skin. What does this finding most suggest?","opts":["Fluid filling the alveoli from acute heart failure after the crash","Broken rib ends grinding together at a single fracture site","Air leaking from an injured lung or airway under the skin","Bleeding into the chest wall muscles from the steering wheel impact"],"ans":2,"key":"Crackling under the skin of the chest or neck (subcutaneous emphysema) means air is leaking from the lung or airway.","why":"Subcutaneous emphysema after blunt chest trauma indicates a pneumothorax or airway injury, and his breathing may get worse. Give oxygen, reassess breath sounds and work of breathing often, and transport promptly to a trauma center.","wrong":["Alveolar fluid is heard as crackles with a stethoscope; it is not felt under the skin of the neck.","Bony crepitus is felt at the fracture site itself, not as crackling spread through the soft tissue of the neck.","","Chest wall bleeding causes bruising and swelling, not a crackling sensation under the skin."],"src":"STD"},{"id":"SA-008","d":"SECONDARY","topic":"Physical exam","concept":"head-injury-exam-findings","b":0.5,"type":"mc","stem":"A 25-year-old man was struck in the face with a bat 3 hours ago. He has bruising around both eyes and clear fluid draining from his nose. He is drowsy but breathing adequately at 14/min with no snoring sounds. Which action is most appropriate based on these findings?","opts":["Insert a lubricated nasal airway to keep his airway open while he is drowsy","Pack both nostrils firmly with gauze to stop the clear fluid draining from his nose","Apply ice packs over both eyes and let him sleep quietly until hospital arrival","Avoid a nasal airway, keep suction ready, and recheck his mental status often"],"ans":3,"key":"Raccoon eyes with clear nasal drainage suggest a basilar skull fracture: no nasal airway, and watch mental status closely.","why":"Bruising around both eyes and clear fluid from the nose suggest a basilar skull fracture with a cerebrospinal fluid leak. A nasal airway is contraindicated, and a drowsy head-injured patient needs a ready airway plan, frequent reassessment, and spinal motion restriction.","wrong":["A nasal airway is contraindicated with signs of basilar skull fracture; his airway is currently open.","Packing blocks the drainage and raises infection risk; cover loosely with sterile gauze instead.","Letting him sleep hides a decline in mental status; a drowsy head-injured patient needs frequent checks.",""],"src":"STD"},{"id":"SA-009","d":"SECONDARY","topic":"Physical exam","concept":"head-injury-exam-findings","b":1,"type":"mc","stem":"A 52-year-old woman fell down a flight of stairs. On your arrival she opened her eyes to voice. Ten minutes later she responds only to pain. Her right pupil is now dilated and sluggish to light; the left pupil is normal. Which interpretation and action are most appropriate?","opts":["Expanding brain injury; support airway and breathing and transport rapidly to a trauma center","Likely an old eye injury; document the finding, ask about prior eye trauma, and complete the exam on scene","Probable opioid effect; give naloxone, support ventilation, and recheck her pupils in five minutes","Normal variation in pupil size; continue routine care and recheck her pupils at the hospital"],"ans":0,"key":"A new unequal pupil with falling responsiveness after head trauma signals rising intracranial pressure: a true emergency.","why":"A newly dilated, sluggish pupil together with a decreasing level of responsiveness suggests an expanding intracranial bleed compressing the brain. She needs airway support, oxygenation, ventilation if breathing becomes inadequate, spinal motion restriction, and rapid transport with reassessment every 5 minutes.","wrong":["","The pupil change is new and comes with falling responsiveness, so it cannot be dismissed as an old injury.","Opioids cause small pupils on both sides, not one dilated pupil; her history points to head injury.","A new unequal pupil with declining mental status is not normal variation and needs immediate action."],"src":"STD"},{"id":"SA-010","d":"SECONDARY","topic":"Physical exam","concept":"rapid-trauma-vs-focused-exam","b":-0.5,"type":"mr","stem":"You respond to several trauma calls during one shift. Select TWO patients who should receive a rapid full-body trauma assessment rather than an exam focused on one injury.","opts":["A 30-year-old ejected from a rolled vehicle who is confused and cannot recall the crash","A 22-year-old who cut her palm on a kitchen knife, is alert, and has controlled bleeding","A 45-year-old who twisted his ankle stepping off a curb and has no other complaints","A 67-year-old pedestrian struck by a car at 30 mph who reports back and hip pain","A 19-year-old who jammed a finger playing basketball and is otherwise uninjured"],"ans":[0,3],"key":"Significant mechanism or altered mental status calls for a rapid head-to-toe trauma assessment; isolated minor injury gets a focused exam.","why":"Ejection with confusion and a pedestrian struck by a vehicle are significant mechanisms that can hide multiple injuries, and the confused patient cannot reliably report pain. Both need a rapid full-body assessment to find life threats.","wrong":["","An alert patient with an isolated hand cut and no significant mechanism needs a focused exam of the injury.","An isolated ankle injury from a low-energy mechanism in an alert patient calls for a focused exam.","","A minor isolated finger injury in an alert patient calls for a focused exam."],"src":"STD"},{"id":"SA-011","d":"SECONDARY","topic":"Physical exam","concept":"rapid-trauma-vs-focused-exam","b":-1,"type":"mc","stem":"A 35-year-old man slipped on a wet floor and landed on an outstretched hand. He is alert and oriented, did not hit his head, and denies neck or back pain. His only complaint is a painful, swollen right wrist. His primary assessment is normal. What is the most appropriate secondary assessment?","opts":["A focused exam of the wrist and arm, including distal pulse, motor function, and sensation","A rapid full-body trauma assessment from head to toe before splinting, to find any hidden injuries","No exam is needed; splint the wrist in the position found because the injury is obvious","Spinal motion restriction first, followed by a full neurologic exam of all four extremities"],"ans":0,"key":"An alert patient with an isolated injury from a low-energy mechanism gets a focused exam, including distal pulse, motor, and sensation.","why":"With a minor mechanism, normal mental status, and one complaint, a focused exam of the injured extremity is appropriate. Checking pulse, motor function, and sensation before and after splinting detects nerve or vessel compromise.","wrong":["","A rapid full-body assessment is for significant mechanisms or patients who cannot reliably report injuries.","Even an obvious injury must be examined, including distal pulse, motor, and sensation, before splinting.","He has no indication for spinal motion restriction: he is alert, has no spinal pain, and no neurologic deficit."],"src":"STD"},{"id":"SA-012","d":"SECONDARY","topic":"Reassessment","concept":"trend-not-snapshot","b":1,"type":"mc","stem":"A 40-year-old man struck his head in a fall from a roof. Your first vital signs: BP 132/84 mm Hg, HR 90, RR 18 and regular. Twenty minutes later during transport: BP 176/96 mm Hg, HR 54, RR irregular with pauses. He is now harder to arouse. What does this trend most suggest?","opts":["Pain and anxiety producing a sympathetic stress response","Rising intracranial pressure from an expanding brain injury","Compensated hemorrhagic shock from a hidden abdominal injury","Spinal cord injury from the fall causing neurogenic shock"],"ans":1,"key":"Rising BP, falling heart rate, and irregular breathing (Cushing triad) in a head injury signal rising intracranial pressure.","why":"Hypertension, bradycardia, and an irregular respiratory pattern with declining mental status form the Cushing triad, a late sign of increasing intracranial pressure. Support airway and ventilation, notify the receiving trauma center, and reassess every 5 minutes.","wrong":["A stress response raises the heart rate; it does not cause bradycardia and irregular breathing.","","Hemorrhagic shock causes a rising heart rate and falling blood pressure, the opposite of this trend.","Neurogenic shock causes low blood pressure with a slow heart rate, not rising blood pressure."],"src":"STD"},{"id":"SA-013","d":"SECONDARY","topic":"Reassessment","concept":"trend-not-snapshot","b":1.5,"type":"mc","stem":"A 33-year-old woman has an open femur fracture after a motorcycle crash; bleeding is controlled with a tourniquet. Over 15 minutes her vital signs change from BP 122/76 mm Hg, HR 98, RR 20 to BP 112/90 mm Hg, HR 124, RR 28. She is now restless, and her skin is cool and pale. What is the best interpretation?","opts":["Her rising diastolic pressure shows she is stabilizing after the tourniquet","Her compensated shock is worsening; she needs shock care and rapid transport","Her restlessness reflects tourniquet pain; reassure her and recheck in 15 minutes","Her vital signs remain in an acceptable range, so continue care on scene"],"ans":1,"key":"Rising heart and respiratory rates, a narrowing pulse pressure, and restlessness mean shock is progressing even before systolic BP drops.","why":"Her pulse pressure narrowed from 46 to 22 mm Hg while heart rate and respiratory rate climbed and she became restless with cool, pale skin. These are signs of worsening compensated shock: recheck the tourniquet and look for other bleeding, keep her warm, expedite transport to a trauma center, and reassess every 5 minutes.","wrong":["A rising diastolic pressure with a falling systolic reflects vasoconstriction from compensation, not stabilization.","","Restlessness with tachycardia and cool skin suggests poor perfusion; a stable-patient recheck interval is too long.","A systolic BP still above 100 does not mean she is stable; the trend shows she is getting worse."],"src":"STD"},{"id":"SA-014","d":"SECONDARY","topic":"Reassessment","concept":"trend-not-snapshot","b":1.5,"type":"mc","stem":"A 16-year-old with asthma had loud wheezing and could speak only in short phrases. After you assisted with his prescribed inhaler, you reassess: he is drowsy, breath sounds are faint with no wheezing, RR 8, and SpO2 86%. What is the most appropriate action?","opts":["Document improvement, since the wheezing resolved after the inhaler","Assist with a second inhaler dose and recheck him in 15 minutes","Apply a nonrebreather mask, position him upright, and continue routine transport","Begin bag-valve-mask ventilation with oxygen and expedite transport"],"ans":3,"key":"Loss of wheezing with drowsiness, slow breathing, and falling SpO2 is respiratory failure, not improvement: ventilate.","why":"Faint breath sounds without wheezing mean little air is moving, and drowsiness with a rate of 8 and SpO2 of 86% shows he is tiring and failing. He needs assisted ventilation with a BVM and oxygen, rapid transport, and continuous reassessment.","wrong":["Wheezing that disappears while mental status and SpO2 fall signals worsening air movement, not improvement.","Another dose may be allowed per protocol, but a patient breathing 8/min with falling SpO2 needs ventilation first.","A nonrebreather cannot help a patient who is not breathing adequately; he needs ventilations.",""],"src":"STD"},{"id":"SA-015","d":"SECONDARY","topic":"Reassessment","concept":"when-and-how-to-reassess","b":-0.5,"type":"order","stem":"During transport, a 70-year-old woman being treated for generalized weakness suddenly becomes less responsive but is still moaning. Place your reassessment steps in the correct order.","opts":["Check her level of responsiveness using AVPU","Check that the airway is open and clear","Assess the rate and quality of her breathing","Check her pulse, skin, and for any bleeding","Obtain a full set of vital signs"],"key":"When a patient changes, repeat the primary assessment first, in order, before obtaining a new set of vital signs.","why":"Any change in condition means starting over with the primary assessment: mental status, airway, breathing, then circulation, so life threats are found and treated in priority order. A full set of vital signs follows once the primary assessment is complete.","src":"STD"},{"id":"SA-016","d":"SECONDARY","topic":"Reassessment","concept":"when-and-how-to-reassess","b":-0.5,"type":"mc","stem":"You are transporting a 50-year-old man with an isolated lower leg fracture that you have splinted. He is alert, his vital signs have been normal and unchanged, and the trip will take 35 minutes. How often should you reassess him?","opts":["Every 15 minutes, and at once if his condition changes","About every 5 minutes for the entire 35-minute transport","Once more on arrival, before transferring care to hospital staff","Only if he reports a change in his pain or numbness"],"ans":0,"key":"Reassess a stable patient about every 15 minutes, an unstable patient about every 5, and any patient immediately when something changes.","why":"He is stable, so reassessment about every 15 minutes is appropriate, including checks of his splint and distal circulation. Any change in his condition triggers an immediate reassessment.","wrong":["","Every 5 minutes is the interval for unstable patients; he is stable.","A single check in 35 minutes would miss changes in his condition or distal circulation.","Waiting for him to report a change misses findings he may not notice, such as loss of distal pulse."],"src":"STD"},{"id":"SA-017","d":"SECONDARY","topic":"Burns","concept":"burn-extent-and-severity","b":-0.5,"type":"mc","stem":"A 35-year-old man was burned when a gas grill flared. He has partial-thickness burns covering his entire chest and abdomen and his entire right arm. His back and legs are not burned. Using the adult rule of nines, what is the approximate total body surface area burned?","opts":["18%","27%","36%","45%"],"ans":1,"key":"Adult rule of nines: anterior trunk 18%, each arm 9%, so the front of the trunk plus one arm is about 27%.","why":"In an adult, the entire anterior trunk (chest and abdomen) is 18% and each entire arm is 9%. Together that is about 27% of body surface area.","wrong":["18% counts only the anterior trunk and leaves out the burned arm.","","36% would require counting the arm as 18%; an entire adult arm is 9%.","45% adds the posterior trunk, which is not burned."],"src":"STD"},{"id":"SA-018","d":"SECONDARY","topic":"Burns","concept":"burn-extent-and-severity","b":0.5,"type":"mc","stem":"On separate calls you care for four adults with burns. All are alert with no breathing difficulty. Which patient's injury is most severe and most clearly warrants care at a burn center?","opts":["A 30-year-old with red, painful sunburn without blisters over his back and shoulders","A 28-year-old with a blistered steam burn on one forearm, about 2% of body surface","A 40-year-old with blistered grease burns that encircle both hands","A 50-year-old with a blistered scald on the front of one thigh, about 4% of body surface"],"ans":2,"key":"Partial-thickness burns of the hands, and circumferential burns, are severe regardless of the percentage burned.","why":"Burns involving the hands threaten long-term function, and burns that encircle a body part can constrict circulation as swelling develops. Both features make this a critical burn that meets burn center referral criteria despite a small percentage.","wrong":["Superficial burns without blisters are painful but are not counted in burn size and rarely need a burn center.","A small partial-thickness burn on the forearm without special-area or circumferential involvement is a minor burn.","","A 4% partial-thickness thigh burn is small and does not involve a critical area or encircle the limb."],"src":"STD"},{"id":"TT-001","d":"TREAT","topic":"Ventilation and oxygenation","concept":"cpap-indications-contraindications","b":-0.5,"type":"mc","stem":"A 68-year-old man with heart failure woke up unable to breathe. He is sitting bolt upright, alert, and following commands. RR 30 and labored, crackles in both lungs, SpO2 86% on room air, BP 168/96, HR 112. What is the best intervention?","opts":["Apply oxygen by nasal cannula at 2 L/min and transport him sitting up","Lay him supine on the stretcher and apply a nonrebreather mask at 15 L/min","Apply CPAP per protocol and coach him to tolerate the mask","Begin bag-valve-mask ventilations at 1 breath every 6 seconds with oxygen"],"ans":2,"key":"An alert, cooperative patient with pulmonary edema, respiratory distress, and adequate BP is a CPAP candidate.","why":"He is in respiratory distress with hypoxia and signs of pulmonary edema, yet he is alert, protecting his airway, and normotensive. CPAP recruits fluid-filled alveoli and reduces work of breathing, often avoiding the need for assisted ventilation.","wrong":["Low-flow cannula oxygen is inadequate for severe hypoxia and distress from pulmonary edema.","Lying flat worsens dyspnea from pulmonary edema, and a nonrebreather gives no positive pressure.","","He is breathing spontaneously at an adequate rate with intact mental status; BVM ventilation is for inadequate breathing."],"src":"STD"},{"id":"TT-002","d":"TREAT","topic":"Ventilation and oxygenation","concept":"cpap-indications-contraindications","b":0.5,"type":"mr","stem":"You are deciding whether CPAP is appropriate for a 74-year-old woman with severe shortness of breath. Which TWO of the following findings, if present, would be contraindications to CPAP? Select TWO.","opts":["She opens her eyes only to painful stimuli","Her blood pressure is 80/52 mm Hg","She has COPD and audible expiratory wheezing","Her respiratory rate is 28 with accessory muscle use","Her SpO2 is 88% despite a nonrebreather mask"],"ans":[0,1],"key":"CPAP requires a patient who is alert enough to protect the airway and has adequate blood pressure.","why":"CPAP needs a conscious patient who can follow commands and protect the airway; a patient responding only to pain needs assisted ventilation instead. Positive pressure reduces venous return, so hypotension is a contraindication.","wrong":["","","A COPD exacerbation with distress in an alert patient is a common CPAP indication.","Tachypnea with accessory muscle use is the distress CPAP is meant to treat.","Persistent hypoxia despite high-flow oxygen supports the use of CPAP rather than ruling it out."],"src":"STD"},{"id":"TT-003","d":"TREAT","topic":"Ventilation and oxygenation","concept":"cpap-indications-contraindications","b":1.5,"type":"mc","stem":"Ten minutes after you start CPAP on a 61-year-old man with COPD, he becomes difficult to arouse. His respirations drop to 8/min and shallow, and SpO2 falls from 90% to 82%. What should you do next?","opts":["Remove CPAP and ventilate with a bag-valve mask and oxygen","Increase the CPAP pressure setting to improve his oxygenation","Replace CPAP with a nonrebreather mask at 15 L/min","Continue CPAP and recheck his mental status in 5 minutes"],"ans":0,"key":"Falling mental status or hypoventilation on CPAP means CPAP has failed; switch to assisted ventilation.","why":"CPAP only supports a patient who is breathing adequately on his own. Decreasing responsiveness with a slow, shallow rate is respiratory failure, so the EMT removes CPAP and provides BVM ventilation with oxygen.","wrong":["","More pressure does not fix hypoventilation; CPAP depends on adequate spontaneous breathing.","A nonrebreather cannot help a patient who is not moving enough air; he needs assisted ventilation.","Waiting lets hypoventilation progress toward arrest; he needs ventilation now."],"src":"STD"},{"id":"TT-004","d":"TREAT","topic":"Ventilation and oxygenation","concept":"positioning-for-breathing","b":-1,"type":"mc","stem":"A 72-year-old woman with COPD is in severe respiratory distress. She is alert, leaning forward with her hands on her knees, and resists lying back. You have applied oxygen. How should you position her for transport?","opts":["Supine on the stretcher with her legs elevated about 12 inches","Left lateral recumbent with her knees drawn up toward her chest","Supine and secured flat to keep her from moving during transport","Sitting upright on the stretcher in her position of comfort"],"ans":3,"key":"An alert patient in respiratory distress is transported sitting upright in a position of comfort.","why":"Sitting upright lets the diaphragm descend and the accessory muscles work, reducing the work of breathing. An alert patient who chooses a tripod position is telling you how she breathes best.","wrong":["Lying flat with the legs raised increases work of breathing and is not a treatment for dyspnea.","The lateral position is for patients who cannot protect their own airway; she is alert and needs upright positioning.","There is no trauma indication, and lying flat worsens her dyspnea.",""],"src":"STD"},{"id":"TT-005","d":"TREAT","topic":"Ventilation and oxygenation","concept":"positioning-for-breathing","b":0.5,"type":"mc","stem":"A 50-year-old man is found unresponsive on a couch after heavy drinking. There is no sign of trauma. He is breathing 16/min with good chest rise, SpO2 95%, and he has vomited. After you suction his mouth, how should you position him?","opts":["Supine, with your partner holding a head-tilt chin-lift","Supine with the foot of the stretcher raised above his head","Semi-sitting at 45 degrees with his head supported by a pillow","On his side in the recovery position, with suction ready"],"ans":3,"key":"An unresponsive, adequately breathing patient without suspected spinal injury goes in the recovery position.","why":"He is breathing adequately but cannot protect his airway and has already vomited. The lateral recovery position lets fluid drain from the mouth and reduces aspiration risk while you keep suction ready.","wrong":["Supine positioning leaves him at high risk of aspirating more vomit, even with a manual maneuver.","Head-down positioning increases aspiration risk and has no benefit here.","Semi-sitting lets his head fall forward or back and does not drain the airway.",""],"src":"STD"},{"id":"TT-006","d":"TREAT","topic":"Medications","concept":"aspirin-acs","b":-1,"type":"mc","stem":"A 58-year-old man has had crushing substernal chest pain for 20 minutes. He is alert, has no allergies, takes no blood thinners, and denies recent bleeding. BP 150/88, HR 96, SpO2 97%. Your protocol includes aspirin for suspected acute coronary syndrome. What should you do?","opts":["Apply a nonrebreather mask and leave aspirin for the emergency department","Have him swallow an adult aspirin whole with a full glass of water","Give chewable aspirin per protocol and have him chew it","Withhold aspirin until a 12-lead ECG confirms a heart attack"],"ans":2,"key":"Suspected ACS without contraindications: give chewable aspirin per protocol; do not wait for diagnostic confirmation.","why":"Aspirin reduces platelet aggregation and lowers mortality in ACS, and chewing speeds absorption. He has no allergy or bleeding history, so it should be given promptly on clinical suspicion.","wrong":["His SpO2 is normal so high-flow oxygen is not indicated, and delaying aspirin loses its benefit.","Aspirin for ACS is chewed for faster absorption; swallowing it whole with a large volume of water is not the method.","","Aspirin is given on clinical suspicion of ACS and should not wait for ECG confirmation."],"src":"STD"},{"id":"TT-007","d":"TREAT","topic":"Medications","concept":"aspirin-acs","b":0,"type":"mr","stem":"A 64-year-old woman has chest pressure radiating to her jaw. You are preparing to give aspirin per protocol. Which findings would make you withhold aspirin? Select TWO.","opts":["Hives and throat swelling the last time she took aspirin","Black, tarry stools over the past two days","She took her daily low-dose aspirin this morning","She is 64 years old and has diabetes","She is nauseated and sweating"],"ans":[0,1],"key":"Aspirin is withheld for known aspirin allergy and for signs of active bleeding such as GI bleeding.","why":"A prior allergic reaction to aspirin could recur as anaphylaxis. Black, tarry stools suggest an active upper GI bleed, which aspirin's antiplatelet effect would worsen.","wrong":["","","A daily low-dose aspirin is not a contraindication; follow protocol for the ACS dose.","Age and diabetes raise ACS risk; they are not reasons to withhold aspirin.","Nausea and diaphoresis are typical ACS findings, not contraindications."],"src":"STD"},{"id":"TT-008","d":"TREAT","topic":"Medications","concept":"nitro-assist-criteria","b":0,"type":"mc","stem":"A 62-year-old man with prescribed nitroglycerin has chest pain. BP 138/84, HR 88. During your history he mentions he took tadalafil for erectile dysfunction last night. He asks you to help him take a nitroglycerin tablet. What is the best action?","opts":["Assist with one tablet, since his blood pressure is adequate","Lay him supine first, then assist him with one tablet","Assist with half a tablet to reduce the chance of a drug interaction","Withhold nitroglycerin and notify medical direction of the tadalafil use"],"ans":3,"key":"Recent PDE-5 inhibitor use contraindicates nitroglycerin, regardless of the current blood pressure.","why":"Combining nitrates with a PDE-5 inhibitor can cause severe, prolonged hypotension; nitrates are avoided within 24 hours of sildenafil or vardenafil and within 48 hours of tadalafil. The EMT withholds nitroglycerin, reports the drug use, and continues other chest pain care such as aspirin if not contraindicated.","wrong":["A normal BP now does not protect against the profound hypotension caused by the interaction.","Positioning does not make the combination safe; the drug should not be given.","EMTs do not alter the prescribed dose, and any nitrate is contraindicated after recent PDE-5 inhibitor use.",""],"src":"STD"},{"id":"TT-009","d":"TREAT","topic":"Medications","concept":"nitro-assist-criteria","b":0.5,"type":"table","stem":"Each patient below has chest pain and asks for help with nitroglycerin. Classify whether the EMT should assist (with protocol or medical direction) or withhold it.","cols":["Assist per protocol","Withhold"],"rows":[["Alert, BP 146/90, own unexpired prescription, no PDE-5 inhibitor use",0],["Took sildenafil 6 hours ago; BP 132/80",1],["Pale and clammy with BP below the protocol minimum",1],["The tablets are prescribed to the patient's spouse",1],["Pain persists after one dose, BP still 150/92, protocol allows a repeat dose",0]],"key":"Assist only with the patient's own nitroglycerin when BP is adequate and there is no PDE-5 inhibitor use.","why":"The rights of medication administration require the right patient and right drug, so a spouse's prescription is not used. Hypotension and recent PDE-5 inhibitor use are contraindications, while a repeat dose with adequate BP follows protocol.","src":"STD"},{"id":"TT-010","d":"TREAT","topic":"Medications","concept":"epi-auto-injector-anaphylaxis","b":-0.5,"type":"mc","stem":"A 24-year-old woman was stung by a wasp 10 minutes ago. She has hives across her trunk, a hoarse voice, wheezing, and BP 84/50. She carries her own prescribed epinephrine auto-injector. What should you do first?","opts":["Apply a cold pack to the sting site and reassess her in 5 minutes","Give high-flow oxygen and reassess before deciding on epinephrine","Have her take the diphenhydramine tablets she carries in her purse","Administer her epinephrine auto-injector into the lateral thigh"],"ans":3,"key":"Anaphylaxis with airway or circulatory involvement is treated first with the patient's epinephrine auto-injector.","why":"Hoarseness, wheezing, and hypotension after a sting indicate anaphylaxis. Epinephrine reverses airway swelling, bronchospasm, and vasodilation, and any delay worsens outcomes; the lateral thigh is the injection site.","wrong":["A cold pack does nothing for airway swelling or shock from anaphylaxis.","Oxygen is supportive, but delaying epinephrine in anaphylaxis with airway and circulatory signs is harmful.","Oral antihistamines act slowly, are not an EMT treatment, and do not reverse airway swelling or shock.",""],"src":"STD"},{"id":"TT-011","d":"TREAT","topic":"Medications","concept":"epi-auto-injector-anaphylaxis","b":0.5,"type":"mc","stem":"Four minutes ago you gave a 30-year-old man his epinephrine auto-injector for anaphylaxis. His wheezing has eased and BP rose from 82/50 to 108/70. He now feels shaky and anxious, and his heart rate is 124. What is the most appropriate next step?","opts":["Explain that tremor is an expected effect, keep reassessing, and transport","Give a second auto-injector now because his heart rate is elevated","Stop oxygen and allow him to refuse transport since he has improved","Apply a constricting band above the injection site to slow absorption"],"ans":0,"key":"After epinephrine, reassess and transport; tachycardia and tremor are expected effects, and symptoms can return.","why":"Shakiness, anxiety, and tachycardia are common epinephrine side effects and show the drug is working. Anaphylaxis can recur as the drug wears off, so the EMT reassesses vital signs and breathing, documents the time given, and transports.","wrong":["","Tachycardia is an expected side effect, not an indication for another dose; repeat dosing is for persistent or returning anaphylaxis per protocol.","Symptoms can return as epinephrine wears off, so he needs transport and ongoing reassessment.","Restricting absorption would blunt the drug's effect and is not done."],"src":"STD"},{"id":"TT-012","d":"TREAT","topic":"Medications","concept":"mdi-assist","b":0,"type":"order","stem":"Medical direction approves assisting a 19-year-old with asthma, who is alert and can follow instructions, with her prescribed albuterol metered-dose inhaler. Place the steps in the correct order.","opts":["Confirm the inhaler is prescribed to her, is the right drug, and is not expired","Shake the inhaler","Have her exhale fully","Have her seal her lips on the mouthpiece and inhale deeply as the canister is pressed","Have her hold her breath as long as comfortable, then exhale","Reassess her breathing, SpO2, and vital signs and document the dose"],"key":"Assisting with an MDI: verify the rights, shake, exhale, inhale with actuation, hold breath, then reassess.","why":"Verifying right patient, drug, and expiration comes before any administration. A full exhalation followed by a deep inhalation during actuation and a breath hold delivers the drug to the lungs, and reassessment shows whether it worked.","src":"STD"},{"id":"TT-013","d":"TREAT","topic":"Medications","concept":"mdi-assist","b":1.5,"type":"mc","stem":"A 16-year-old with asthma has used his albuterol inhaler repeatedly at home without relief. He is now drowsy and speaks one word at a time. RR 8 and shallow, SpO2 84%, with very little wheezing heard. His mother hands you the inhaler. What is the best action?","opts":["Assist him with two puffs of his albuterol, then reassess","Apply CPAP and coach him to slow his breathing","Apply a nonrebreather mask at 15 L/min and let him rest","Ventilate with a bag-valve mask and oxygen and request ALS"],"ans":3,"key":"A drowsy asthmatic with slow, shallow breaths and a quiet chest needs assisted ventilation, not an inhaler.","why":"Altered mental status, a falling respiratory rate, and diminished wheezing signal impending respiratory arrest. He cannot take the deep, coordinated breath an MDI needs, so the priority is BVM ventilation with oxygen and ALS support.","wrong":["He cannot generate an effective inhalation, and failing ventilation must be supported first.","CPAP requires an alert patient breathing adequately on his own; he is hypoventilating with altered mental status.","A nonrebreather cannot help a patient who is not moving enough air.",""],"src":"STD"},{"id":"TT-014","d":"TREAT","topic":"Medications","concept":"oral-glucose-criteria","b":-1,"type":"mc","stem":"A 47-year-old man with diabetes is confused and sweaty after skipping lunch. He answers slowly but is awake, follows commands, and swallows without difficulty. His glucose reads 42 mg/dL. What should you do?","opts":["Withhold treatment and request ALS for intravenous dextrose","Give nothing by mouth and transport him in the recovery position","Help him take a dose of his own prescribed insulin","Give oral glucose per protocol and reassess his mental status"],"ans":3,"key":"Oral glucose is for a hypoglycemic patient who is awake enough to swallow and protect the airway.","why":"He has symptomatic hypoglycemia, a history of diabetes, and an intact gag and swallow. Oral glucose is within EMT scope and works quickly; reassessing mental status shows whether it is effective.","wrong":["He meets criteria for oral glucose now, and waiting delays treatment of symptomatic hypoglycemia.","He can swallow and protect his airway, so withholding oral glucose is unnecessary.","Insulin lowers blood glucose further and is not an EMT medication.",""],"src":"STD"},{"id":"TT-015","d":"TREAT","topic":"Medications","concept":"ventilate-before-naloxone","b":0,"type":"mc","stem":"A 30-year-old man is found unresponsive with a syringe nearby. He has a carotid pulse of 60, respirations 4/min and shallow, cyanotic lips, and pinpoint pupils. Your partner is preparing intranasal naloxone. What should you do first?","opts":["Hold airway care until naloxone has had time to take effect","Apply a nonrebreather mask at 15 L/min and monitor","Begin chest compressions at 100 to 120 per minute","Open the airway and ventilate with a bag-valve mask and oxygen"],"ans":3,"key":"In opioid overdose with a pulse and inadequate breathing, ventilate first; naloxone is given in addition.","why":"His immediate threat is hypoxia from respiratory depression. Bag-valve-mask ventilation with oxygen corrects it right away, while naloxone takes minutes to work and is given alongside ventilation, not instead of it.","wrong":["Waiting for naloxone leaves him hypoxic for minutes; ventilation must not be delayed.","A nonrebreather cannot help a patient breathing 4 shallow breaths per minute.","He has a pulse, so compressions are not indicated; he needs ventilation.",""],"src":"AHA"},{"id":"TT-016","d":"TREAT","topic":"Medical emergencies","concept":"seizure-care","b":0.5,"type":"mc","stem":"A 35-year-old woman with epilepsy has had one generalized seizure after another for 8 minutes without regaining consciousness. She is still seizing and has cyanosis around her lips. What is the best management?","opts":["Place a bite block between her teeth and hold her arms still to prevent injury","Wait for the seizure activity to stop on its own before beginning any care","Protect her from injury, suction and give oxygen, request ALS, and transport promptly","Give oral glucose between her cheek and gum in case her blood sugar is low"],"ans":2,"key":"Continuous or back-to-back seizures without recovery are status epilepticus: protect, support airway, get ALS, transport.","why":"Seizures lasting more than about 5 minutes or recurring without return of consciousness are status epilepticus, which causes hypoxia and brain injury. The EMT prevents injury, maintains the airway with suction and oxygen, and gets her to ALS and definitive care quickly.","wrong":["Objects in the mouth can break teeth or obstruct the airway, and restraining limbs can cause injury.","Status epilepticus is an emergency; waiting allows hypoxia and brain injury to progress.","","Nothing should be put in the mouth of a seizing patient; she cannot swallow safely."],"src":"STD"},{"id":"TT-017","d":"TREAT","topic":"Medical emergencies","concept":"stroke-time-and-destination","b":-1,"type":"mc","stem":"A 66-year-old man's wife says he was fine at breakfast 45 minutes ago, then suddenly could not lift his right arm and his speech became slurred. He is alert. BP 178/100, HR 84, SpO2 97%. What is the most important information to obtain and report?","opts":["The exact time he was last known to be well","A complete list of every surgery he has had","Whether his symptoms improve after a dose of aspirin","A series of blood pressures taken on scene before moving him"],"ans":0,"key":"In suspected stroke, the last-known-well time determines treatment options and must be obtained and reported.","why":"Clot-dissolving and clot-removal treatments are time-limited, and eligibility is based on when the patient was last known to be normal. Getting this time accurately from a witness and reporting it early lets the hospital prepare.","wrong":["","A full surgical history is lower priority than time-critical stroke information and should not delay transport.","Aspirin is not given for suspected stroke in the field because a hemorrhagic stroke cannot be ruled out.","Extra scene time delays treatment; vital signs are repeated en route."],"src":"STD"},{"id":"TT-018","d":"TREAT","topic":"Medical emergencies","concept":"oral-glucose-criteria","b":0,"type":"mc","stem":"A 58-year-old woman with diabetes is found by her daughter in bed. She moans only to painful stimulus, with snoring respirations at 14/min and SpO2 93%. Her glucose reads 31 mg/dL. The daughter hands you a tube of oral glucose. What is the most appropriate action?","opts":["Squeeze the full tube of oral glucose between her cheek and gum now","Have the daughter give her small sips of orange juice while you transport","Open the airway, give oxygen, request ALS, and do not give oral glucose","Leave her supine as found and recheck her glucose level in 10 minutes"],"ans":2,"key":"Oral glucose is withheld from a patient who cannot swallow or protect the airway; manage the airway and get ALS.","why":"She responds only to pain and has snoring respirations, so she cannot protect her airway and could aspirate anything given by mouth. The EMT opens and maintains the airway, gives oxygen, and requests ALS for intravenous dextrose.","wrong":["She cannot swallow or protect her airway, so oral glucose could be aspirated.","Any oral fluid risks aspiration in a patient without an adequate gag and swallow.","","She will not improve without treatment, and her snoring airway needs to be opened now."],"src":"STD"},{"id":"TT-019","d":"TREAT","topic":"Medical emergencies","concept":"toxidrome-recognition","b":1,"type":"mr","stem":"A 27-year-old man is found unresponsive at a party. Bystanders say he took some pills. Which findings would most strongly support an opioid toxidrome? Select THREE.","opts":["Pupils constricted to pinpoint size","Respiratory rate of 6 with shallow breaths","Depressed level of consciousness","Hot, dry, flushed skin","Widely dilated pupils","Agitation with a heart rate of 140"],"ans":[0,1,2],"key":"The opioid toxidrome is depressed consciousness, respiratory depression, and pinpoint pupils.","why":"Opioids depress the brainstem respiratory drive and level of consciousness and constrict the pupils. Recognizing the pattern points the EMT to ventilation and naloxone.","wrong":["","","","Hot, dry, flushed skin suggests an anticholinergic agent.","Dilated pupils point toward stimulants or anticholinergic agents.","Agitation with marked tachycardia suggests a sympathomimetic agent."],"src":"STD"},{"id":"TT-020","d":"TREAT","topic":"Medical emergencies","concept":"toxidrome-recognition","b":1.5,"type":"table","stem":"
