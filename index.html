Your agency is reviewing poisoning calls from the past month. Classify each set of findings by the toxidrome it most likely represents.","cols":["Opioid","Sympathomimetic","Cholinergic","Anticholinergic"],"rows":[["Unresponsive, pinpoint pupils, respirations 6/min",0],["Agitated, dilated pupils, sweating, HR 150, BP 190/110",1],["Farmworker with drooling, tearing, wheezing, vomiting, small pupils",2],["Confused, hot dry red skin, dilated pupils, urinary retention",3]],"key":"Toxidromes are recognized by pattern: pupils, skin, mental status, vital signs, and secretions.","why":"Opioids cause sedation, small pupils, and slow breathing. Stimulants cause agitation, sweating, tachycardia, and hypertension; organophosphate (cholinergic) poisoning causes excess secretions and bronchorrhea; anticholinergics cause dry, hot skin, dilated pupils, confusion, and urinary retention.","src":"STD"},{"id":"TT-021","d":"TREAT","topic":"Medical emergencies","concept":"safe-restraint","b":0,"type":"mc","stem":"Police ask you to transport a combative 32-year-old man who is a danger to himself. Medical direction approves physical restraint per protocol. Which restraint position is safest?","opts":["Prone, with his wrists and ankles tied together behind him","Seated upright, with a blanket wrapped tightly around his chest","Prone, with an officer kneeling on his back until he is calm","Supine or on his side, limbs secured, with continuous airway monitoring"],"ans":3,"key":"Restrained patients are kept supine or on the side, never prone or hobbled, with continuous monitoring.","why":"Prone and hobbled positions and pressure on the back restrict chest movement and are linked to positional asphyxia and sudden death. Supine or lateral restraint lets the EMT watch the airway and breathing throughout transport.","wrong":["Prone hog-tie positioning is associated with positional asphyxia and sudden death.","A tightly wrapped chest restricts breathing.","Weight on the back restricts chest expansion and can cause asphyxia.",""],"src":"STD"},{"id":"TT-022","d":"TREAT","topic":"Medical emergencies","concept":"safe-restraint","b":1.5,"type":"mc","stem":"A 28-year-old man is restrained on your stretcher for severe agitation. He has been shouting and struggling, is sweating, and is hot to the touch. Halfway to the hospital he suddenly becomes quiet and still. What should you do immediately?","opts":["Check his responsiveness, breathing, and pulse","Note the time he calmed down and recheck vitals on arrival","Loosen one restraint to reward him for calming down","Place a spit hood over his face to prevent more shouting"],"ans":0,"key":"A sudden calm in an agitated, restrained patient may be respiratory or cardiac arrest; assess at once.","why":"Severely agitated, hyperthermic patients who struggle against restraint are at risk of sudden cardiac arrest. Abrupt quiet is a warning sign, so the EMT immediately checks responsiveness, breathing, and pulse and is ready to start CPR.","wrong":["","Waiting until arrival could miss an arrest that needs immediate CPR.","Loosening a restraint does not address possible arrest and may create a safety risk.","A spit hood does not address sudden collapse and can hide airway problems."],"src":"STD"},{"id":"TT-023","d":"TREAT","topic":"Medical emergencies","concept":"sepsis-recognition","b":0.5,"type":"mr","stem":"An 81-year-old nursing home resident has new confusion and two days of painful urination. Temperature 101.8°F, HR 118, RR 26, BP 88/54, SpO2 93%. Which actions are most appropriate? Select TWO.","opts":["Apply oxygen and closely monitor her mental status and vital signs for worsening shock","Notify the receiving hospital early that you suspect sepsis","Stay on scene to complete a detailed head-to-toe exam first","Give her oral fluids to treat dehydration before leaving","Treat the confusion as her baseline dementia and transport non-emergently"],"ans":[0,1],"key":"Suspected sepsis with hypotension: support oxygenation and perfusion, transport promptly, and pre-notify the hospital.","why":"Fever, tachycardia, tachypnea, hypotension, and new confusion with a likely urinary source suggest septic shock. The EMT supports oxygenation (SpO2 93%), watches for deterioration, transports promptly, and pre-notifies the hospital so antibiotics and fluids can start quickly.","wrong":["","","Prolonged scene time delays definitive treatment for septic shock.","A confused patient should not be given oral fluids because of aspiration risk.","New confusion with fever and hypotension is an emergency and should not be assumed to be baseline."],"src":"STD"},{"id":"TT-024","d":"TREAT","topic":"Trauma","concept":"open-chest-wound","b":-0.5,"type":"mc","stem":"A 25-year-old man was stabbed in the right chest. You hear air moving through the wound with each breath and see bubbling blood. He is alert, RR 28, SpO2 91%. After covering the wound with your gloved hand, what is the best next step?","opts":["Pack the wound tightly with hemostatic gauze","Decompress the chest with a needle in the second intercostal space","Cover the wound with a loosely taped dry gauze pad","Apply a vented chest seal or occlusive dressing per protocol"],"ans":3,"key":"An open (sucking) chest wound is sealed with a vented chest seal or occlusive dressing per protocol.","why":"An occlusive seal stops air from entering the pleural space through the wound. A vented seal lets air escape on exhalation, which lowers the risk of tension pneumothorax.","wrong":["Wound packing is for extremity and junctional bleeding, and it does not seal an open chest wound.","Needle decompression is outside EMT scope.","Gauze alone lets air keep entering the chest.",""],"src":"STD"},{"id":"TT-025","d":"TREAT","topic":"Trauma","concept":"open-chest-wound","b":1.5,"type":"mc","stem":"You sealed a gunshot wound to a man's left chest with a non-vented occlusive dressing. Ten minutes later he is anxious, RR 36, SpO2 84%, BP 80/50, with distended neck veins and absent breath sounds on the left. What should you do?","opts":["Apply a second occlusive dressing over the first one to make the seal more airtight","Lay him flat and elevate his legs about 12 inches to treat the hypotension","Briefly lift a corner of the dressing to release trapped air, then reseal and expedite ALS","Increase the oxygen flow rate, leave the dressing in place, and reassess in 5 minutes"],"ans":2,"key":"Signs of tension pneumothorax after sealing a chest wound: briefly unseal (burp) the dressing and expedite ALS.","why":"Worsening distress, hypotension, distended neck veins, and absent breath sounds after a seal suggest air trapped under pressure. Lifting the dressing edge may let air escape, and the patient needs rapid transport and ALS for decompression.","wrong":["More sealing traps more air and worsens tension physiology.","Leg elevation does not relieve the pressure collapsing his lung and impeding venous return.","","Waiting allows tension pneumothorax to progress to cardiac arrest."],"src":"STD"},{"id":"TT-026","d":"TREAT","topic":"Trauma","concept":"wound-stabilize-do-not-remove","b":-1,"type":"mc","stem":"A 40-year-old woman has a knife wound to the abdomen with a loop of intestine protruding. She is alert, BP 112/70, HR 104. What is the correct wound care?","opts":["Gently push the intestine back inside and tape a dressing over the wound","Cover the organs with dry sterile gauze and place an ice pack on top","Apply a firm pressure dressing directly over the exposed intestine","Cover with a moist sterile dressing and an occlusive layer, and keep her warm"],"ans":3,"key":"An evisceration is covered with a moist sterile dressing and an occlusive layer; organs are never replaced.","why":"Moist sterile dressings keep exposed bowel from drying, and an occlusive covering limits heat and moisture loss. Pushing organs back in risks contamination and injury.","wrong":["Replacing organs risks infection and further injury.","Dry gauze sticks to tissue, and cold promotes heat loss.","Pressure on exposed bowel can damage it and reduce its blood flow.",""],"src":"STD"},{"id":"TT-027","d":"TREAT","topic":"Trauma","concept":"wound-stabilize-do-not-remove","b":-0.5,"type":"mc","stem":"A construction worker has a 10-inch piece of rebar impaled in his left thigh. Bleeding around it is minimal, and he is alert with normal vital signs. Transport will take 15 minutes. How should you manage the object?","opts":["Remove it slowly and then apply direct pressure to the wound","Have it cut flush with the skin so it fits on the stretcher","Stabilize it in place with bulky dressings and secure it","Pull it out partway to judge how deep it goes"],"ans":2,"key":"Impaled objects are stabilized in place unless they obstruct the airway or prevent CPR.","why":"The object may be tamponading damaged vessels, so removing or moving it can cause severe bleeding. Bulky dressings around it limit movement during transport.","wrong":["Removal can unleash uncontrolled bleeding; impaled objects stay in place.","Cutting it flush removes your ability to stabilize it and may move it deeper.","","Any movement can worsen tissue injury and bleeding."],"src":"STD"},{"id":"TT-028","d":"TREAT","topic":"Trauma","concept":"tbi-ventilation","b":0.5,"type":"mc","stem":"A 30-year-old motorcyclist with a head injury responds only to pain. Breathing is irregular at 6/min. Pupils are equal and reactive, with no posturing. BP 126/80, SpO2 88%. You begin BVM ventilation with oxygen. At what rate should you ventilate?","opts":["One breath every 2 to 3 seconds to blow off carbon dioxide","One breath every 12 seconds to limit gastric distension","One breath every 6 seconds, avoiding hyperventilation","As fast as possible until his SpO2 reaches 100%"],"ans":2,"key":"Ventilate head-injured adults at a normal rate (about 1 breath every 6 s); avoid routine hyperventilation.","why":"Both hypoxia and hyperventilation worsen secondary brain injury. Without signs of herniation, the goal is normal ventilation at about 10 breaths per minute with oxygen, which prevents hypoxia without constricting cerebral blood vessels.","wrong":["Routine hyperventilation constricts cerebral vessels and reduces brain blood flow.","Five breaths per minute is too slow and allows hypoxia and carbon dioxide buildup.","","Uncontrolled rapid ventilation causes hyperventilation, gastric distension, and reduced cardiac output."],"src":"STD"},{"id":"TT-029","d":"TREAT","topic":"Trauma","concept":"tbi-ventilation","b":1.5,"type":"mc","stem":"You are ventilating an adult with a severe head injury with a BVM at 10 breaths/min. During transport his GCS falls from 8 to 5, his right pupil becomes dilated and sluggish, and he develops extensor posturing. SpO2 97%, BP 150/70, HR 58. What is the most appropriate action?","opts":["Stop assisted ventilation and switch him to a nonrebreather mask at 15 L/min","Elevate his legs to increase blood flow to the brain and recheck his pupils","Keep ventilating with oxygen and rapidly transport to a trauma center with notification","Divert to the closest clinic so that a physician can evaluate him sooner"],"ans":2,"key":"Signs of herniation call for continued oxygenation and ventilation, rapid transport to a trauma center, and early notification.","why":"A falling GCS, a unilateral dilated pupil, posturing, and Cushing-type vital signs suggest rising intracranial pressure and possible herniation. The EMT prevents hypoxia, keeps ventilating, and gets him to neurosurgical care quickly; any change in ventilation rate for herniation is a protocol or medical-direction decision, not a routine step.","wrong":["He cannot breathe adequately on his own; stopping ventilation causes hypoxia, which worsens secondary brain injury.","Leg elevation does not treat rising intracranial pressure and is not a treatment for herniation.","","A clinic cannot provide neurosurgical care; diverting there delays definitive treatment."],"src":"STD"},{"id":"TT-030","d":"TREAT","topic":"Trauma","concept":"smr-indications","b":0.5,"type":"mc","stem":"A 22-year-old man has a single gunshot wound to the left upper abdomen. He is alert and oriented, moves all extremities with normal sensation, and has no neck or back pain or tenderness. BP 94/60, HR 120. What is the best approach to spinal care?","opts":["Secure him to a long backboard with a cervical collar before moving him","Apply a cervical collar, since all penetrating trauma requires one","Withhold spinal motion restriction; control bleeding and transport rapidly","Delay transport until a scoop stretcher can be brought to the scene"],"ans":2,"key":"Penetrating trauma alone, without neurologic deficit or other indications, does not call for spinal motion restriction.","why":"The 2018 joint statement lists altered mental status, midline tenderness, focal deficits, spinal deformity, and distracting injury as indications; penetrating trauma alone is not one. Spinal precautions here would only delay transport of a patient in shock.","wrong":["He has no SMR indication, and boarding delays transport of a hypotensive patient.","Penetrating trauma alone is not an SMR indication under the joint statement.","","Delaying transport for a patient with penetrating trauma and shock increases mortality."],"src":"SMR"},{"id":"TT-031","d":"TREAT","topic":"Trauma","concept":"smr-indications","b":0,"type":"table","stem":"Using the 2018 joint position statement on spinal motion restriction, classify each injured patient.","cols":["SMR indicated","SMR not indicated"],"rows":[["Fell 8 feet from a ladder, intoxicated, cannot reliably report pain",0],["Tingling and weakness in both hands after a shallow-water dive",0],["Midline tenderness over the lower neck after a rear-end collision",0],["Low-speed collision; alert, sober, no midline tenderness, normal neuro exam, no distracting injury",1],["Isolated stab wound to the flank; alert, normal motor and sensory exam",1]],"key":"SMR indications: altered mental status or intoxication, midline tenderness, focal deficit, deformity, distracting injury.","why":"Intoxication, focal neurologic symptoms, and midline spinal tenderness each meet SMR criteria. An alert, sober patient with a normal exam and no tenderness, and a penetrating injury without neurologic findings, do not.","src":"SMR"},{"id":"TT-032","d":"TREAT","topic":"Trauma","concept":"extremity-injury-care","b":1,"type":"mr","stem":"A 34-year-old man fell from a horse and has a painful, deformed mid-thigh. You are deciding whether to apply a traction splint to that leg. Which additional findings would contraindicate a traction splint? Select TWO.","opts":["An open, deformed ankle fracture on the same leg","Suspected pelvic fracture with pelvic pain and instability","Mid-thigh deformity with shortening of the leg","Intact distal pulse, motor function, and sensation","Muscle spasm causing severe thigh pain"],"ans":[0,1],"key":"Traction splints are for isolated midshaft femur fractures; pelvic, hip, knee, or same-leg ankle injury contraindicates them.","why":"The traction splint anchors at the ischium and pulls from the ankle, so a pelvic fracture or an injured ankle on the same leg would be worsened by its use. A closed, isolated midshaft femur fracture is the indication.","wrong":["","","Midshaft femur deformity with shortening is the classic indication for traction.","Intact distal circulation and sensation are expected findings and are rechecked after splinting.","Traction relieves the muscle spasm that causes femur fracture pain."],"src":"STD"},{"id":"TT-033","d":"TREAT","topic":"Trauma","concept":"extremity-injury-care","b":-0.5,"type":"mc","stem":"A 45-year-old man caught his hand in a table saw, amputating two fingers. Bleeding from the stumps is controlled with direct pressure. A coworker hands you the fingers. How should you care for the amputated parts?","opts":["Wrap in moist sterile gauze per protocol, seal in a plastic bag, and keep it cool","Place them directly on ice in a cooler so they stay as cold as possible","Submerge them in a container of tap water to keep them from drying out","Leave them with the coworker to bring to the hospital later by car"],"ans":0,"key":"Amputated parts are wrapped in sterile gauze, sealed in a bag, kept cool without direct ice, and transported with the patient.","why":"Cooling slows tissue breakdown, but direct contact with ice or water damages tissue and can prevent reattachment. The part travels with the patient so the surgical team can evaluate it promptly.","wrong":["","Direct ice contact causes freezing injury that can prevent reattachment.","Soaking in water causes tissue swelling and damage that can prevent reattachment.","Parts should travel with the patient to avoid delay in evaluation for reattachment."],"src":"STD"},{"id":"TT-034","d":"TREAT","topic":"Trauma","concept":"chemical-electrical-burns","b":1,"type":"mc","stem":"A 38-year-old worker spilled dry powdered lime on both forearms. Powder is still visible on his skin and clothing. The scene is safe and you are wearing appropriate PPE. What should you do first?","opts":["Brush off the powder and remove contaminated clothing, then irrigate with lots of water","Flush the powder off right away with large amounts of water before removing any clothing","Apply a vinegar solution to neutralize the chemical, then rinse the arms with water","Cover both arms with dry sterile dressings, keep him warm, and transport promptly"],"ans":0,"key":"Dry chemicals are brushed off first, then the skin is irrigated with large amounts of water.","why":"Some dry chemicals such as lime react with water, so the EMT brushes off as much powder as possible and removes contaminated clothing first. Copious irrigation then removes the remaining chemical.","wrong":["","Adding water to a large amount of dry lime can activate it; brush it off first.","Neutralizing agents can generate heat and worsen the injury.","Covering the arms leaves the chemical in contact with the skin."],"src":"STD"},{"id":"TT-035","d":"TREAT","topic":"Trauma","concept":"chemical-electrical-burns","b":0.5,"type":"mc","stem":"A 41-year-old lineman contacted a power line. The utility confirms the line is de-energized. He is alert, has a small charred wound on his right palm and another on his left foot, and says his chest feels 'fluttery.' HR 110 and irregular. What is the priority concern?","opts":["Possible dysrhythmia and hidden deep tissue damage; keep the AED ready and transport","Minor injury, because small skin wounds indicate little energy passed through him","Cooling both wounds with ice packs to stop the burning process in deeper tissue","Applying burn ointment to both wounds before covering them with sterile dressings"],"ans":0,"key":"Electrical injury can cause dysrhythmias and deep tissue damage far beyond the visible entry and exit wounds.","why":"Current passing through the body can disrupt cardiac rhythm and damage muscle and nerves along its path. An irregular pulse and palpitations require cardiac readiness and transport, often to a burn or trauma center per protocol.","wrong":["","Small skin wounds greatly underestimate deep tissue damage along the current path.","Ice causes further tissue injury and can cause hypothermia.","Ointments are not applied in the field; burns are covered with dry sterile dressings."],"src":"STD"},{"id":"TT-036","d":"TREAT","topic":"Special populations","concept":"delivery-and-newborn-care","b":-0.5,"type":"order","stem":"You are assisting with an uncomplicated head-first delivery of a term infant at home. Place the steps in the correct order.","opts":["Support the head with gentle pressure as it delivers to prevent an explosive delivery","Check for an umbilical cord around the infant's neck","Gently guide the head downward to deliver the upper (anterior) shoulder","Guide the head upward to deliver the lower (posterior) shoulder","Support and grasp the infant as the body delivers","Dry, warm, and stimulate the newborn"],"key":"Normal delivery: control the head, check for a nuchal cord, deliver anterior then posterior shoulder, then the body.","why":"Gentle control of the head prevents tearing, and a nuchal cord must be found before the shoulders deliver. Downward then upward guidance delivers the shoulders in sequence, and drying and warming the newborn prevents heat loss.","src":"STD"},{"id":"TT-037","d":"TREAT","topic":"Special populations","concept":"delivery-and-newborn-care","b":0,"type":"mc","stem":"During a delivery, the infant's head has emerged, and you feel the umbilical cord wrapped tightly around the neck. You try but cannot slip it over the head. What should you do?","opts":["Pull firmly on the head to complete the delivery quickly","Clamp the cord in two places, cut between the clamps, and unwrap it","Push the head back into the vagina and transport rapidly","Wait for the next contraction to loosen the cord on its own"],"ans":1,"key":"A nuchal cord that cannot be slipped over the head is clamped in two places and cut between the clamps.","why":"A loose cord is slipped over the head, but a tight one can compress the infant's blood supply and prevent delivery. Clamping twice and cutting between the clamps frees the infant without bleeding from either end.","wrong":["Traction on the head can injure the infant and tighten the cord further.","","Pushing the head back is not done for a nuchal cord and delays delivery.","Waiting lets a tight cord continue to compress blood flow."],"src":"STD"},{"id":"TT-038","d":"TREAT","topic":"Special populations","concept":"obstetric-complications","b":1,"type":"mc","stem":"A 29-year-old in active labor says she feels something between her legs. You see a loop of pulsating umbilical cord protruding from the vagina; the baby's head is not visible. What is the best action?","opts":["Push the cord gently back into the vagina, cover it with a towel, and transport","Have her push hard with the next contraction so that the baby delivers before transport","Elevate her hips, lift the presenting part off the cord with gloved fingers, and transport","Clamp the cord in two places and cut between the clamps to relieve tension"],"ans":2,"key":"Prolapsed cord: relieve pressure on the cord by positioning and lifting the presenting part; transport rapidly.","why":"The presenting part compresses the cord against the pelvis and cuts off fetal blood flow. Hips-elevated or knee-chest positioning and lifting the presenting part off the cord relieve the pressure; the exposed cord is kept moist and the mother is transported immediately.","wrong":["Replacing the cord is not attempted; it does not relieve compression and risks injury.","Pushing drives the presenting part against the cord and worsens compression.","","Cutting the cord stops all blood flow to the fetus."],"src":"STD"},{"id":"TT-039","d":"TREAT","topic":"Special populations","concept":"obstetric-complications","b":1.5,"type":"mc","stem":"During a breech delivery, the infant's buttocks, legs, and body deliver, but the head has not delivered after about 3 minutes despite contractions. What should you do?","opts":["Pull firmly on the infant's legs and body to deliver the head with the next push","Use gloved fingers to hold the vaginal wall off the infant's face and transport rapidly","Push the infant's body back into the birth canal and transport the mother rapidly","Keep supporting the body and wait for the head to deliver without intervening"],"ans":1,"key":"If a breech head does not deliver, create an airway with gloved fingers and transport rapidly.","why":"An entrapped head compresses the cord, and the infant may attempt to breathe with the face against the vaginal wall. Holding the tissue away from the mouth and nose gives an airway while the mother is rushed to the hospital.","wrong":["Traction on the body can injure the infant's neck and spinal cord.","","Pushing the body back is not attempted and causes injury.","Waiting allows prolonged cord compression and hypoxia."],"src":"STD"},{"id":"TT-040","d":"TREAT","topic":"Special populations","concept":"obstetric-complications","b":0,"type":"mc","stem":"Ten minutes after delivery of the placenta, a 31-year-old woman continues to bleed heavily from the vagina. She is pale, HR 122, BP 92/58. Her lower abdomen feels soft and boggy. Besides treating for shock, what should you do?","opts":["Pack the vagina tightly with sterile gauze to apply pressure to the bleeding","Massage the uterine fundus firmly and encourage breastfeeding if the infant is stable","Sit her upright on the stretcher with her legs crossed to slow the bleeding","Stay on scene and recheck her vital signs until the bleeding slows on its own"],"ans":1,"key":"Postpartum hemorrhage with a boggy uterus is treated with fundal massage and breastfeeding, plus shock care and transport.","why":"A soft, boggy uterus is not contracting to compress its bleeding vessels. Fundal massage and nipple stimulation from breastfeeding both promote uterine contraction while the EMT treats shock and transports.","wrong":["Nothing is placed inside the vagina; pads are placed externally.","","Sitting upright with crossed legs does not control uterine bleeding and worsens hypotension.","Ongoing hemorrhage with shock requires immediate transport."],"src":"STD"},{"id":"TT-041","d":"TREAT","topic":"Special populations","concept":"delivery-and-newborn-care","b":0.5,"type":"order","stem":"A term newborn is limp and not breathing after delivery. Place the steps of care in the correct order.","opts":["Perform initial steps: warm, dry, stimulate, and position the airway, suctioning only if secretions obstruct it","Assess breathing and heart rate","Begin positive-pressure ventilation if apneic, gasping, or heart rate below 100/min","Confirm chest rise and reassess heart rate after 30 seconds of effective ventilation","Begin compressions at 3:1 if heart rate stays below 60/min despite effective ventilation"],"key":"Newborn: initial steps, assess, ventilate if apneic/gasping or HR <100, reassess, compress 3:1 only if HR stays <60.","why":"Most newborns respond to warmth, drying, stimulation, and an open airway; routine suctioning is not recommended. Ventilation is the most important intervention for an apneic or bradycardic newborn, and compressions start only if the heart rate stays below 60/min after 30 seconds of ventilation that moves the chest.","src":"NRP"},{"id":"TT-042","d":"TREAT","topic":"Special populations","concept":"transport-positioning","b":-1,"type":"mc","stem":"A woman who is 34 weeks pregnant was lying on her back on the floor when she became dizzy and nauseated. She is pale, HR 110, BP 88/56. There is no trauma. How should you position her?","opts":["Supine with her legs elevated","On her left side","Sitting upright at 90 degrees","Prone with her head turned to one side"],"ans":1,"key":"Supine hypotensive syndrome is relieved by placing the late-pregnant patient on her left side.","why":"In late pregnancy, the uterus compresses the inferior vena cava when the woman lies supine, reducing blood return to the heart. Left lateral positioning moves the uterus off the vena cava and restores cardiac output.","wrong":["The supine position is what compresses the vena cava; raising the legs does not relieve it.","","Sitting upright does not reliably relieve caval compression and may worsen hypotension.","Prone positioning is impractical and unsafe in late pregnancy."],"src":"STD"},{"id":"TT-043","d":"TREAT","topic":"Special populations","concept":"seizure-care","b":-1,"type":"mc","stem":"A 2-year-old had a 1-minute generalized seizure at home. The child is now drowsy but breathing adequately, cries when touched, and feels hot. The mother says the child has had a fever since yesterday. What is the most appropriate care?","opts":["Place the child in a cold bath to lower the fever quickly, then transport","Place the child on the side, give oxygen as needed, remove excess clothing, and transport","Give the child sips of cold water to help lower the temperature before transport","Reassure the mother that febrile seizures are harmless and transport is unnecessary"],"ans":1,"key":"After a pediatric febrile seizure, protect the airway, cool passively, and transport for evaluation.","why":"A postictal child is at risk of airway compromise, so positioning on the side with oxygen as needed comes first. Removing excess clothing allows passive cooling, and every seizure needs evaluation for causes such as meningitis.","wrong":["Cold-water immersion can cause shivering and hypothermia and is not used for febrile seizures.","","A drowsy postictal child should not be given anything by mouth because of aspiration risk.","A seizure with fever in a young child needs medical evaluation to rule out serious causes such as meningitis."],"src":"STD"},{"id":"TT-044","d":"TREAT","topic":"Special populations","concept":"ftg-destination","b":1,"type":"mc","stem":"An 82-year-old woman tripped and struck her head on a table. She is alert and oriented, GCS 15, with a small forehead bruise and a mild headache. She takes apixaban for atrial fibrillation. Vital signs are normal. What is the best decision?","opts":["Let her stay home, since her neurologic exam and vital signs are normal","Transport her, and consider a trauma center as the field triage guideline advises","Advise her to see her own physician tomorrow if the headache continues","Observe her on scene for 30 minutes before deciding on transport"],"ans":1,"key":"Anticoagulant use and a low-level fall with head strike at 65+ are 2021 field triage risk factors: transport, consider a trauma center.","why":"The 2021 field triage guideline lists anticoagulant use and low-level falls with significant head impact in adults 65 or older under EMS judgment risk factors: if concerned, take the patient to a trauma center. Anticoagulated patients can deteriorate hours after a head strike despite a normal first exam.","wrong":["Anticoagulated older adults can deteriorate hours after a head strike despite a normal first exam.","","Delaying evaluation risks missing a slowly expanding brain bleed.","Observation on scene delays imaging and does not rule out a bleed."],"src":"FTG"},{"id":"TT-045","d":"TREAT","topic":"Special populations","concept":"special-healthcare-devices","b":0.5,"type":"mc","stem":"A 6-year-old with a tracheostomy is in respiratory distress at home. You hear gurgling from the tube, RR 40, SpO2 86%. The parent says the tube often needs suctioning. What should you do first?","opts":["Cover the stoma and ventilate by mouth and nose with a BVM","Suction the tracheostomy tube with sterile technique, limiting each pass","Remove the tracheostomy tube and wait for a replacement tube to arrive","Apply a nasal cannula at 4 L/min and transport the child with the parent"],"ans":1,"key":"Distress with secretions in a tracheostomy tube is treated first by suctioning the tube.","why":"Secretions are the most common cause of tracheostomy obstruction. Suctioning the tube with sterile technique and limited suction time restores the airway; ventilating through the mouth or changing the tube are steps if suctioning fails.","wrong":["Ventilating through the mouth and nose is a later step if the tube cannot be cleared.","","Removing the tube without a replacement in hand can lose the airway entirely.","A nasal cannula does not address the obstructed tube, which is how this child breathes."],"src":"STD"},{"id":"TT-046","d":"TREAT","topic":"Environmental","concept":"heat-illness","b":-0.5,"type":"table","stem":"You are staffing the medical tent at a summer marathon. Classify each runner's presentation.","cols":["Heat exhaustion","Heat stroke"],"rows":[["Alert, dizzy, sweating heavily, nauseated, temperature 101°F",0],["Confused and combative, temperature 106°F",1],["Collapsed and seizing, hot skin, temperature 105°F",1],["Headache and muscle cramps, oriented, cool clammy skin",0]],"key":"Altered mental status with a high core temperature means heat stroke; an intact mental status suggests heat exhaustion.","why":"Heat stroke is defined by central nervous system dysfunction such as confusion, seizure, or collapse with a very high temperature; exertional heat stroke patients may still be sweating. Heat exhaustion patients remain oriented, with dizziness, nausea, cramps, and moist skin.","src":"STD"},{"id":"TT-047","d":"TREAT","topic":"Environmental","concept":"hypothermia-handling","b":0.5,"type":"mc","stem":"A 70-year-old man was found in an unheated home in winter. He is confused, has stopped shivering, and his skin is cold. HR 48, RR 10. What is the most important handling consideration?","opts":["Have him walk to the ambulance to generate body heat and avoid lifting him","Handle him gently and horizontally, remove wet clothing, and rewarm passively","Rub his arms and legs vigorously to restore circulation","Give him hot coffee to drink, then move him quickly to the warm ambulance"],"ans":1,"key":"Severely hypothermic patients are handled gently and kept horizontal because rough movement can trigger ventricular fibrillation.","why":"Confusion, loss of shivering, and bradycardia indicate severe hypothermia, and the cold heart is irritable. Gentle horizontal handling, removing wet clothing, and passive rewarming prevent further heat loss without provoking a dysrhythmia.","wrong":["Exertion and rough movement can trigger ventricular fibrillation in a cold heart.","","Vigorous rubbing damages tissue and can precipitate a dysrhythmia.","A confused patient should not drink, and caffeine does not rewarm."],"src":"STD"},{"id":"TT-048","d":"TREAT","topic":"Environmental","concept":"drowning-ventilation","b":0,"type":"mc","stem":"A lifeguard pulls a 7-year-old from a pool. The child is unresponsive, not breathing, and has no pulse. You and your partner have a BVM with oxygen and an AED. What is the best approach?","opts":["Perform abdominal thrusts to drain water from the lungs first","Begin compression-only CPR and add breaths once ALS places an advanced airway","Begin CPR at 15:2 with ventilations that produce visible chest rise","Delay CPR until the AED is attached and has analyzed the rhythm"],"ans":2,"key":"Drowning arrest is hypoxic, so CPR must include effective ventilations; do not try to drain water.","why":"Cardiac arrest after drowning results from hypoxia, so ventilation is essential. Two-rescuer child CPR uses 15:2 with breaths that make the chest rise, and the AED is attached as soon as it is ready without delaying CPR.","wrong":["Abdominal thrusts do not remove water from the lungs and delay CPR.","Drowning arrest is hypoxic; trained rescuers with a BVM must include ventilations from the start.","","CPR starts immediately; the AED is applied without delaying compressions."],"src":"AHA"},{"id":"TT-049","d":"TREAT","topic":"Environmental","concept":"snakebite-sting-care","b":-1,"type":"mc","stem":"A 36-year-old hiker was bitten on the lower leg by a rattlesnake 15 minutes ago. The area is swollen and painful. He is alert with stable vital signs. What is the appropriate care?","opts":["Apply a tourniquet tightly above the bite to keep the venom from spreading","Apply ice packs directly over the bite site to slow the spread of venom","Keep him calm, remove rings and tight items, splint the leg in neutral, and transport","Make a small incision over the bite and suction out as much venom as possible"],"ans":2,"key":"Snakebite care: calm the patient, remove rings and tight items, immobilize the limb, and transport for antivenom.","why":"Swelling spreads quickly, so jewelry and tight clothing are removed early. Limiting movement and transporting promptly to a facility with antivenom is the definitive approach.","wrong":["Tourniquets concentrate venom locally and worsen tissue destruction.","Ice worsens local tissue damage.","","Incision and suction do not remove meaningful venom and add bleeding, tissue damage, and infection."],"src":"STD"},{"id":"TT-050","d":"TREAT","topic":"Transport and communication","concept":"stroke-time-and-destination","b":0.5,"type":"mc","stem":"A 70-year-old woman has sudden facial droop, arm drift, and garbled speech, with a positive stroke scale. She was last known well 50 minutes ago. A community hospital is 8 minutes away; a stroke center is 18 minutes away. Your destination protocol directs suspected stroke to stroke centers within that transport time. What should you do?","opts":["Transport to the closer community hospital because it is 10 minutes faster","Transport to the stroke center and pre-notify them with her last-known-well time","Remain on scene for several minutes to see whether her symptoms resolve","Request air medical transport and wait on scene for the helicopter"],"ans":1,"key":"Suspected stroke goes to the stroke-capable destination per protocol, with early notification and the last-known-well time.","why":"Stroke centers can provide time-sensitive treatments such as thrombolysis and clot retrieval. Following the destination protocol and pre-notifying with the last-known-well time lets the team be ready on arrival.","wrong":["Protocol directs her to a stroke center; a hospital that cannot provide definitive care may delay treatment.","","Waiting on scene wastes the time-limited treatment window.","An 18-minute ground transport is faster than waiting for and loading an aircraft."],"src":"STD"},{"id":"TT-051","d":"TREAT","topic":"Transport and communication","concept":"ftg-destination","b":1.5,"type":"mr","stem":"You are triaging adults at a highway crash. Under the 2021 National Guideline for the Field Triage of Injured Patients, which findings are high-risk (red) criteria that direct transport to the highest-level trauma center available? Select THREE.","opts":["A tourniquet was needed to control extremity bleeding","Unable to follow commands (motor GCS less than 6)","Suspected pelvic fracture","Isolated closed wrist deformity with normal vital signs","Ground-level fall in a 30-year-old with knee abrasions","Airbag deployed; alert, normal vital signs, and no complaints"],"ans":[0,1,2],"key":"2021 red criteria include bleeding needing a tourniquet or packing, inability to follow commands, and suspected pelvic fracture.","why":"The 2021 guideline groups injury patterns and mental status or vital sign findings as red criteria for the highest-level trauma center. Active bleeding requiring a tourniquet, motor GCS below 6, and suspected pelvic fracture are all on that list.","wrong":["","","","An isolated distal extremity injury with normal vitals does not meet red criteria.","A low-energy fall in a young adult with minor injuries does not meet high-risk criteria.","Airbag deployment alone in an uninjured patient with normal findings is not a red criterion."],"src":"FTG"},{"id":"TT-052","d":"TREAT","topic":"Transport and communication","concept":"transport-positioning","b":-0.5,"type":"mc","stem":"A 66-year-old man has vomited blood twice and is now pale and cool. He is alert, RR 22, HR 124, BP 84/52, with no trauma or breathing difficulty. How should you position him for transport?","opts":["Supine and kept warm, ready to turn him if he vomits","Seated upright at 90 degrees on the stretcher","Supine with the stretcher tilted steeply head-down","Prone with his face turned to one side"],"ans":0,"key":"A patient in shock without breathing difficulty is transported supine and kept warm.","why":"Supine positioning supports blood flow to the brain in shock, and preventing heat loss limits worsening coagulopathy. Because he is vomiting blood, the EMT keeps suction ready and is prepared to turn him.","wrong":["","Upright positioning can worsen hypotension and brain perfusion in shock.","Steep head-down positioning impairs breathing, raises aspiration risk, and is no longer recommended.","Prone positioning hides the airway and restricts breathing."],"src":"STD"},{"id":"TT-053","d":"TREAT","topic":"Transport and communication","concept":"radio-report-handoff","b":-0.5,"type":"mc","stem":"You are calling the receiving hospital about a 59-year-old man with chest pain. Which radio report is most appropriate?","opts":["Medic 4, 10 minutes out: 59-year-old male, chest pain 30 minutes, cardiac history, BP 150/90, HR 96, SpO2 97%, aspirin given","Medic 4, inbound with chest pain; will give the patient's full name, home address, and insurance information next","Medic 4, we've got a guy having a heart attack, coming in hot, see you soon","Medic 4, 10 minutes out with a stable patient; details will follow when we arrive"],"ans":0,"key":"A radio report gives unit, ETA, age and sex, chief complaint, pertinent history, vital signs, and treatment given.","why":"The hospital needs enough concise clinical information to prepare: who is coming, when, what is wrong, how stable the patient is, and what has been done. Identifying details are left for the in-person handoff.","wrong":["","Names, addresses, and insurance are not needed by radio and raise privacy concerns.","It lacks vital signs and treatment and uses slang and an unconfirmed diagnosis.","It gives the hospital nothing to prepare with."],"src":"STD"},{"id":"TT-054","d":"TREAT","topic":"Transport and communication","concept":"radio-report-handoff","b":0,"type":"mc","stem":"You arrive at the emergency department with a patient whose condition changed after your radio report: her BP dropped from 124/80 to 96/60 after nitroglycerin. The triage nurse is busy with another patient. What is the correct handoff action?","opts":["Leave her on a hallway bed with your written report and return to service","Give a verbal report, including the BP change, to the nurse or physician who assumes care","Tell the registration clerk about the BP change and leave your written report","Finish your written report first, then give it to whoever is available"],"ans":1,"key":"Care is transferred only by verbal report to a qualified provider who assumes care, including changes since the radio report.","why":"Leaving a patient without handing off to an equal or higher level provider can be abandonment. The verbal report must highlight changes such as the drop in BP after nitroglycerin, with the written report to follow.","wrong":["Leaving without transferring care to a qualified provider can constitute abandonment.","","A registration clerk cannot assume clinical care.","An important change should be reported verbally now; documentation follows."],"src":"STD"},{"id":"TT-055","d":"TREAT","topic":"Transport and communication","concept":"sepsis-recognition","b":1.5,"type":"mc","stem":"Your two-EMT crew is 40 minutes from the nearest hospital with a 70-year-old man who has fever, chills, new confusion, HR 124, RR 28, and BP 78/46. An ALS unit is available to meet you along the route. What is the best decision?","opts":["Begin transport and request an ALS rendezvous en route","Stay at the residence until the ALS unit arrives there","Transport without ALS because sepsis needs only hospital antibiotics","Request air medical and wait on scene until it lands"],"ans":0,"key":"For a long transport with an unstable patient, start moving and arrange an ALS intercept rather than waiting on scene.","why":"Suspected septic shock with a long transport benefits from ALS interventions such as IV fluids. A rendezvous brings ALS to the patient without losing time, while waiting on scene for any resource delays definitive care.","wrong":["","Waiting on scene adds time; a rendezvous lets ALS reach him without stopping progress toward the hospital.","Septic shock needs IV fluids and ALS assessment; a long transport makes ALS valuable.","Waiting on scene for an aircraft delays care when a ground ALS intercept is readily available."],"src":"STD"},{"id":"OP-001","d":"OPS","topic":"Legal and ethical","concept":"consent-capacity","b":-1,"type":"mc","stem":"A neighbor called 911 after finding a 58-year-old man lying on his kitchen floor. He does not respond to voice or pain and has snoring respirations. No family is present, and the neighbor does not know his medical history. On what basis may you begin assessment and treatment?","opts":["Expressed consent given on his behalf by the neighbor who called 911","Implied consent, since a reasonable person would want emergency care","Involuntary consent, which requires law enforcement to authorize care","No consent is possible, so care must wait until a family member arrives"],"ans":1,"key":"An adult who cannot consent because of unresponsiveness is treated under implied consent when an emergency exists.","why":"When an adult is unable to give consent and faces a potential threat to life, the law presumes he would agree to emergency care. This is implied consent, and it allows the EMT to assess, treat, and transport without delay.","wrong":["A neighbor has no legal authority to consent for another adult; consent must come from the patient or a legal surrogate.","","Involuntary consent applies to patients held under a legal order, such as a court or police custody order, not to an unresponsive adult.","Waiting for family delays care for a possibly life-threatening condition; implied consent exists for exactly this situation."],"src":"STD"},{"id":"OP-002","d":"OPS","topic":"Legal and ethical","concept":"consent-capacity","b":0,"type":"mc","stem":"A 13-year-old girl fell from playground equipment on a school field trip. Her forearm is deformed, and her hand is pale and cool with a weak radial pulse. The teacher says the school has no medical authorization form for her, and repeated calls to both parents go unanswered. What should you do?","opts":["Wait at the scene with the patient until a parent can be reached to give consent","Accept the patient's own verbal consent as legally sufficient, since she is old enough to understand","Treat and transport under implied consent while staff keep calling the parents","Have the teacher sign a refusal and leave instructions to take her to a clinic"],"ans":2,"key":"A minor with a time-sensitive emergency and no reachable guardian is treated under implied consent.","why":"A minor generally cannot give legal consent, but when a guardian cannot be reached and delay threatens life or limb, implied consent applies. This arm with poor distal circulation is a limb threat, so care should not wait; the school or dispatch can keep trying to reach the parents.","wrong":["Delaying care for an arm with compromised circulation risks permanent harm; implied consent covers this emergency.","A 13-year-old who is not emancipated generally cannot give legal consent for her own care.","","A teacher without written authorization cannot refuse care for a minor, and a limb threat needs EMS treatment and transport."],"src":"STD"},{"id":"OP-003","d":"OPS","topic":"Legal and ethical","concept":"informed-refusal","b":0.5,"type":"order","stem":"A 62-year-old man with chest discomfort that has now eased tells you he does not want to go to the hospital. Place the steps of handling his refusal in the correct order.","opts":["Confirm he is alert, oriented, and not impaired by alcohol, drugs, or illness","Explain your findings and the risks of refusing, including disability or death","Encourage transport again, offer alternatives, and contact medical direction per protocol","Have him sign the refusal form with a witness present","Complete the patient care report describing the refusal discussion"],"key":"A valid refusal starts with capacity, then informed discussion and persuasion, then signature, then documentation.","why":"Only a patient with decision-making capacity can refuse, so capacity comes first. He must then understand the specific risks, and the EMT should try again to persuade him and involve medical direction before accepting a signed refusal. The PCR then records what was said and done.","src":"STD"},{"id":"OP-004","d":"OPS","topic":"Legal and ethical","concept":"duty-breach-negligence","b":-0.5,"type":"mc","stem":"You arrive at a crowded emergency department with a 70-year-old woman with abdominal pain. Every nurse is busy. Your partner moves her onto a hallway bed, and dispatch asks when you will be available. No hospital staff member has spoken with you yet. What must happen before your crew leaves?","opts":["Give a verbal report to a nurse or physician who accepts responsibility for her care","Leave a printed copy of the patient care report on her bed and notify dispatch you are clear","Ask a family member sitting nearby to call a nurse if her condition changes","Recheck her vital signs, document that she is stable, and then clear the call with dispatch"],"ans":0,"key":"Care must be transferred to a provider of equal or higher training who accepts it; leaving before that is abandonment.","why":"Once care has begun, the duty continues until a qualified provider formally accepts the patient. A verbal report to a nurse or physician at the receiving facility completes that transfer and protects both patient and crew.","wrong":["","A written report left on the bed does not transfer care to anyone; no qualified person has accepted the patient.","A family member is not a health care provider, so leaving the patient with them is abandonment.","Stable vital signs do not end the duty to the patient; care still has to be handed to a qualified provider."],"src":"STD"},{"id":"OP-005","d":"OPS","topic":"Legal and ethical","concept":"duty-breach-negligence","b":0.5,"type":"table","stem":"A crew was dispatched to a fall at a nursing home. During loading, the patient slid off the stretcher and broke her wrist because the straps were not fastened. Her family files a negligence claim. Classify each fact by the element of negligence it establishes.","cols":["Duty to act","Breach of duty","Damages","Proximate cause"],"rows":[["The ambulance was dispatched to the call and the crew began patient care",0],["The crew moved the stretcher without fastening the safety straps",1],["The patient sustained a fractured wrist",2],["The fracture resulted directly from sliding off the unsecured stretcher",3]],"key":"Negligence requires all four elements: duty, breach of that duty, actual harm, and harm caused by the breach.","why":"The dispatched crew had a duty to act. Failing to secure the straps fell below the standard of care, which is a breach. The fracture is the damage, and because the fall from the unsecured stretcher caused it, proximate cause is met.","src":"STD"},{"id":"OP-006","d":"OPS","topic":"Legal and ethical","concept":"advance-directives","b":-0.5,"type":"mc","stem":"An 82-year-old woman enrolled in home hospice is found pulseless and apneic in bed. Her daughter calmly hands you a physician-signed POLST form with her mother's name on it, marked 'Do Not Attempt Resuscitation.' What is the most appropriate action?","opts":["Begin CPR and transport so the hospital physician can decide whether to honor the form","Apply the AED and deliver a shock if advised, since defibrillation is not CPR","Perform two minutes of CPR, then stop and support the family if no pulse returns","Confirm the form is valid for her, withhold resuscitation, and support the family"],"ans":3,"key":"A valid DNR or POLST order that applies to the patient is honored by withholding resuscitation.","why":"A properly completed, physician-signed POLST that identifies the patient is a legal medical order. The EMT verifies it, withholds CPR and defibrillation, follows local protocol for a death at home, and supports the family.","wrong":["Starting CPR against a valid order ignores the patient's documented wishes; EMS is expected to honor it in the field.","Defibrillation is a resuscitation attempt and is withheld under a valid do-not-attempt-resuscitation order.","Any CPR attempt goes against a valid order; there is no trial period built into the order.",""],"src":"STD"},{"id":"OP-007","d":"OPS","topic":"Legal and ethical","concept":"advance-directives","b":1.5,"type":"mc","stem":"A 76-year-old man with lung disease has a valid DNR order that addresses only CPR. Tonight he is alert but short of breath, speaking in short phrases, with RR 28 and SpO2 86%. His wife asks whether the DNR means you cannot help him. What should you do?","opts":["Withhold all treatment and transport, because the DNR covers his lung condition","Give oxygen and other indicated care and transport; the DNR applies if he arrests","Provide comfort measures only, without oxygen, to respect the written wishes in his DNR","Ask him to revoke the DNR in writing before you begin any oxygen or other treatment"],"ans":1,"key":"A DNR order limits resuscitation in arrest; it does not mean withholding other indicated care.","why":"A DNR that addresses CPR applies when the patient is pulseless or not breathing. This patient has a pulse and is in respiratory distress, so oxygen, positioning, and transport are appropriate, with the DNR traveling with him.","wrong":["A DNR is not a refusal of all care; a patient with a pulse still receives indicated treatment.","","Oxygen is indicated for his hypoxia and also relieves distress; the DNR does not prohibit it.","He does not need to revoke the DNR; it remains in effect for arrest while you treat his breathing."],"src":"STD"},{"id":"OP-008","d":"OPS","topic":"Legal and ethical","concept":"privacy-and-reporting","b":0.5,"type":"mr","stem":"A 79-year-old woman who lives with her adult son has bruises of different colors on both upper arms. The son answers every question for her, his story changes, and she looks at him before speaking. She asks you not to 'make trouble.' Select TWO actions that are appropriate.","opts":["Confront the son about the bruises before leaving the home","Report your concerns as required by state law and agency protocol","Ask the responding officer to arrest the son for elder abuse","Document your objective findings and quote statements exactly","Photograph the bruises with your personal phone as evidence"],"ans":[1,3],"key":"Suspected abuse is reported as the law requires and documented objectively; the EMT does not investigate or accuse.","why":"Most states require health care providers, including EMS, to report suspected elder abuse, and the duty does not depend on the patient's permission. Objective, quoted documentation supports the people who investigate.","wrong":["Confronting a suspected abuser can escalate danger to the patient and the crew; investigation belongs to the proper authorities.","","EMTs do not determine guilt or direct arrests; they report concerns through the proper channels.","","Images on a personal device create a privacy violation and are not an approved way to collect evidence."],"src":"STD"},{"id":"OP-009","d":"OPS","topic":"Legal and ethical","concept":"privacy-and-reporting","b":0,"type":"mc","stem":"Your crew transported the driver from a crash that is now on the local news. Later that shift, several people ask you about the patient. Which disclosure of patient information is permitted?","opts":["Confirming to a reporter only that the driver was alive when you arrived","Telling the driver's employer, who calls the station, which hospital he went to","Answering a follow-up question from the receiving emergency department nurse","Posting a scene photo online after cropping out the driver's face and the plates"],"ans":2,"key":"Patient information may be shared with providers involved in the patient's care, not with the media, employers, or the public.","why":"Privacy law permits disclosure to other health care providers for treatment, so answering the receiving nurse is appropriate. Disclosing even limited details to others who are not involved in care is a privacy violation.","wrong":["Even limited details about a patient's condition are protected and may not be given to the media by the EMT.","An employer is not involved in treatment and has no right to know where the patient was taken.","","A crash scene photo can still identify a patient through the vehicle or location; posting it violates privacy."],"src":"STD"},{"id":"OP-010","d":"OPS","topic":"Legal and ethical","concept":"crime-scene-care","b":0,"type":"mc","stem":"Police have secured an apartment where a 30-year-old man has a stab wound to the abdomen. He is responsive and pale with HR 118. A bloody knife lies on the floor beside him, away from his reach. How should you handle the scene while giving care?","opts":["Leave the knife in place, avoid it, and tell police about anything you move","Pick up the knife with gloved hands and place it in a bag for police","Delay care until police finish photographing the scene and collecting evidence","Cut through the hole in his shirt to get the fastest access to the wound"],"ans":0,"key":"At a crime scene, patient care comes first, but EMTs disturb as little as possible and tell police what was moved.","why":"Care for a patient in shock cannot wait, yet unnecessary contact with evidence can harm the investigation. Limiting your path, leaving the weapon in place, and reporting anything moved meets both duties.","wrong":["","Handling the knife can destroy evidence; police collect it unless it poses an immediate danger to the crew.","A patient with signs of shock needs immediate care; evidence collection does not take priority over his life.","Cutting through a stab or bullet hole destroys evidence; cut around it when exposing the wound."],"src":"STD"},{"id":"OP-011","d":"OPS","topic":"Documentation","concept":"pcr-accuracy","b":-0.5,"type":"table","stem":"You are writing the narrative for a 66-year-old woman with chest pain. Classify each piece of information as an objective finding or subjective information.","cols":["Objective finding","Subjective information"],"rows":[["Patient states her chest feels 'like a heavy weight'",1],["Skin is pale, cool, and diaphoretic",0],["Blood pressure 152/94 mm Hg",0],["Husband reports she has been 'more confused than usual' today",1],["Patient rates her pain 8 out of 10",1]],"key":"Objective findings are what the EMT observes or measures; subjective information is what the patient or others report.","why":"Skin signs and a measured blood pressure are observations the EMT can verify. The patient's description and pain rating, and the husband's report, are statements told to the EMT and are recorded as subjective information.","src":"STD"},{"id":"OP-012","d":"OPS","topic":"Documentation","concept":"crime-scene-care","b":1.5,"type":"mc","stem":"A 24-year-old man was shot in the left thigh. He tells you, 'My neighbor shot me over the fence.' You find one small round wound on the outer thigh and no other wound. You cut his jeans away from the wound and hand them to police. Which PCR entry is best?","opts":["Pt victim of attempted murder by neighbor. Entrance wound L thigh. Jeans removed and given to PD.","Small-caliber gunshot entrance wound to L lateral thigh, fired at close range. Clothing given to PD.","Pt shot by neighbor after an argument; pt appears truthful. Wound L thigh. Jeans given to PD.","Pt states 'My neighbor shot me over the fence.' 1 cm round wound L lateral thigh. Jeans to PD."],"ans":3,"key":"On a crime-related call, quote statements exactly, describe wounds by appearance and location, and record what was done with evidence.","why":"The PCR may become a legal record, so it should hold the patient's exact words and objective wound descriptions without conclusions. Labeling entry versus exit, caliber, or intent is outside what an EMT can determine.","wrong":["'Attempted murder' is a legal conclusion, and 'entrance wound' is a forensic judgment the EMT cannot make.","Caliber, range, and entry status are forensic conclusions that the EMT cannot determine in the field.","Paraphrasing loses the patient's exact words, and judging his truthfulness is opinion, not an observation.",""],"src":"STD"},{"id":"OP-013","d":"OPS","topic":"Documentation","concept":"informed-refusal","b":0.5,"type":"mc","stem":"A 45-year-old woman who slipped on ice has a painful but intact wrist. She is alert and oriented, with normal vital signs, and declines transport after you explain the risks. She signs the refusal form. Which documentation best protects the patient and the crew?","opts":["The signed refusal form alone, since her signature proves she understood and refused","Her capacity, findings, the risks explained, advice given, and her response","A note that the patient refused transport and was left at home in her own care","Your opinion that she refused mainly because she wanted to avoid an ambulance bill"],"ans":1,"key":"A refusal PCR records capacity, the findings, the specific risks explained, instructions given, and the patient's understanding.","why":"A signature alone does not show the refusal was informed. Documenting her mental status, the assessment, the risks you described, the instructions to seek care or call back, and her response shows she understood and chose to refuse.","wrong":["A signature does not show she had capacity or understood the risks; the narrative must show both.","","A one-line note gives no evidence of capacity, the risks discussed, or the advice given.","Speculation about motive is not objective and does not show that the refusal was informed."],"src":"STD"},{"id":"OP-014","d":"OPS","topic":"Documentation","concept":"pcr-accuracy","b":0,"type":"mc","stem":"An hour after submitting an electronic PCR for a 50-year-old man with a forearm laceration, you realize you documented the injury on his right arm. It was on his left arm. What should you do?","opts":["Delete the narrative and rewrite it so the final record appears clean","Leave the PCR alone because the error is minor and the wound was treated","Add a dated, timed addendum that corrects the error, per agency policy","Call the emergency department and correct the error with the nurse verbally only"],"ans":2,"key":"PCR errors are corrected openly with a dated, identified correction, never by erasing the original entry.","why":"A correction that shows what changed, when, and by whom keeps the record accurate and trustworthy. Electronic systems use an addendum for this, while the original entry stays visible.","wrong":["Erasing the original entry hides the change and can look like falsification if the record is reviewed.","Wrong-side documentation can mislead later caregivers and reviewers; it must be corrected.","","A verbal correction does not fix the permanent record that others will rely on."],"src":"STD"},{"id":"OP-015","d":"OPS","topic":"Documentation","concept":"pcr-accuracy","b":-1,"type":"mc","stem":"During a short transport of a 35-year-old man with an ankle injury, your partner forgot to take a second set of vital signs. At the hospital he asks you to enter his first set again with a later time so the PCR 'looks complete.' What should you do?","opts":["Record only the vitals actually taken and note that no repeat set was obtained","Enter the copied values in the PCR but mark them clearly as approximate","Enter values you estimate from how the patient appeared during the transport","Leave the vitals out and write that the patient remained stable throughout the trip"],"ans":0,"key":"Record only what was actually observed and done; entering data that was not obtained is falsification.","why":"A PCR must reflect the care that was actually given. Documenting that a reassessment was not done is honest and correctable through training, while invented or copied values are falsification.","wrong":["","Values that were never measured are still falsified even when labeled approximate.","Estimated values are not measurements and misrepresent the care that was given.","Writing 'stable' without reassessment claims an observation the crew did not make."],"src":"STD"},{"id":"OP-016","d":"OPS","topic":"Equipment and supplies","concept":"shift-equipment-check","b":-0.5,"type":"mc","stem":"At the start of your shift, the ambulance's AED status indicator shows an error symbol, and the spare electrode pad package is past its expiration date. Your unit is about to be placed in service. What should you do?","opts":["Go in service, because the AED will likely work if a cardiac arrest call comes in","Replace the spare pads and ignore the indicator as long as the AED powers on","Keep the AED in service and report the problem at the end of the shift","Remove it from service, get a working AED and in-date pads, and report it"],"ans":3,"key":"An AED with a fault indicator or expired pads is replaced before the unit goes in service.","why":"An AED must be ready on every call, and a status warning means it may not analyze or shock. Swapping in a working unit and in-date pads, and reporting the defect, ensures the crew can defibrillate when needed.","wrong":["Assuming the device will work risks a failed shock during a cardiac arrest.","Powering on does not clear a self-test fault; the indicator shows the unit may fail during use.","Waiting until the end of the shift leaves the crew without a reliable AED for every call in the meantime.",""],"src":"STD"},{"id":"OP-017","d":"OPS","topic":"Equipment and supplies","concept":"shift-equipment-check","b":0,"type":"mc","stem":"During your morning inventory, you find that the unit's intranasal naloxone device expired last month. The station has replacement stock. What is the best action?","opts":["Keep it on the unit, since it expired only recently and still has some effect","Remove it, replace it from stock, and record the change per agency policy","Use the expired device first on the next overdose call so it is not wasted","Discard it and run without naloxone until the scheduled resupply day"],"ans":1,"key":"Expired medications are removed, replaced with in-date stock, and logged before the unit responds.","why":"Expired medications may not work as intended, and giving them violates standard practice. Replacing the device from stock and recording the change keeps the unit ready for an opioid emergency.","wrong":["Expired medication may be less effective and should not be carried for patient use.","","Giving an expired drug to a patient with an opioid overdose risks treatment failure.","Running without naloxone leaves the crew unable to treat an opioid emergency when stock is available."],"src":"STD"},{"id":"OP-018","d":"OPS","topic":"Equipment and supplies","concept":"oxygen-cylinder-safety","b":-1,"type":"mc","stem":"You are replacing an empty portable oxygen cylinder in the ambulance before your next call. Which practice is correct?","opts":["Apply petroleum jelly to the valve threads so the regulator seats more easily","Lay the new cylinder loose on the bench seat so it is within easy reach","Remove the seal, aim the valve away from people, and crack it briefly first","Store the spare cylinder next to the compartment heater to keep the gas warm"],"ans":2,"key":"Oxygen cylinders are kept away from oil, heat, and impact, and the valve is cracked before the regulator is attached.","why":"Briefly opening the valve clears dust that could enter the regulator, and pointing it away from people prevents injury. Oxygen supports combustion strongly, so oil and heat near the valve, or an unsecured cylinder, create fire and projectile hazards.","wrong":["Petroleum products can ignite in contact with pressurized oxygen and must never be used on regulators or valves.","An unsecured cylinder can become a projectile in a sudden stop or crash; cylinders must be secured.","","Heat raises cylinder pressure and increases the fire risk; cylinders are stored away from heat sources."],"src":"STD"},{"id":"OP-019","d":"OPS","topic":"Equipment and supplies","concept":"oxygen-cylinder-safety","b":1.5,"type":"mc","stem":"You are preparing for a long rural transport of a 68-year-old woman with SpO2 88% on a nonrebreather mask at high flow. The portable cylinder's gauge reads well under half full. How should you plan your oxygen supply?","opts":["Calculate time left from pressure, cylinder size, and flow; switch to a full cylinder if needed","Plan on the same duration you get on short transports, since duration does not depend on flow rate","Turn the flow down to a low rate on the nonrebreather so the cylinder lasts longer","Run the cylinder until the gauge reads zero before changing so no oxygen is wasted"],"ans":0,"key":"Oxygen duration depends on remaining pressure, cylinder size, and flow rate; higher flow empties a cylinder faster.","why":"A cylinder's remaining time is calculated from its pressure above a safe residual, its size factor, and the liter flow. At high flow a partly full cylinder may run out mid-transport, so the safe plan is to estimate the time and start with a full or larger supply.","wrong":["","Higher flow uses oxygen faster, so the same cylinder lasts a shorter time on this patient.","A nonrebreather needs enough flow to keep the reservoir bag inflated; too little flow makes the patient rebreathe exhaled air.","Cylinders should be changed at a safe residual pressure, not run empty, so the patient's oxygen is not interrupted."],"src":"STD"},{"id":"OP-020","d":"OPS","topic":"Equipment and supplies","concept":"infection-control","b":0.5,"type":"mc","stem":"After you transport a 40-year-old man who vomited blood, the stretcher mattress and side rails have visible blood on them. You are wearing gloves. What is the correct way to prepare the stretcher for the next patient?","opts":["Spray disinfectant on the blood and wipe it off immediately so the unit can clear the call","Wipe the surfaces with plain water and leave the disinfecting for the end of the shift","Cover the soiled mattress with a fresh sheet and disinfect it later at the station with bleach","Remove visible blood, then apply an EPA-registered disinfectant for its labeled contact time"],"ans":3,"key":"Cleaning removes gross contamination first; disinfecting then requires the product's full labeled contact time.","why":"Blood and organic matter block disinfectants, so surfaces must be cleaned before they are disinfected. The disinfectant must stay wet for the time on its label to kill pathogens, and contaminated waste goes into the proper biohazard containers.","wrong":["Disinfectant applied over blood and wiped at once neither cleans the surface first nor meets the required contact time.","Water alone does not disinfect, and delaying exposes the next patient and crew to bloodborne pathogens.","A fresh sheet over contamination exposes the next patient and crew; the surface must be cleaned and disinfected.",""],"src":"STD"},{"id":"OP-021","d":"OPS","topic":"Responder wellness and safety","concept":"infection-control","b":0.5,"type":"order","stem":"While you are controlling bleeding from a 28-year-old man's scalp wound, he shakes his head and his blood splashes into your unprotected eye. Your partner takes over his care. Place your next actions in the correct order.","opts":["Flush the eye immediately with large amounts of clean water or saline","Notify your supervisor or designated infection control officer","Get a prompt medical evaluation for post-exposure testing and treatment","Complete the follow-up testing and counseling as scheduled"],"key":"After a blood exposure: wash or flush at once, notify the designated officer, get prompt evaluation, then complete follow-up.","why":"Immediate flushing reduces the amount of infectious material on the eye. Rapid notification starts source-patient testing and a medical evaluation, where any post-exposure treatment works best when started early. Follow-up testing confirms whether infection occurred.","src":"STD"},{"id":"OP-022","d":"OPS","topic":"Responder wellness and safety","concept":"infection-control","b":1,"type":"mc","stem":"A 45-year-old man staying at a shelter has had a cough for six weeks, night sweats, weight loss, and blood-streaked sputum. He is alert, with SpO2 95% and RR 20. Which precautions are most appropriate for your crew?","opts":["Surgical masks for the crew, with no mask needed for the patient","Fit-tested N95s for the crew and a surgical mask on the patient","An N95 respirator on the patient and gloves for the crew","Gloves and gowns for the crew, since the disease spreads mainly by touch"],"ans":1,"key":"Suspected tuberculosis calls for airborne precautions: fit-tested N95 for the crew and a surgical mask on the patient.","why":"His symptoms suggest active tuberculosis, which spreads through airborne droplet nuclei. CDC guidance for transport calls for fit-tested N95 respirators for the crew and a surgical mask on the patient if tolerated, with the vehicle ventilation set to bring in outside air.","wrong":["Surgical masks do not filter airborne droplet nuclei well enough to protect the crew from tuberculosis.","","N95 respirators protect the wearer and are not intended for the patient; the crew remains unprotected.","Tuberculosis spreads through the air, not mainly by touch, so contact precautions alone are inadequate."],"src":"STD"},{"id":"OP-023","d":"OPS","topic":"Responder wellness and safety","concept":"body-mechanics","b":-1.5,"type":"mc","stem":"You and your partner are about to lift a 210-lb man on a stretcher from the ground. Which technique best protects your back?","opts":["Bend at the waist with your legs straight so you can reach the rails","Twist your torso to turn toward the ambulance as you lift the stretcher","Keep your back straight, feet shoulder-width apart, lift with your legs","Hold the stretcher at arm's length, away from your body, as you rise"],"ans":2,"key":"Safe lifting uses a straight back, a stable base, the leg muscles, and the load kept close to the body.","why":"A locked, straight back and leg-driven lift place the work on the strongest muscles and reduce strain on the spine. A shoulder-width stance gives a stable base, and keeping the load close shortens the lever arm on the back.","wrong":["Bending at the waist puts the load on the lower back muscles and discs instead of the legs.","Twisting under load is a common cause of back injury; turn by moving the feet.","","Holding a load away from the body multiplies the force on the back."],"src":"STD"},{"id":"OP-024","d":"OPS","topic":"Responder wellness and safety","concept":"body-mechanics","b":1,"type":"mr","stem":"A 72-year-old woman with shortness of breath is alert and able to sit upright. She lives in a third-floor walk-up apartment with a narrow stairway and no elevator. Select TWO actions that best reduce the risk of injury to the crew while moving her.","opts":["Move her down the stairs in a stair chair rather than carrying a stretcher","Stand with your feet close together to fit the narrow stairway","Have the strongest crew member carry the device alone to avoid uneven lifting","Agree on clear commands and lift and move on the same signal","Pull the device toward you instead of pushing whenever you can"],"ans":[0,3],"key":"Choose the right device for the route and coordinate every lift with clear, shared commands.","why":"A stair chair suits an alert patient who can sit and is easier and safer than carrying a stretcher down narrow stairs. Clear communication keeps partners lifting together, which prevents sudden load shifts that cause injury.","wrong":["","A narrow stance makes you unstable; keep the feet about shoulder-width apart for balance.","One person carrying a patient risks injury to both; lifting and carrying need coordinated partners.","","Pushing is safer than pulling when moving a load; pulling strains the back and shoulders."],"src":"STD"},{"id":"OP-025","d":"OPS","topic":"Responder wellness and safety","concept":"stress-fatigue","b":0,"type":"mc","stem":"Four days after a call in which an infant died despite resuscitation, an EMT tells you she cannot sleep, keeps seeing the scene, and snaps at her family. She is still working her shifts. What is the best advice?","opts":["Seek peer support or employee assistance, and professional help if symptoms persist","Have a few drinks at bedtime to relax until her sleep returns to normal on its own","Pick up extra shifts so she stays busy and has less time to dwell on the call","Ignore the symptoms, since these reactions are normal after a call and need no attention"],"ans":0,"key":"Stress reactions after a critical incident are common; use peer support and professional help rather than avoidance.","why":"Sleep problems, intrusive images, and irritability are common after a traumatic call. Talking with trained peers or the employee assistance program helps, and symptoms that persist or worsen should be evaluated by a mental health professional.","wrong":["","Alcohol worsens sleep quality and can become an unhealthy coping pattern.","Extra work adds fatigue and avoids the stress rather than addressing it.","These reactions are common, but ignoring them can allow them to persist; support and monitoring are still needed."],"src":"STD"},{"id":"OP-026","d":"OPS","topic":"Responder wellness and safety","concept":"stress-fatigue","b":0.5,"type":"mc","stem":"At 3:30 a.m., near the end of a 24-hour shift with five overnight calls, you are driving the ambulance back to the station without a patient. You notice you drifted toward the shoulder and cannot remember the last mile. What should you do?","opts":["Open the window and turn up the radio to stay alert for the rest of the drive","Drink an energy drink and continue, since the station is only a few miles away","Speed up slightly to reach the station before you get more tired","Pull over safely, let a more alert partner drive, and report your fatigue"],"ans":3,"key":"Drowsy driving is an immediate hazard; stop driving and use agency fatigue procedures rather than relying on alertness tricks.","why":"Drifting and missing time are signs of microsleep, which can cause a crash at any moment. Stopping safely and handing off the wheel removes the danger, and reporting fatigue lets the agency protect the crew and the public.","wrong":["Cold air and noise do not prevent microsleep; they give only brief, unreliable alertness.","Caffeine takes time to work and does not reliably reverse severe sleep loss.","Higher speed increases crash risk while the driver remains impaired by fatigue.",""],"src":"STD"},{"id":"OP-027","d":"OPS","topic":"Responder wellness and safety","concept":"violent-scene-safety","b":0,"type":"mc","stem":"A 38-year-old man in his living room is pacing, clenching his fists, and yelling that he does not want help. He has not threatened the crew, and no weapons are visible. Police are en route. Your partner is near the front door. How should you approach him?","opts":["Move close and put a hand on his shoulder so he feels reassured","Keep a clear exit, stay at a distance, and speak calmly and quietly","Raise your voice firmly so that he knows you are in charge","Warn him that he will be restrained if he does not calm down right away"],"ans":1,"key":"De-escalation keeps an exit open, respects personal space, and uses a calm voice; leave and call police if threats grow.","why":"An agitated person may see closeness or a loud voice as a threat. A safe distance, an open escape route, and a calm, respectful tone lower tension while protecting the crew, who should withdraw if he becomes more threatening.","wrong":["Touching an agitated patient without warning can provoke an assault and leaves you within striking range.","","A loud, commanding tone tends to escalate an angry person rather than calm him.","Threats of restraint often increase agitation; restraint decisions follow protocol with law enforcement."],"src":"STD"},{"id":"OP-028","d":"OPS","topic":"Vehicle operations","concept":"due-regard-driving","b":-1,"type":"mc","stem":"You are driving with lights and siren to a reported cardiac arrest. Ahead, your traffic light turns red at a busy four-lane intersection. Some cars have stopped, and others have not. What should you do?","opts":["Proceed at your current speed, since lights and siren give you the right of way","Pass the stopped cars on
