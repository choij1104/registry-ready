the right shoulder to save time","Slow down, stop if needed, and proceed once every lane has yielded","Follow closely behind a fire engine that is already crossing the intersection"],"ans":2,"key":"At intersections, emergency vehicles must slow or stop and cross only after confirming every lane has yielded.","why":"Intersections are a leading location for ambulance crashes. Lights and siren only request the right of way; the driver must make sure each lane has stopped before crossing.","wrong":["Warning devices request the right of way but do not guarantee it; drivers may not see or hear you.","Passing on the right surprises drivers who pull to the right as expected, and it causes crashes.","","Drivers who have just watched one emergency vehicle pass often pull out without expecting a second one."],"src":"STD"},{"id":"OP-029","d":"OPS","topic":"Vehicle operations","concept":"due-regard-driving","b":1.5,"type":"mc","stem":"Responding with lights and siren to a pediatric seizure, you enter an intersection against a red light at a speed above the posted limit without slowing. A car that did not hear your siren pulls out and hits the ambulance. Regarding liability, which statement is most accurate?","opts":["You may be found at fault, because exemptions require driving with due regard for others","The other driver is automatically at fault for failing to yield to an emergency vehicle","You are protected because the lights and siren were on during a true emergency","Liability depends only on whether the patient's condition justified an emergency response"],"ans":0,"key":"Emergency driving exemptions apply only when the driver uses due regard for the safety of others.","why":"State laws allow emergency vehicles some exemptions, such as passing red lights, but only when the driver acts with due regard for the safety of all others on the road. Entering a busy intersection at speed without slowing may fail that test.","wrong":["","Other drivers must yield, but the ambulance driver still has a duty to drive with due regard; fault is not automatic.","Using warning devices does not relieve the driver of the duty to drive safely.","Even a true emergency does not excuse unsafe driving; how the vehicle was driven matters to liability."],"src":"STD"},{"id":"OP-030","d":"OPS","topic":"Vehicle operations","concept":"scene-positioning-traffic-and-air","b":0.5,"type":"mc","stem":"You arrive at a two-car crash in the right lane of a divided highway. A fire engine is already parked at an angle behind the crash, blocking the lane from approaching traffic. Where should you park the ambulance?","opts":["Behind the fire engine, upstream of the crash, so oncoming traffic sees you first","In the open left lane beside the crash for the shortest carry","On the far shoulder across the median, then walk the stretcher over","Beyond the crash, in the protected zone, with the loading area away from traffic"],"ans":3,"key":"At roadway incidents, the blocking vehicle is upstream and the ambulance parks downstream within the protected work zone.","why":"The angled engine shields the scene from approaching traffic. Parking beyond the crash keeps the ambulance inside that protected area, and placing the loading doors away from traffic lets the crew load without stepping into moving lanes.","wrong":["Parking behind the engine puts the crew outside the protected zone and makes them carry the patient through it.","An ambulance in an open lane is exposed to moving traffic and puts the crew outside the protected zone.","Crossing a divided highway on foot with a stretcher exposes the crew to traffic from both directions.",""],"src":"STD"},{"id":"OP-031","d":"OPS","topic":"Vehicle operations","concept":"scene-positioning-traffic-and-air","b":1.5,"type":"mr","stem":"A helicopter has been requested at night for a critically injured driver on a rural road. You are assigned to help set up and secure the landing zone. Select TWO actions that are correct.","opts":["Choose a firm, level area clear of wires, poles, and loose debris","Shine a spotlight at the helicopter as it approaches to help the pilot","Keep bystanders and vehicles close to the landing area to speed unloading","Approach the aircraft only when the flight crew signals, within the pilot's view","Approach from the rear of the aircraft to stay clear of the main rotor"],"ans":[0,3],"key":"A safe landing zone is level and free of hazards, and the crew approaches only on signal, in the pilot's view.","why":"Wires, poles, and loose debris can strike rotors or be blown into people. Approaching only on a flight crew signal and staying in the pilot's view keeps people away from the tail rotor and moving parts.","wrong":["","A bright light aimed at the aircraft can blind the pilot; lights should point at the ground or the landing area.","People and vehicles near the landing area are at risk from rotor wash and debris; keep them well back.","","The tail rotor at the rear is nearly invisible when spinning and is the most dangerous area of many helicopters."],"src":"STD"},{"id":"OP-032","d":"OPS","topic":"Vehicle operations","concept":"violent-scene-safety","b":-0.5,"type":"mc","stem":"You are dispatched to a home for a woman with a head injury after a reported domestic fight. Dispatch says police are en route but not yet on scene, and the caller hung up. Where should you position the ambulance?","opts":["In the driveway facing the house so you can reach the patient fastest","Out of sight at a safe distance until police report the scene secure","At the front door with the lights on so the occupants know help has arrived","Across the street, then walk to the door to check on the patient"],"ans":1,"key":"On scenes with possible violence, stage out of sight at a safe distance until law enforcement secures the scene.","why":"A domestic fight with a disconnected call may still be dangerous. Staging out of sight and away from the home protects the crew until police confirm the scene is safe, which allows care without new casualties.","wrong":["Parking in the driveway places the crew close to a possible threat and may block an escape route.","","Announcing your arrival can draw an aggressor's attention to the crew before the scene is secure.","Walking to the door before police arrive exposes the crew to the same danger that caused the injury."],"src":"STD"}];

/* Registry Ready — engine: grading, ability estimate, adaptive selection, spaced review, weak-domain analysis.
   Pure functions; no DOM. */

const ENGINE = (() => {
  const DKEYS = Object.keys(DOMAINS);
  const target = d => (DOMAINS[d].lo + DOMAINS[d].hi) / 2 / 100;
  const byId = Object.fromEntries(BANK.map(i => [i.id, i]));

  /* ---- grading: dichotomous, like the real exam ---- */
  function grade(item, resp) {
    if (resp == null) return false;
    if (item.type === "mc") return resp === item.ans;
    if (item.type === "mr") {
      const a = [...item.ans].sort().join(","), r = [...resp].sort().join(",");
      return a === r;
    }
    if (item.type === "order") return resp.every((v, i) => v === i) && resp.length === item.opts.length;
    if (item.type === "table") return item.rows.every((row, i) => resp[i] === row[1]);
    return false;
  }

  /* ---- Rasch ability estimate (EAP, N(0,1) prior) ---- */
  const GRID = []; for (let t = -4; t <= 4.0001; t += 0.05) GRID.push(t);
  function eap(responses) { // [{b, ok}]
    let w = GRID.map(t => Math.exp(-t * t / 2));
    for (const r of responses) {
      w = w.map((v, k) => { const p = 1 / (1 + Math.exp(-(GRID[k] - r.b))); return v * (r.ok ? p : 1 - p); });
      const s = w.reduce((a, c) => a + c, 0); w = w.map(v => v / s);
    }
    const s = w.reduce((a, c) => a + c, 0);
    const mean = GRID.reduce((a, t, k) => a + t * w[k], 0) / s;
    const v = GRID.reduce((a, t, k) => a + (t - mean) ** 2 * w[k], 0) / s;
    return { theta: mean, se: Math.sqrt(v) };
  }

  /* ---- adaptive practice exam ---- */
  const CAT = { min: 70, max: 120, cut: 0, z: 1.96, seconds: 7200 };
  function nextCatItem(session, rand = Math.random) {
    const used = new Set(session.items.map(x => x.id));
    const n = session.items.length;
    const counts = Object.fromEntries(DKEYS.map(d => [d, 0]));
    session.items.forEach(x => counts[byId[x.id].d]++);
    const order = DKEYS.map(d => ({ d, def: target(d) * (n + 1) - counts[d] })).sort((a, b) => b.def - a.def);
    const theta = session.theta ?? 0;
    for (const { d } of order) {
      const pool = BANK.filter(i => i.d === d && !used.has(i.id));
      if (!pool.length) continue;
      pool.sort((a, b) => Math.abs(a.b - theta) - Math.abs(b.b - theta));
      const top = pool.slice(0, Math.min(3, pool.length));
      return top[Math.floor(rand() * top.length)];
    }
    return null;
  }
  function catRecord(session, item, ok) {
    session.items.push({ id: item.id, ok });
    const est = eap(session.items.map(x => ({ b: byId[x.id].b, ok: x.ok })));
    session.theta = est.theta; session.se = est.se;
    return est;
  }
  function catShouldStop(session) {
    const n = session.items.length;
    if (n >= CAT.max) return "max";
    if (n >= CAT.min) {
      const lo = session.theta - CAT.z * session.se, hi = session.theta + CAT.z * session.se;
      if (lo > CAT.cut || hi < CAT.cut) return "confident";
    }
    if (!nextCatItem(session, () => 0)) return "bank";
    return null;
  }
  function catVerdict(session) {
    const lo = session.theta - CAT.z * session.se, hi = session.theta + CAT.z * session.se;
    if (lo > CAT.cut) return "above";
    if (hi < CAT.cut) return "below";
    return session.theta >= CAT.cut ? "near-above" : "near-below";
  }

  /* ---- spaced review (Leitner boxes) ---- */
  const DAY = 86400000;
  const INTERVAL = [0, 0, 1, 3, 7, 16, 35]; // days, index = box (1..6)
  function srsUpdate(srs, id, ok, now = Date.now()) {
    const c = srs[id] || { box: 0, due: now, seen: 0, right: 0 };
    c.seen++; if (ok) c.right++;
    c.box = ok ? Math.min(6, Math.max(1, c.box) + 1) : 1;
    c.due = now + (ok ? INTERVAL[c.box] * DAY : 10 * 60000); // missed: back in 10 minutes
    srs[id] = c;
    return c;
  }
  function dueItems(srs, now = Date.now()) {
    return Object.entries(srs).filter(([id, c]) => c.due <= now && byId[id]).sort((a, b) => a[1].due - b[1].due).map(([id]) => byId[id]);
  }

  /* ---- weak-domain analysis ---- */
  function domainStats(hist, window = 40) {
    const out = {};
    for (const d of DKEYS) {
      const rows = hist.filter(h => byId[h.id] && byId[h.id].d === d).slice(-window);
      const n = rows.length, right = rows.filter(r => r.ok).length;
      const acc = n ? right / n : null;
      const accForPriority = n >= 3 ? acc : 0.5;
      out[d] = { n, right, acc, weight: target(d), priority: target(d) * (1 - accForPriority), bank: BANK.filter(i => i.d === d).length };
    }
    return out;
  }
  function topicStats(hist) {
    const t = {};
    for (const h of hist) {
      const it = byId[h.id]; if (!it) continue;
      const k = it.d + "|" + it.topic;
      t[k] = t[k] || { d: it.d, topic: it.topic, n: 0, right: 0 };
      t[k].n++; if (h.ok) t[k].right++;
    }
    return Object.values(t).filter(x => x.n >= 2).map(x => ({ ...x, acc: x.right / x.n })).sort((a, b) => a.acc - b.acc);
  }
  function overallAbility(hist, last = 150) {
    const rows = hist.slice(-last).filter(h => byId[h.id]).map(h => ({ b: byId[h.id].b, ok: h.ok }));
    return rows.length ? { ...eap(rows), n: rows.length } : null;
  }

  /* ---- build a smart review queue: due first, then unseen items from the weakest domain ---- */
  function reviewQueue(state, size = 15, now = Date.now()) {
    const q = dueItems(state.srs, now).slice(0, size);
    if (q.length < size) {
      const ds = domainStats(state.hist);
      const ranked = DKEYS.slice().sort((a, b) => ds[b].priority - ds[a].priority);
      const seen = new Set(Object.keys(state.srs));
      const inQ = new Set(q.map(i => i.id));
      for (const d of ranked) {
        for (const it of BANK.filter(i => i.d === d && !seen.has(i.id) && !inQ.has(i.id)).sort((a, b) => a.b - b.b)) {
          if (q.length >= size) break;
          q.push(it); inQ.add(it.id);
        }
      }
      if (q.length < size) { // everything seen: earliest-due next
        const rest = Object.entries(state.srs).filter(([id]) => !inQ.has(id) && byId[id]).sort((a, b) => a[1].due - b[1].due);
        for (const [id] of rest) { if (q.length >= size) break; q.push(byId[id]); }
      }
    }
    return q;
  }

  function related(item) { return BANK.filter(i => i.concept && i.concept === item.concept && i.id !== item.id); }

  return { related, DKEYS, target, byId, grade, eap, CAT, nextCatItem, catRecord, catShouldStop, catVerdict, srsUpdate, dueItems, domainStats, topicStats, overallAbility, reviewQueue };
})();

const AUDIO = (() => {
  const cap = () => { const C = window.Capacitor; return !!(C && C.isNativePlatform && C.isNativePlatform() && typeof C.nativePromise === "function" && Array.isArray(C.PluginHeaders) && C.PluginHeaders.some(p => p && p.name === "TextToSpeech")); };

  let rate = 1, gen = 0;
  try { rate = +localStorage.getItem("rr-rate") || 1; } catch (e) {}
  function pickVoice() {
    try {
      const v = speechSynthesis.getVoices().filter(x => /^en[-_]US/i.test(x.lang));
      return v.find(x => /natural|enhanced|premium|google/i.test(x.name)) || v[0] || null;
    } catch (e) { return null; }
  }
  function available() { return !!(cap() || web()); }
  function speak(text) {
    const my = gen;
    if (cap()) return window.Capacitor.nativePromise("TextToSpeech", "speak", { text, lang: "en-US", rate, pitch: 1, volume: 1 }).catch(() => {}).then(() => my === gen);

    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = rate; const v = pickVoice(); if (v) u.voice = v;
      u.onend = () => res(my === gen); u.onerror = () => res(false);

    gen++;

  }
  const wait = ms => { const my = gen; return new Promise(r => setTimeout(() => r(my === gen), ms)); };
  function setRate(r) { rate = r; try { localStorage.setItem("rr-rate", String(r)); } catch (e) {} }
  return { available, speak, stop, wait, setRate, get rate() { return rate; }, get gen() { return gen; } };
})();

    h("p", { class: "muted" }, "Rehearse each station step by step with a partner or out loud. These are practice prompts; your program grades on the official NREMT skill sheets, so compare against those."),
    h("div", { class: "opts" }, SKILLS.map(s => {
      const runs = S.skills.filter(r => r.id === s.id);
      const lastRun = runs[runs.length - 1];
      return h("button", { class: "opt", onclick: () => openSkill(s) }, h("span", { style: "flex:1" }, h("strong", null, s.name), h("br"),
        h("span", { class: "muted", style: "font-size:.88rem" }, lastRun ? `Last run ${fmtDate(lastRun.t)} · ${lastRun.missed} missed, ${lastRun.crit} critical` : `${s.steps.length} steps · not practiced yet`)));
    })),
    recent.length ? h("section", { class: "panel" }, h("h3", null, "Recent runs"), h("div", { class: "list" }, recent.map(r => h("div", { class: "row", style: "justify-content:space-between" },
      h("span", null, SKILLS.find(s => s.id === r.id)?.name || r.id), h("span", { class: "mono" }, `${fmtDate(r.t)} · ${r.missed} missed · ${fmtTime(r.sec)}`))))) : null
  ];
}

function openSkill(s) {
  AUDIO.stop();
  ctx = { mode: "skill" };
  const checks = s.steps.map(() => false), crits = s.critical.map(() => false);
  let start = null, timerId = null, sec = 0;
  const tEl = h("span", { class: "timer" }, "0:00");
  const tick = () => { sec = Math.floor((Date.now() - start) / 1000); tEl.textContent = fmtTime(sec); };
  const tBtn = h("button", { class: "btn", onclick: () => {
    if (timerId) { clearInterval(timerId); timerId = null; tBtn.textContent = "Resume timer"; }
    else { start = Date.now() - sec * 1000; timerId = setInterval(tick, 250); tBtn.textContent = "Pause timer"; }
  } }, "Start timer");
  const stepEls = [];
  const stepList = h("div", null, s.steps.map((st, i) => { const el = h("label", { class: "chk", for: `st-${s.id}-${i}` },
    h("input", { type: "checkbox", id: `st-${s.id}-${i}`, onchange: e => checks[i] = e.target.checked }), h("span", null, h("span", { class: "mono muted" }, `${i + 1}. `), st)); stepEls.push(el); return el; }));
  const critList = h("div", null, s.critical.map((c, i) => h("label", { class: "chk", for: `cr-${s.id}-${i}` },
    h("input", { type: "checkbox", id: `cr-${s.id}-${i}`, style: "accent-color:var(--bad)", onchange: e => crits[i] = e.target.checked }), h("span", null, c))));
  const finish = () => {
    if (timerId) clearInterval(timerId); AUDIO.stop();
    const missed = checks.filter(x => !x).length, crit = crits.filter(x => x).length;
    S.skills.push({ id: s.id, t: Date.now(), missed, crit, sec, missedSteps: checks.map((c, i) => c ? null : i).filter(x => x != null) });
    save();
    ctx = null;
    $view.replaceChildren(h("h1", null, s.name), h("section", { class: "panel" },
      h("span", { class: "pill " + (crit ? "bad" : missed ? "warn" : "good") }, crit ? "Critical failure marked" : missed ? `${missed} step${missed > 1 ? "s" : ""} missed` : "All steps done"),
      missed ? h("ul", null, checks.map((c, i) => c ? null : h("li", null, s.steps[i]))) : null,
      h("p", { class: "mono" }, `Time ${fmtTime(sec)}`),
      h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => openSkill(s) }, "Run again"), h("button", { class: "btn", onclick: () => go("skills") }, "All skills"))));
    window.scrollTo(0, 0);
  };
  const walk = AUDIO.available() ? h("button", { class: "btn", onclick: async () => {
    AUDIO.stop(); await AUDIO.wait(50);
    if (!(await AUDIO.speak(`${s.name}. Say and do each step.`))) return;
    for (let i = 0; i < s.steps.length; i++) {
      stepEls[i].scrollIntoView({ block: "center", behavior: "smooth" }); stepEls[i].classList.add("now");
      const ok = await AUDIO.speak(`Step ${i + 1}. ${s.steps[i]}`);
      if (ok) await AUDIO.wait(4000);
      stepEls[i].classList.remove("now");
      if (!ok) return;
    }
    await AUDIO.speak("Finished. Check off what you did and review the critical failures.");
  } }, "Talk me through it") : null;
  $view.replaceChildren(
    h("div", { class: "row", style: "justify-content:space-between" }, h("button", { class: "btn small", onclick: () => { if (timerId) clearInterval(timerId); AUDIO.stop(); ctx = null; go("skills"); } }, "← Skills"), h("span", { class: "label" }, "Practice checklist")),
    h("h1", null, s.name),
    h("section", { class: "panel" }, h("div", { class: "row", style: "justify-content:space-between" }, tEl, h("div", { class: "row" }, tBtn, walk)),
      h("p", { class: "muted", style: "font-size:.88rem" }, "Talk through each step as you do it. A partner ticks the box when the step is done or clearly verbalized.")),
    h("section", { class: "panel" }, h("h3", null, "Steps"), stepList),
    h("section", { class: "crit" }, h("h3", { style: "color:var(--bad)" }, "Critical failures"), h("p", { class: "muted", style: "font-size:.88rem" }, "Tick any that happened. One is enough to fail a station."), critList),
    h("div", { class: "row" }, h("button", { class: "btn primary", onclick: finish }, "Finish and log run")));
  window.scrollTo(0, 0);
}

function viewProgress() {
  const ds = E.domainStats(S.hist);
  const ranked = E.DKEYS.slice().sort((a, b) => ds[b].priority - ds[a].priority);
  const topics = E.topicStats(S.hist).slice(0, 6);
  const known = Object.values(S.cards).filter(c => c.box >= 3).length;
  const confirmBox = h("div", { class: "confirm", hidden: true },
    h("p", null, "Erase all answers, review schedule, cards, exam history and skill runs? This cannot be undone."),
    h("div", { class: "row" },
      h("button", { class: "btn", style: "border-color:var(--bad);color:var(--bad)", onclick: () => { S = blank(); save(); render(); } }, "Erase everything"),
      h("button", { class: "btn", onclick: () => confirmBox.hidden = true }, "Keep my data")));
  return [
    h("h1", null, "Progress"),
    h("section", { class: "panel" }, h("h3", null, "Accuracy by domain"),
      h("p", { class: "muted", style: "font-size:.85rem" }, "Last 40 answers per domain. The orange tick marks 70%."),
      ...domainBars(ds)),
    h("section", { class: "panel" }, h("h3", null, "Where to spend time"),
      h("p", { class: "muted", style: "font-size:.85rem" }, "Ranked by exam weight × share of questions missed. High-weight domains with modest gaps outrank small domains with big gaps."),
      h("ol", { style: "margin:0;padding-left:22px;display:grid;gap:6px" }, ranked.map(d => h("li", null, h("strong", null, DOMAINS[d].name), h("span", { class: "muted" }, ` — ${ds[d].n >= 3 ? pct(ds[d].acc) + " correct" : "needs more answers"}`))))),
    topics.length ? h("section", { class: "panel" }, h("h3", null, "Weakest topics"),
      h("div", { class: "list" }, topics.map(t => h("div", { class: "row", style: "justify-content:space-between" },
        h("span", null, t.topic, h("span", { class: "muted", style: "font-size:.85rem" }, ` · ${DOMAINS[t.d].name}`)), h("span", { class: "mono" }, `${pct(t.acc)} of ${t.n}`))))) : null,
    h("section", { class: "panel" }, h("h3", null, "Memory cards"), h("p", null, h("span", { class: "big" }, known), " ", h("span", { class: "muted" }, `of ${CARDS.length} cards known well`))),
    h("section", { class: "panel foot" },
      h("h3", { style: "color:var(--ink)" }, "About"),
      h("p", null, `Registry Ready ${VERSION}. ${BANK.length} original practice questions, ${CARDS.length} memory cards and ${SKILLS.length} skills checklists by Jae H. Choi, PhD, DVSc · HAKOYA LLC.`),
      h("p", null, "Domains and weights follow the NREMT EMT Examination Specifications (2023 BLS Practice Analysis, in use since April 2025). Resuscitation content follows the 2025 AHA Guidelines for CPR and ECC. Follow your local protocols and your program's teaching where they differ."),
      h("p", null, "NREMT is a registered trademark of the National Registry of Emergency Medical Technicians. This app is not affiliated with or endorsed by the National Registry, and its questions are not taken from the exam."),
      h("div", { class: "row" }, h("button", { class: "btn small", onclick: () => { confirmBox.hidden = false; } }, "Erase my data")), confirmBox)
  ];
}

/* ---------- sessions ---------- */
function startSet(mode, items, title) {
  if (!items.length) return;
  AUDIO.stop();
  ctx = { mode, items, i: 0, right: 0, missed: [], title: title || "Review set" };
  stepSet();
}
function startDrill(d) {
  const pool = BANK.filter(i => i.d === d);
  const scored = shuffle(pool).sort((a, b) => ((S.srs[a.id]?.box ?? -1) - (S.srs[b.id]?.box ?? -1)));
  startSet("drill", scored.slice(0, 10), DOMAINS[d].name);
}
function stepSet() {
  const c = ctx;
  if (c.i >= c.items.length) return endSet();
  const item = c.items[c.i];
  const quit = h("button", { class: "btn small", onclick: endSet }, "End set");
  $view.replaceChildren(
    h("div", { class: "row", style: "justify-content:space-between" }, h("span", { class: "label" }, c.title), h("span", { class: "mono" }, `${c.i + 1} / ${c.items.length}`)),
    player(item, { feedback: true, footer: quit,
      practice: (rel, ok) => { // answer counts, then up to 3 questions on the same principle come next
        record(item, ok, c.mode); if (ok) c.right++; else c.missed.push(item.id);
        const ids = new Set(c.items.map(x => x.id));
        c.items.splice(c.i + 1, 0, ...rel.filter(r => !ids.has(r.id)).slice(0, 3));
        c.i++; stepSet(); window.scrollTo(0, 0);
      },
      onDone: ok => { record(item, ok, c.mode); if (ok) c.right++; else c.missed.push(item.id); c.i++; stepSet(); window.scrollTo(0, 0); } }));
}
function endSet() {
  const c = ctx; ctx = null; AUDIO.stop();
  const n = c.i;
  $view.replaceChildren(h("h1", null, "Set complete"),
    h("section", { class: "panel" },
      h("p", null, h("span", { class: "big" }, `${c.right}/${n}`), " ", h("span", { class: "muted" }, "correct")),
      c.missed.length ? h("p", null, `${c.missed.length} missed question${c.missed.length > 1 ? "s" : ""} will come back in about 10 minutes.`) : n ? h("p", null, "Nothing missed. These questions move to longer intervals.") : null,
      h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => startSet("review", E.reviewQueue(S, 15)) }, "Another review set"), h("button", { class: "btn", onclick: () => go("today") }, "Today"))));
}

function startExam() {
  AUDIO.stop();
  ctx = { mode: "exam", s: { items: [] }, t0: Date.now() };
  stepExam();
}
function stepExam() {
  const c = ctx;
  const elapsedS = Math.floor((Date.now() - c.t0) / 1000);
  if (E.catShouldStop(c.s) || elapsedS >= E.CAT.seconds) return endExam();
  const item = E.nextCatItem(c.s);
  const remain = h("span", { class: "mono" });
  const upd = () => { const left = Math.max(0, E.CAT.seconds - Math.floor((Date.now() - c.t0) / 1000)); remain.textContent = fmtTime(left) + " left"; if (left <= 0) endExam(); };
  upd(); clearInterval(c.tid); c.tid = setInterval(upd, 1000);
  const confirm = h("div", { class: "confirm", hidden: true }, h("p", null, "End the exam now? Answers so far will be scored."),
    h("div", { class: "row" }, h("button", { class: "btn", onclick: endExam }, "End and score"), h("button", { class: "btn", onclick: () => confirm.hidden = true }, "Keep going")));
  $view.replaceChildren(
    h("div", { class: "row", style: "justify-content:space-between" }, h("span", { class: "label" }, `Practice exam · question ${c.s.items.length + 1}`), remain),
    player(item, { feedback: false, footer: h("button", { class: "btn small", onclick: () => confirm.hidden = false }, "End exam"), onDone: ok => { E.catRecord(c.s, item, ok); record(item, ok, "exam"); stepExam(); window.scrollTo(0, 0); } }),
    confirm);
}
function endExam() {
  const c = ctx; if (!c || c.mode !== "exam") return;
  clearInterval(c.tid); ctx = null; AUDIO.stop();
  const s = c.s;
  if (!s.items.length) return go("exam");
  const by = {};
  for (const x of s.items) { const d = E.byId[x.id].d; by[d] = by[d] || { n: 0, right: 0 }; by[d].n++; if (x.ok) by[d].right++; }
  const verdict = E.catVerdict(s);
  const sec = Math.floor((Date.now() - c.t0) / 1000);
  S.exams.push({ t: Date.now(), n: s.items.length, theta: +s.theta.toFixed(3), se: +s.se.toFixed(3), verdict, by, sec });
  save();
  const missed = s.items.filter(x => !x.ok).map(x => E.byId[x.id]);
  $view.replaceChildren(h("h1", null, "Practice exam result"),
    h("section", { class: "panel" },
      h("span", { class: "pill " + verdictCls(verdict) }, verdictText(verdict)),
      h("p", { class: "mono" }, `${s.items.length} questions · ${s.items.filter(x => x.ok).length} correct · ${fmtTime(sec)}`),
      h("p", { class: "muted", style: "font-size:.85rem" }, "Like the real exam, the verdict depends on the difficulty of what you answered correctly, not only on percent correct.")),
    h("section", { class: "panel" }, h("h3", null, "By domain"),
      h("div", { class: "list" }, E.DKEYS.filter(d => by[d]).map(d => h("div", { class: "row", style: "justify-content:space-between" }, h("span", null, DOMAINS[d].name), h("span", { class: "mono" }, `${by[d].right}/${by[d].n}`))))),
    missed.length ? h("section", { class: "panel" }, h("h3", null, `Missed questions (${missed.length})`),
      h("p", { class: "muted", style: "font-size:.88rem" }, "These are now in your review set."),
      h("div", { class: "list" }, missed.map(it => h("div", null, h("p", null, h("strong", null, it.stem)), it.key ? h("p", { class: "keyline" }, it.key) : null)))) : null,
    h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => startSet("review", missed.length ? missed : E.reviewQueue(S, 15), "Exam review") }, missed.length ? "Review missed questions" : "Review set"), h("button", { class: "btn", onclick: () => go("today") }, "Today")));
  window.scrollTo(0, 0);
}

/* ---------- routing ---------- */
const VIEWS = { today: viewToday, exam: viewExam, study: viewStudy, skills: viewSkills, progress: viewProgress };
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  $view.replaceChildren(...VIEWS[tab]().filter(Boolean));
}
function go(t) {
  if (ctx && ctx.mode === "exam") clearInterval(ctx.tid);
  AUDIO.stop();
  ctx = null; tab = t; render(); window.scrollTo(0, 0);
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
const start = (location.hash || "").slice(1);
if (VIEWS[start]) tab = start;
render();
})();

</script>
