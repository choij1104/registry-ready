<style>
/* Layout: one column, phone-first; a chevron-striped header band like rig livery, sticky bottom nav. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#11212B; --muted:#56666E; --line:#D3DBDC;
  --accent:#D9480F; --accent-ink:#FFFFFF; --navy:#16324A; --navy-ink:#F2F6F7;
  --good:#1D7A3F; --good-bg:#E3F3E8; --bad:#B42318; --bad-bg:#FBE7E5; --warn:#9A5B00; --warn-bg:#FBF0DC;
  --chev-a:#D9480F; --chev-b:#F4C430;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E171C; --surface:#152229; --ink:#E5EDEF; --muted:#93A4AB; --line:#26363F;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --navy:#0A1A26; --navy-ink:#E5EDEF;
  --good:#5CCB84; --good-bg:#14301F; --bad:#FF7B6E; --bad-bg:#3A1A17; --warn:#F2B54A; --warn-bg:#352A12;
  --chev-a:#E2551B; --chev-b:#D9AE2B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E171C; --surface:#152229; --ink:#E5EDEF; --muted:#93A4AB; --line:#26363F;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --navy:#0A1A26; --navy-ink:#E5EDEF;
  --good:#5CCB84; --good-bg:#14301F; --bad:#FF7B6E; --bad-bg:#3A1A17; --warn:#F2B54A; --warn-bg:#352A12;
  --chev-a:#E2551B; --chev-b:#D9AE2B; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--navy);color:var(--navy-ink)}
header.top .wrap{padding-block:18px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:2rem;letter-spacing:.04em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:.8rem;letter-spacing:.02em;text-transform:none;opacity:.8;margin-top:6px}
.chev{height:14px;background:repeating-linear-gradient(-45deg,var(--chev-a) 0 14px,var(--chev-b) 14px 28px)}
.sync{font-family:var(--f-mono);font-size:.72rem;opacity:.8}
main .wrap{padding-block:18px 24px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
h1{font-size:1.9rem;line-height:1.05}
h2{font-size:1.4rem;line-height:1.1}
h3{font-size:1.1rem;text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
.muted{color:var(--muted)}
.label{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.82rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:10px 16px;border-radius:4px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 10px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.seg button:focus-visible,nav.tabs button:focus-visible,.chk input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--f-mono);font-weight:700;font-size:2.2rem;line-height:1}
.pill{display:inline-block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;padding:3px 8px;border-radius:3px}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border-left:4px solid var(--line);padding-left:10px;min-width:0}
.stat.hot{border-left-color:var(--accent)}
/* domain bars */
.dom{display:grid;gap:4px}
.dom .head{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.bar{position:relative;height:12px;background:var(--bg);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--navy)}
:root[data-theme="dark"] .bar i{background:#5A87A8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar i{background:#5A87A8}}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent)}
/* question */
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stem{font-size:1.12rem;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:5px;padding:12px;cursor:pointer;min-height:48px}
.opt .k{font-family:var(--f-mono);font-weight:700;min-width:1.4em;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--bg)}
:root[data-theme="dark"] .opt[aria-pressed="true"]{border-color:#7FA9C7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt[aria-pressed="true"]{border-color:#7FA9C7}}
.opt.is-right{border-color:var(--good);background:var(--good-bg)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.olist{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.olist li{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:5px;padding:8px 10px;background:var(--surface)}
.olist li span.t{flex:1;min-width:0}
.olist li.is-right{border-color:var(--good)} .olist li.is-wrong{border-color:var(--bad)}
.trow{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.9rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:6px 10px;cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--navy-ink)}
.seg button.is-right{border-color:var(--good);outline:2px solid var(--good)}
.feedback{border-left:5px solid var(--good);background:var(--good-bg);padding:12px;border-radius:0 4px 4px 0;display:grid;gap:6px}
.feedback.wrong{border-left-color:var(--bad);background:var(--bad-bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
/* skills */
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--good);flex:none}
.crit{border:2px solid var(--bad);border-radius:5px;padding:12px;display:grid;gap:6px}
.crit ul{margin:0;padding-left:20px}
.timer{font-family:var(--f-mono);font-weight:700;font-size:2rem}
.list{display:grid;gap:0}
.list > *{padding:10px 0;border-bottom:1px solid var(--line)}
.confirm{border:2px solid var(--bad);padding:12px;border-radius:5px;display:grid;gap:10px}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px}
nav.tabs button{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.88rem;background:none;border:0;color:var(--muted);padding:10px 2px;border-top:3px solid transparent;cursor:pointer;min-height:48px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
.ot{display:grid;gap:4px;min-width:0}
.why-not{display:block;font-size:.88rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:4px}
.keyline{border-left:3px solid var(--accent);padding-left:10px;font-weight:700}
.feedback .keyline .label{font-weight:700}
.flash .cardfront{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.15;text-wrap:balance}
.flash .cardans{font-size:1.1rem;font-weight:700}
.cardback{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.listen-stage{display:grid;gap:10px;min-height:120px}
.chk.now{background:var(--warn-bg);outline:2px solid var(--warn);outline-offset:-2px}
.foot{font-size:.82rem;color:var(--muted);display:grid;gap:6px}
@media (max-width:420px){.big{font-size:1.6rem}h1{font-size:1.6rem}.stat{padding-left:8px}}
@media (prefers-reduced-motion:no-preference){.opt,.seg button,.chip{transition:border-color .12s,background .12s}}
</style>

<script>
/* Registry Ready — domains (NREMT EMT Examination Specifications, 2023 BLS Practice Analysis; in use since April 2025) and source labels. */
const DOMAINS = {
  SCENE:     { name: "Scene Size-up and Safety",        lo: 15, hi: 19 },
  PRIMARY:   { name: "Primary Assessment",              lo: 39, hi: 43 },
  SECONDARY: { name: "Secondary Assessment",            lo: 5,  hi: 9  },
  TREAT:     { name: "Patient Treatment and Transport", lo: 20, hi: 24 },
  OPS:       { name: "Operations",                      lo: 10, hi: 14 }
};
const SRC = {
  AHA: "2025 AHA Guidelines for CPR and ECC",
  NRP: "2025 AHA/AAP Neonatal Resuscitation Guidelines",
  STD: "National EMS Education Standards and Scope of Practice Model, EMT level",
  START: "START / JumpSTART mass-casualty triage",
  ERG: "Emergency Response Guidebook (PHMSA)",
  FTG: "2021 National Guideline for the Field Triage of Injured Patients",
  SMR: "2018 ACS-COT/ACEP/NAEMSP joint statement on spinal motion restriction"
};

const BANK = [{"id":"SC-001","d":"SCENE","topic":"Scene safety","concept":"violent-scene-stage-or-retreat","b":-1,"type":"mc","stem":"You are dispatched at 2 a.m. to a reported shooting outside a convenience store. As you turn onto the street, you see a man lying on the sidewalk and a small group of people shouting near him. No police units are visible, and dispatch says officers are 4 minutes away. What should you do?","opts":["Park beside the patient, then size up the crowd while your partner begins care","Approach on foot with your partner to assess the patient, and retreat if threatened","Stage at a safe distance out of sight until police report the scene secure","Drive slowly past the scene to judge the crowd, then return to the patient"],"ans":2,"key":"On a scene of violence, stage out of sight until law enforcement declares it secure; an injured rescuer helps no one.","why":"A shooting with an agitated crowd and no police is an unsecured violent scene. Staging at a safe distance out of view protects the crew, and care begins as soon as officers declare the scene secure, which here is only minutes away.","wrong":["Parking beside the patient puts the crew in the middle of an unsecured shooting scene before any safety control exists.","Walking into an unsecured scene relies on noticing a threat in time; the shooter may still be present.","","Driving through the scene exposes the crew and ambulance to the same unsecured threat and draws attention to you."],"src":"STD"},{"id":"SC-002","d":"SCENE","topic":"Scene safety","concept":"traffic-scene-positioning","b":0.5,"type":"mc","stem":"You arrive at a two-car crash in the right lane of a four-lane interstate at dusk. A fire engine is already parked at an angle in the right lane about 50 feet behind the wreckage, shielding it from approaching traffic. One driver is still seated in her car. Where should you position the ambulance?","opts":["Ahead of the wreckage, so the loading area stays protected by the parked engine","Upstream of the fire engine, so the ambulance absorbs any impact before it reaches the crew","In the open left lane beside the wreckage, so the stretcher path is as short as possible","On the far shoulder across the median, so the crew can walk across to the patient"],"ans":0,"key":"When an apparatus blocks traffic, park the ambulance downstream of the crash so patient loading happens inside the protected zone.","why":"The angled engine creates a protected work area. Parking the ambulance beyond the wreckage keeps the stretcher path and rear loading doors inside that shielded space, away from moving traffic.","wrong":["","Parking upstream of the blocker puts your crew and loading area outside the protected zone, exposed to approaching traffic.","The open left lane still carries moving traffic; parking there exposes the crew and the patient during loading.","Crossing travel lanes on foot with equipment and a patient is one of the most dangerous things you can do on a highway."],"src":"STD"},{"id":"SC-003","d":"SCENE","topic":"Scene safety","concept":"traffic-scene-positioning","b":0,"type":"mr","stem":"At night you are working a single-vehicle crash on a two-lane highway. A sheriff's car blocks the lane behind the scene, but traffic is still passing in the opposite lane. Your patient is the driver, who has a forearm laceration. Which actions reduce your crew's risk from traffic? Select TWO.","opts":["Wear a high-visibility reflective vest whenever you are outside the ambulance on the roadway","Stand in the open lane and wave traffic slowly past while your partner treats the patient","Keep your work area and stretcher path on the side of the vehicles shielded from moving traffic","Turn your back to approaching traffic so you can focus fully on the patient","Park the ambulance in the open lane beside the patient's car to shorten the stretcher path"],"ans":[0,2],"key":"On roadways, be visible (high-visibility vest) and keep your work area inside the space shielded from moving traffic.","why":"Struck-by incidents are a leading cause of responder deaths at roadway scenes. Reflective vests make crews visible at night, and working on the shielded side of the blocking vehicles keeps people out of the path of passing cars.","wrong":["","Traffic control is a law enforcement task; standing in a live lane puts you directly in the path of vehicles.","","Turning your back to traffic removes your ability to see and avoid an approaching vehicle.","Parking in the open lane blocks the only travel lane and puts your crew in moving traffic while loading."],"src":"STD"},{"id":"SC-004","d":"SCENE","topic":"Scene safety","concept":"vehicle-stabilization","b":-0.5,"type":"mc","stem":"A pickup truck has rolled onto its passenger side in a ditch. The driver, a 40-year-old man, is hanging in his seat belt, talking, and complaining of neck pain. The truck rocks when a bystander leans on it. Fire rescue is on scene with cribbing. What should happen before you reach in to assess him?","opts":["A bystander holds the truck steady while you climb onto its side","The rescue crew stabilizes the truck with cribbing or struts","You cut the seat belt so he drops onto the door for easier access","He unbuckles himself and crawls out to you through the windshield"],"ans":1,"key":"A vehicle that moves must be stabilized with cribbing or struts before anyone enters or reaches into it.","why":"A truck on its side that rocks can roll onto rescuers or worsen the patient's injuries. Rescue crews stabilize it with cribbing or struts first; then you can safely reach the patient and begin spinal motion restriction as indicated.","wrong":["A bystander cannot hold a rolled truck steady, and climbing on it adds weight that can make it shift.","","Cutting the belt drops a patient with neck pain onto the door, risking further injury, and the truck is still unstable.","Self-extrication by crawling twists the spine of a patient with neck pain and does not address the unstable vehicle."],"src":"STD"},{"id":"SC-005","d":"SCENE","topic":"Scene safety","concept":"vehicle-stabilization","b":0.5,"type":"mc","stem":"A sedan has struck a utility pole at low speed. The car is upright, the engine is running, and the brake lights are on. The 68-year-old driver is alert, gripping the wheel, and says her chest hurts where the belt crossed it. No wires are down. You are about to open her door. What should you do first?","opts":["Apply a cervical collar while she keeps her foot on the brake","Ask her to step out of the car and walk to your stretcher","Begin a primary assessment through the window before touching anything else","Have her put the car in park, turn off the ignition, and chock a wheel"],"ans":3,"key":"A running vehicle in gear is a scene hazard; get it in park, ignition off, and stabilized before patient care.","why":"If her foot slips off the brake, the car can lurch and injure her or the crew. Putting it in park, shutting off the engine, and chocking a wheel controls the hazard in seconds, after which care can begin.","wrong":["Placing a collar while the engine runs and the car is in gear leaves the movement hazard in place.","Having her walk before the car is secured and before she is assessed ignores both the vehicle hazard and her chest injury.","Assessment can wait seconds; the running car in gear is an immediate hazard to everyone at the door.",""],"src":"STD"},{"id":"SC-006","d":"SCENE","topic":"Scene safety","concept":"electrical-hazard","b":0,"type":"mc","stem":"A car has struck a utility pole, and a power line is draped across the hood. There is no smoke or fire. The driver, a 25-year-old man, is alert with a bleeding scalp and is starting to open his door to get out. You are 60 feet away. What should you tell him?","opts":["Jump clear with both feet together so you never touch the car and the ground at once","Climb out the passenger side, away from where the line touches the hood","Stay inside the car and keep still until the utility company shuts off the line","Wait while we move the line off the hood with a dry wooden pole"],"ans":2,"key":"Treat every downed line as energized; an occupant with no fire should stay in the vehicle until the utility de-energizes it.","why":"The vehicle body may be energized, and stepping out completes a path to ground. Without fire, staying inside is the safest option until the utility company confirms the line is dead; his scalp wound can be managed with pressure he applies himself.","wrong":["Jumping clear is reserved for a forced exit such as fire; with no fire, it adds risk for no benefit.","Any door contacts the same energized vehicle; leaving by the passenger side still risks electrocution.","","EMTs do not move power lines; wood can conduct electricity, especially if damp, and the line must be handled by the utility."],"src":"STD"},{"id":"SC-007","d":"SCENE","topic":"Scene safety","concept":"electrical-hazard","b":1,"type":"mc","stem":"A 50-year-old man trimming a tree contacted a power line. He is lying motionless on wet grass about 15 feet from where the line has fallen. As you walk toward him, you feel a tingling sensation in your feet. What should you do?","opts":["Stop, shuffle back with small steps, feet together, and wait for the utility company","Run quickly to the patient and drag him farther from the fallen line","Put on a second pair of medical gloves and continue toward the patient slowly and carefully","Lay a dry blanket over the wet grass and walk to the patient on it"],"ans":0,"key":"Tingling in the feet means energized ground; shuffle back out without lifting your feet and wait for the utility.","why":"Current spreading through the ground creates a voltage difference between your feet. Shuffling out with feet close together limits that difference. No one approaches the patient until the utility confirms the line is de-energized.","wrong":["","Long running strides increase the voltage difference between your feet and can electrocute you before you reach him.","Medical gloves are not rated electrical protection and do nothing for current entering through your feet.","A blanket on wet ground does not insulate you from energized soil and quickly becomes wet itself."],"src":"STD"},{"id":"SC-008","d":"SCENE","topic":"Scene safety","concept":"wait-for-hazard-control","b":-1.5,"type":"mc","stem":"You arrive at a house fire before the first engine. Heavy smoke is pouring from the second-floor windows. A neighbor tells you a teenager may still be upstairs. You have no turnout gear or breathing apparatus. What should you do?","opts":["Enter through the front door, staying low, and search the first floor","Relay the report to dispatch and arriving fire units, and stage safely to treat victims","Cover your face with a wet towel and make a quick search of the stairway","Break a ground-floor window so smoke can vent from the house before the first engine arrives"],"ans":1,"key":"EMTs without fire gear and breathing apparatus do not enter a burning building; pass on victim information and stand ready to treat.","why":"Smoke and heat incapacitate within breaths, and an untrained rescuer becomes a second victim. The most useful action is to give arriving firefighters the location of the possible victim and set up to receive and treat anyone they bring out.","wrong":["Entering a smoke-filled house without SCBA or turnout gear risks rapid incapacitation and death.","","A wet towel does not filter carbon monoxide or other toxic gases and gives no heat protection.","Opening a window without fire crews in place can feed air to the fire and make it spread faster."],"src":"STD"},{"id":"SC-009","d":"SCENE","topic":"Scene safety","concept":"wait-for-hazard-control","b":-1,"type":"mc","stem":"You are called to a home for a 79-year-old woman who fell. Her son opens the door, and a large dog behind him is barking, growling, and lunging toward you. You can hear the patient calling for help from the kitchen. What should you do?","opts":["Walk in calmly while avoiding eye contact with the dog","Hold your jump kit in front of you as a shield and go to the kitchen","Request animal control and wait outside until they arrive","Ask the son to secure the dog in a closed room before you go in"],"ans":3,"key":"Have the owner secure an aggressive animal in a closed room before you enter; animal control is for when that is not possible.","why":"A lunging dog is a real threat to the crew. The owner is right there and can control it within a minute, which removes the hazard without a long delay in reaching the patient.","wrong":["A growling, lunging dog may attack regardless of your body language; the hazard has not been controlled.","Using equipment as a shield invites a bite and leaves you defending yourself instead of treating the patient.","Waiting for animal control delays care unnecessarily when the owner can secure the dog now.",""],"src":"STD"},{"id":"SC-010","d":"SCENE","topic":"Scene safety","concept":"violent-scene-stage-or-retreat","b":0.5,"type":"mc","stem":"You are treating a 19-year-old man with a stab wound to the thigh outside a bar. Police have left to chase a suspect. A crowd gathers and grows louder, and someone throws a bottle that shatters near your ambulance. The bleeding is controlled with a pressure dressing. What should you do?","opts":["Stay and finish the secondary assessment, then load the patient","Ask the crowd to step back and continue care on the sidewalk","Load the patient quickly and leave the area, continuing care en route","Leave the patient with bystanders and return to the ambulance to call police"],"ans":2,"key":"When a scene turns hostile, remove yourself and the patient quickly and continue care from a safe location.","why":"A thrown bottle means the scene is no longer safe. With bleeding controlled, the patient can be moved immediately; leaving with him protects the crew and still gives him care during transport.","wrong":["Staying for a full assessment keeps everyone exposed to an escalating crowd that has already thrown objects.","An EMT cannot reliably control a hostile crowd, and continuing care on the sidewalk keeps the crew exposed.","","Leaving a patient you have started treating with bystanders is abandonment when you can safely take him with you."],"src":"STD"},{"id":"SC-011","d":"SCENE","topic":"Hazardous materials","concept":"erg-lookup","b":0,"type":"mc","stem":"You are first on scene at an overturned tanker truck on a rural highway. You stopped about 500 feet away, uphill and upwind. Through binoculars you see an orange panel with the number 1203 and a red placard. The driver is walking along the shoulder away from the truck. In the Emergency Response Guidebook, where do you look first?","opts":["The placard table, to choose a guide based on the red placard alone","The yellow-bordered pages, to find the guide number listed for ID 1203","The blue-bordered pages, to find the guide number listed for ID 1203","The green-bordered pages, to find the isolation distance listed for ID 1203"],"ans":1,"key":"With a 4-digit ID number, start in the ERG yellow pages (listed by ID) to get the correct orange guide.","why":"The yellow-bordered pages list materials by their 4-digit UN/NA ID number and point to the matching orange-bordered guide. The ID number is more specific than the placard, so it is the best starting point when you can read it.","wrong":["The placard table is a fallback when no ID number or name is available; a known ID gives a more specific guide.","","The blue-bordered pages are organized alphabetically by material name, not by ID number.","The green pages give isolation and protective-action distances for highlighted materials; you go there after the yellow pages, not first."],"src":"ERG"},{"id":"SC-012","d":"SCENE","topic":"Hazardous materials","concept":"erg-lookup","b":1.5,"type":"mc","stem":"A box truck has crashed and is leaking an unknown liquid that gives off a faint vapor. The placards are burned and unreadable, and the driver is slumped unconscious in the cab. You stopped 400 feet away. What is your best initial approach?","opts":["Stay uphill and upwind, use the ERG guide for unidentified cargo, request hazmat","Approach close enough to read the shipping papers in the cab, then select a guide","Treat the liquid as nonhazardous until a hazmat team identifies it otherwise","Approach the driver from downwind so the vapor is carried away from the cab"],"ans":0,"key":"When a material cannot be identified, stay uphill and upwind, use ERG Guide 111 (unidentified cargo), and call hazmat.","why":"An unknown leaking material with an unconscious victim nearby must be assumed dangerous. The ERG directs responders to Guide 111 when the material cannot be identified, and rescue of the driver is left to trained responders in proper protective equipment.","wrong":["","Walking to the cab puts you in an unknown vapor that may have already caused the driver to lose consciousness.","An unconscious driver near a vaporizing unknown liquid is a warning sign; assuming it is harmless invites exposure.","Downwind is where the vapor travels; approaching from downwind puts you directly in the plume."],"src":"ERG"},{"id":"SC-013","d":"SCENE","topic":"Hazardous materials","concept":"hazmat-zones-decon","b":0.5,"type":"table","stem":"A chlorine leak at a water treatment plant has produced several patients. Fire command has set up hot, warm, and cold zones. Classify where each activity belongs.","cols":["Hot zone","Warm zone","Cold zone"],"rows":[["An entry team in specialized protective gear removes a worker from the leak area",0],["Responders in protective gear remove patients' contaminated clothing",1],["Patients are rinsed in the decontamination corridor",1],["EMTs triage and treat patients who have been decontaminated",2],["Ambulances wait in staging for transport assignments",2]],"key":"Rescue happens in the hot zone, decontamination in the warm zone, and EMS triage, treatment, and staging in the cold zone.","why":"The hot zone contains the release and is entered only by trained teams in proper protective gear. Decontamination takes place in the warm zone, and EMTs work in the cold zone with patients who have already been decontaminated.","src":"ERG"},{"id":"SC-014","d":"SCENE","topic":"Hazardous materials","concept":"hazmat-zones-decon","b":1.5,"type":"mc","stem":"At a pesticide spill at a farm supply store, you are posted in the cold zone. A 34-year-old worker walks to your ambulance from the direction of the spill. His shirt is soaked with liquid, he smells strongly of chemicals, and he says he skipped decontamination. He is alert and anxious, RR 18. What should you do?","opts":["Have him sit on your stretcher and remove his shirt while you assess him","Load him into the ambulance and transport him to the nearest hospital","Rinse him with your saline supply beside the ambulance, then begin your assessment","Keep your distance and direct him to decontamination before you provide care"],"ans":3,"key":"Contaminated patients must go through decontamination before entering the cold zone or the ambulance, or they contaminate the crew.","why":"A soaked, chemical-smelling patient carries the hazard with him. Sending him back to decontamination protects him, you, your ambulance, and the receiving hospital; since he is alert and breathing normally, a short delay is safe.","wrong":["Handling his soaked clothing without protective gear exposes you, and your stretcher becomes contaminated.","Transporting him undecontaminated contaminates the ambulance, the crew, and the emergency department.","A few bottles of saline is not proper decontamination and spreads the chemical across your work area.",""],"src":"ERG"},{"id":"SC-015","d":"SCENE","topic":"Hazardous materials","concept":"toxic-atmosphere-no-entry","b":0.5,"type":"mr","stem":"On a cold January morning you respond to a home where a 36-year-old woman and her two children all have headache, nausea, and dizziness. The furnace has run all night. The mother's SpO2 reads 99% on room air. Which actions are most appropriate? Select TWO.","opts":["Use the normal SpO2 reading to rule out carbon monoxide exposure","Move everyone, including your crew, out of the house into fresh air","Stay inside to treat the family so the children remain calm and warm","Give high-concentration oxygen by nonrebreather mask despite the normal SpO2","Turn off the furnace yourself and reassess the family inside after 10 minutes"],"ans":[1,3],"key":"Several people with headache and nausea in one building suggests carbon monoxide: get everyone out and give high-flow oxygen.","why":"Similar symptoms in everyone in a heated home point to carbon monoxide. Standard pulse oximetry cannot tell carboxyhemoglobin from oxyhemoglobin, so a normal reading is false reassurance; removal to fresh air and high-concentration oxygen are the key actions, with fire crews metering the house.","wrong":["Standard pulse oximeters read carboxyhemoglobin as oxygenated hemoglobin, so SpO2 can look normal in CO poisoning.","","Staying inside keeps the family and crew in the toxic atmosphere.","","The house is still full of CO after the furnace is off; fire crews should meter and ventilate it before anyone goes back in."],"src":"STD"},{"id":"SC-016","d":"SCENE","topic":"Hazardous materials","concept":"toxic-atmosphere-no-entry","b":0,"type":"mc","stem":"A farmhand called 911 because his coworker climbed down into a manure pit to fix a pump and collapsed at the bottom. When you arrive, a second worker has gone in after him and also collapsed. Both are motionless about 12 feet down. What should you do?","opts":["Climb down with a rope tied around your waist while your partner holds it","Lower an oxygen mask on a rope and climb down once the air seems fresher","Stay out of the pit, keep others out, and request a technical rescue team","Hold your breath and climb down quickly to pull the closest worker to the ladder"],"ans":2,"key":"Collapse of a would-be rescuer means a toxic or oxygen-poor atmosphere; do not enter a confined space without training and equipment.","why":"Manure pits can hold hydrogen sulfide and too little oxygen, and a second collapse confirms the atmosphere is lethal. Entering without supplied air adds a third victim; your job is to keep others out and get a trained confined-space rescue team moving.","wrong":["A rope does not protect you from the gas that dropped two people; you would likely collapse before being pulled out.","An oxygen mask does not change the atmosphere in the pit, and how the air seems tells you nothing about gas levels.","","Gases like hydrogen sulfide can cause collapse very quickly, and the climb and lift take far longer than a held breath."],"src":"STD"},{"id":"SC-017","d":"SCENE","topic":"PPE and infection control","concept":"transmission-based-precautions","b":-1,"type":"mc","stem":"A 45-year-old man has had a cough for 2 months with night sweats, weight loss, and blood-streaked sputum. He is alert, RR 22, SpO2 95% on room air. You suspect active tuberculosis. What respiratory protection is most appropriate during transport?","opts":["A fit-tested N95 for the crew and a surgical mask on the patient if tolerated","A surgical mask for the crew and a nonrebreather mask on the patient at 15 L/min","Gloves and a gown only, since tuberculosis spreads through contact with sputum","An N95 respirator on the patient and surgical masks for the crew"],"ans":0,"key":"Suspected TB needs airborne precautions: N95 respirators for the crew and a surgical mask on the patient.","why":"Tuberculosis spreads through tiny airborne particles that a surgical mask does not filter. Fit-tested N95 respirators protect the crew, and a surgical mask on the patient reduces the particles he releases.","wrong":["","A surgical mask does not protect against airborne particles, and his SpO2 of 95% does not call for high-flow oxygen.","TB is spread through the air, so gown and gloves alone leave the crew's airway unprotected.","The respirator belongs on the crew; a surgical mask on the crew does not protect against airborne particles."],"src":"STD"},{"id":"SC-018","d":"SCENE","topic":"PPE and infection control","concept":"transmission-based-precautions","b":0.5,"type":"table","stem":"During one shift you transport several patients with known or suspected infections. In addition to standard precautions, classify the main transmission-based precaution each patient needs.","cols":["Airborne","Droplet","Contact"],"rows":[["A 3-year-old with measles: fever, cough, and a spreading rash",0],["A 70-year-old with confirmed seasonal influenza",1],["A 2-month-old with suspected pertussis (whooping cough)",1],["A nursing home resident with C. difficile diarrhea",2],["A 30-year-old with suspected active pulmonary tuberculosis",0]],"key":"Measles and TB are airborne (N95), influenza and pertussis are droplet (surgical mask), and C. difficile is contact (gown, gloves).","why":"Measles and tuberculosis travel as small airborne particles and need fit-tested respirators. Influenza and pertussis spread by larger droplets within a few feet, and C. difficile spreads through contaminated hands and surfaces.","src":"STD"},{"id":"SC-019","d":"SCENE","topic":"PPE and infection control","concept":"ppe-doffing-hand-hygiene","b":1,"type":"mc","stem":"You transport an 82-year-old nursing home resident with frequent watery diarrhea and confirmed Clostridioides difficile infection. You wore a gown and gloves throughout. After transferring care at the hospital, you remove your PPE. Which hand hygiene is best?","opts":["Alcohol-based hand rub, rubbing for at least 20 seconds","Soap and running water, washing all hand surfaces","No hand hygiene, because gloves were worn the whole call","The disinfectant wipe used to clean the stretcher"],"ans":1,"key":"After C. difficile care, wash with soap and water; alcohol does not kill its spores, and washing removes them better.","why":"C. difficile forms spores that alcohol does not kill. Washing with soap and running water physically removes more spores, and CDC lists soap and water as preferred when caring for C. difficile patients during outbreaks; gloves and gown remain the main protection.","wrong":["Alcohol-based rub works for most germs but does not kill C. difficile spores or reliably remove them.","","Gloves can have tiny defects and hands get contaminated during removal, so hand hygiene is always needed.","Surface disinfectant wipes are made for equipment, not skin, and are not a substitute for handwashing."],"src":"STD"},{"id":"SC-020","d":"SCENE","topic":"PPE and infection control","concept":"ppe-doffing-hand-hygiene","b":0.5,"type":"order","stem":"You wore gloves, a gown, goggles, and a surgical mask while caring for a vomiting patient with suspected norovirus. Using the CDC sequence in which the gown and gloves are removed separately (Example 1), place the PPE removal steps in order.","opts":["Remove gloves","Remove goggles","Remove gown","Remove surgical mask","Perform hand hygiene"],"key":"CDC Example 1 doffing: gloves, goggles or face shield, gown, mask, then hand hygiene right after all PPE is off.","why":"Gloves are the most contaminated item and come off first, followed by eye protection and the gown, handling only ties and straps. The mask is removed last by its ties or ear loops, and hand hygiene follows immediately after all PPE is removed (and any time hands become contaminated).","src":"STD"},{"id":"SC-021","d":"SCENE","topic":"PPE and infection control","concept":"exposure-response","b":0,"type":"mc","stem":"While checking a patient's blood glucose, the used lancet slips and punctures your gloved finger. The patient has a known history of hepatitis C. The patient is now stable and your partner can take over care. What should you do?","opts":["Squeeze the puncture firmly to force out blood, then pour bleach on the site","Cover it with a bandage and report the exposure at the end of your shift","Watch for symptoms over the next 6 months before filing a report","Wash the site with soap and water, then report the exposure immediately"],"ans":3,"key":"After a needlestick, wash the site with soap and water and report immediately so evaluation and follow-up start promptly.","why":"Prompt washing and immediate reporting start your agency's exposure process, including source testing and medical evaluation. Some follow-up treatments work best when started within hours, so waiting until the end of the shift loses time.","wrong":["Squeezing the wound and using bleach or other caustic agents are not recommended and can damage tissue.","Delaying the report until the end of the shift can delay evaluation and any time-sensitive treatment.","Waiting for symptoms misses the window for testing and treatment and breaks reporting requirements.",""],"src":"STD"},{"id":"SC-022","d":"SCENE","topic":"PPE and infection control","concept":"exposure-response","b":-0.5,"type":"mc","stem":"A combative 30-year-old man with a bleeding scalp laceration shakes his head, and blood sprays across your face. You feel it in your left eye; you were not wearing eye protection. Police now have him restrained, and your partner is with him. What should you do next?","opts":["Wipe the eye with a clean gauze pad and continue care","Rub the eye gently to clear it, then finish the call before reporting","Flush the eye with plenty of water or saline, then report the exposure promptly","Apply a sterile eye patch, then report the exposure to your supervisor at the end of your shift"],"ans":2,"key":"Blood in the eye is an exposure: flush with plenty of water or saline right away, then report promptly.","why":"Mucous membranes such as the eye can absorb bloodborne pathogens. Copious irrigation removes as much blood as possible, and prompt reporting starts evaluation and follow-up.","wrong":["Wiping does not remove blood from the surface of the eye; it must be irrigated.","Rubbing can spread blood across the eye, and delaying the report delays evaluation.","","A patch traps blood against the eye, and waiting until the end of the shift delays evaluation."],"src":"STD"},{"id":"SC-023","d":"SCENE","topic":"Mechanism of injury","concept":"moi-anticipate-injury","b":-0.5,"type":"mc","stem":"A 34-year-old unrestrained driver struck a tree head-on at about 40 mph. The airbag did not deploy. You see a bent steering wheel and a starred windshield in front of the driver's seat. He is alert and complains only of a painful, deformed wrist. Which injuries should this mechanism make you suspect?","opts":["An isolated wrist fracture from bracing on the steering wheel","Chest and head injuries, even though he reports only wrist pain","A whiplash neck strain typical of a rear impact","Facial and forearm burns from airbag deployment"],"ans":1,"key":"A bent steering wheel and starred windshield mean the chest and head took the impact; suspect injuries the patient does not report.","why":"Damage inside the vehicle shows where the occupant struck. A bent wheel points to chest impact and a starred windshield to head impact, and a painful wrist can distract him from those injuries.","wrong":["The wrist is the obvious injury, but the vehicle damage shows his chest and head absorbed major forces too.","","This was a frontal impact into a tree, not a rear impact.","The airbag did not deploy, so airbag burns are not expected."],"src":"STD"},{"id":"SC-024","d":"SCENE","topic":"Mechanism of injury","concept":"moi-anticipate-injury","b":0.5,"type":"mc","stem":"A 58-year-old woman was driving when a pickup truck struck her door at an intersection. The driver's door is pushed in about 14 inches. She is alert, pale, and says her left side hurts. BP 118/76, HR 104, RR 22, SpO2 95%. Which injury pattern should you anticipate?","opts":["Left chest, pelvic, and spleen injuries from the side impact","Knee, femur, and hip injuries from striking the dashboard","A neck hyperextension injury typical of a rear impact","Isolated left arm fractures from the door striking her arm"],"ans":0,"key":"A driver-side impact loads the left chest, pelvis, and spleen; door intrusion means high energy reached the occupant.","why":"In a lateral impact, the door is driven into the near side of the occupant. For a driver struck on the left, that means left rib, lung, spleen, and pelvic injuries, and her tachycardia and pallor fit internal bleeding.","wrong":["","Knee, femur, and hip injuries are typical of a frontal impact with the knees striking the dashboard.","Hyperextension of the neck is classic for a rear impact, not a side impact.","The arm may be hurt, but door intrusion of 14 inches transmits force to the chest, abdomen, and pelvis too."],"src":"STD"},{"id":"SC-025","d":"SCENE","topic":"Mechanism of injury","concept":"moi-anticipate-injury","b":0,"type":"mc","stem":"A 46-year-old roofer fell about 15 feet from a ladder and landed on his feet on concrete. He is sitting up, alert, and says both heels hurt badly. He denies other pain. What should the mechanism lead you to also suspect?","opts":["Only soft tissue bruising of both feet","A shoulder dislocation from gripping the ladder as he fell","A lumbar spine compression injury transmitted up from the impact","A skull fracture from his head striking the concrete"],"ans":2,"key":"A feet-first landing from height drives force up the legs: suspect heel fractures plus lumbar spine compression injury.","why":"When someone lands on the feet, energy travels from the heels through the legs and pelvis into the lower spine. Severe heel pain should prompt a careful check of the lumbar spine and other axial injuries.","wrong":["Severe bilateral heel pain after a 15-foot fall suggests fractures, not just bruising.","Nothing in the history suggests he held onto the ladder, and it does not explain the energy path.","","He landed on his feet and has no head complaints; the energy path points to the lower spine, not the skull."],"src":"STD"},{"id":"SC-026","d":"SCENE","topic":"Mechanism of injury","concept":"field-triage-2021","b":0.5,"type":"mc","stem":"A 29-year-old woman was the restrained front-seat passenger in a rollover crash. The rear-seat passenger died at the scene. She is alert and oriented, GCS 15, BP 124/80, HR 96, RR 18, SpO2 98%, with only minor abrasions. Using the 2021 field triage guideline, what destination is most appropriate?","opts":["The nearest community hospital, because she meets no physiologic or anatomic criteria","An urgent care clinic, because her injuries appear minor","The highest-level trauma center, because a rollover by itself is a red criterion","A trauma center, because a death in the same compartment is a high-risk mechanism"],"ans":3,"key":"A death in the same passenger compartment is a yellow (high-risk crash) criterion; transport to a trauma center.","why":"Under the 2021 guideline, a death in the passenger compartment is a high-risk crash criterion. Patients meeting yellow criteria without red criteria should go to a trauma center, which need not be the highest level.","wrong":["Normal vital signs and no anatomic findings do not cancel a high-risk mechanism; yellow criteria still direct her to a trauma center.","An urgent care clinic cannot evaluate occult injuries after a high-energy crash that killed another occupant.","Rollover alone is not a criterion in the 2021 guideline, and she has no red injury or physiologic findings.",""],"src":"FTG"},{"id":"SC-027","d":"SCENE","topic":"Mechanism of injury","concept":"field-triage-2021","b":1.5,"type":"mc","stem":"A 74-year-old man was the restrained driver in a moderate-speed rear-end collision. He takes no blood thinners. He is alert, GCS 15, with mild chest wall tenderness from the belt. BP 106/70, HR 88, RR 18, SpO2 96%. Under the 2021 field triage guideline, how should you classify him?","opts":["No criteria are met, because his systolic BP is above 90 mm Hg","A red criterion is met, because SBP under 110 mm Hg applies at age 65 and older","A yellow criterion is met, because age over 65 alone calls for a trauma center","Only an EMS judgment factor applies, because his heart rate is below his systolic BP"],"ans":1,"key":"In the 2021 guideline, a systolic BP under 110 mm Hg in a patient 65 or older is a red criterion.","why":"Older adults can be in shock at blood pressures that look acceptable in younger patients. The 2021 guideline therefore uses an SBP under 110 mm Hg as a red criterion at age 65 and older, directing him to the highest-level trauma center available.","wrong":["The cutoff of 90 mm Hg applies to ages 10 to 64; at 74, the threshold is 110 mm Hg.","","Age alone is not a triage criterion; his low systolic BP for his age is.","HR greater than SBP is a separate red criterion; its absence does not cancel the low systolic BP."],"src":"FTG"},{"id":"SC-028","d":"SCENE","topic":"Mechanism of injury","concept":"field-triage-2021","b":1.5,"type":"mr","stem":"You are evaluating injured workers at a construction site collapse using the 2021 field triage guideline. Which findings are RED criteria for transport to the highest-level trauma center? Select THREE.","opts":["A worker with a traumatic amputation of the leg above the ankle","A worker who fell 14 feet but is alert with normal vital signs","A worker with an unstable, painful pelvis after a beam struck his hip","A worker who takes a daily anticoagulant and struck his head","A 22-year-old worker with HR 104 and BP 126/80 after being struck by debris","A worker who cannot follow commands after a head injury"],"ans":[0,2,5],"key":"Red criteria include amputation proximal to wrist or ankle, suspected pelvic fracture, and inability to follow commands.","why":"The 2021 guideline lists amputation proximal to the wrist or ankle and suspected pelvic fracture as red injury patterns, and inability to follow commands as a red mental status criterion. These patients go to the highest-level trauma center available.","wrong":["","A fall over 10 feet is a yellow (mechanism) criterion, not a red one.","","Anticoagulant use is an EMS judgment factor, not a red criterion.","HR 104 with SBP 126 meets no red criterion; for ages 10 to 64 the red findings are SBP under 90 or HR greater than SBP.",""],"src":"FTG"},{"id":"SC-029","d":"SCENE","topic":"Resources and incident command","concept":"call-resources-early","b":-1,"type":"mc","stem":"You and your partner are the only ambulance at a three-vehicle crash. During your size-up you count six patients: two screaming, one motionless behind a steering wheel, and three walking around. What should you do before beginning patient care?","opts":["Request more ambulances and notify dispatch of a multiple-patient incident","Begin care on the motionless driver, then call for help once he is stable","Transport the most critical patient now and request more units en route","Assess every patient first, then decide which resources to request from dispatch"],"ans":0,"key":"When patients outnumber your resources, request help during the size-up, before you get absorbed in patient care.","why":"Six patients overwhelm one crew. Calling early gets additional units moving while you triage; once you start hands-on care, the call is often delayed.","wrong":["","Once you start treating one patient, you may not be free to call, and the other five go unassessed.","Leaving takes the only crew away from five patients with no one managing the scene.","Assessing everyone first delays help that you already know you need from the patient count alone."],"src":"STD"},{"id":"SC-030","d":"SCENE","topic":"Resources and incident command","concept":"call-resources-early","b":-0.5,"type":"mc","stem":"You are called to a second-floor apartment for a 52-year-old man, about 450 lb, with fever and leg weakness. He is alert, BP 138/86, HR 104, RR 20, SpO2 95%. The stairway is narrow with a tight turn. Your crew is you and one partner. What is the best plan?","opts":["Have him walk down the stairs while each of you supports one arm","Carry him in a stair chair with just the two of you, taking frequent rests","Leave him at home and return when he feels strong enough to walk","Request a lift assist or more crew now, before attempting to move him"],"ans":3,"key":"Recognize a lift you cannot safely do and call for more hands or equipment early, before anyone is hurt.","why":"A 450-lb patient with leg weakness on narrow stairs is beyond what two people can move safely. He is stable, so waiting a few minutes for a lift assist protects him and the crew from falls and back injuries.","wrong":["His legs are weak; if he falls on the stairs, two people cannot hold him, and all three may fall.","Two people carrying 450 lb on tight stairs risks dropping him and serious crew injury.","He has a fever, tachycardia, and leg weakness and needs evaluation; leaving him is not appropriate.",""],"src":"STD"},{"id":"SC-031","d":"SCENE","topic":"Resources and incident command","concept":"ics-roles-staging","b":0,"type":"mc","stem":"A school bus crash has been declared a mass-casualty incident, and incident command is established. Dispatch sends your ambulance and says staging is in a church parking lot two blocks away. As you approach, you can see patients on the roadway. What should you do?","opts":["Drive to the bus, load the first critical patient you see, and transport","Park at the crash site and report to the nearest officer","Report to the staging area and wait for an assignment from the staging officer","Begin triaging the patients you can see from the road on your own"],"ans":2,"key":"At an established incident, units report to staging and wait for an assignment; freelancing undermines the incident plan.","why":"Staging keeps ambulances from crowding the scene and lets command send each unit where it is most needed. Patients will be routed to transport in priority order through the transport officer.","wrong":["Self-dispatching to the scene bypasses triage priorities and may send the wrong patient to the wrong hospital.","Parking at the crash site clogs access routes, and the nearest officer may not be the one assigning units.","","Triage is already being run by an assigned officer; freelancing duplicates work and creates confusion."],"src":"STD"},{"id":"SC-032","d":"SCENE","topic":"Resources and incident command","concept":"ics-roles-staging","b":0.5,"type":"mc","stem":"At an apartment fire with 14 patients, the incident commander assigns you as transport officer. Treatment areas are set up, and ambulances are arriving at staging. Which task is your primary responsibility?","opts":["Triaging patients as firefighters carry them out of the building","Matching ambulances from staging to hospitals and tracking each patient sent","Providing hands-on care to red-tagged patients in the treatment area","Directing fire crews to the floors where victims may remain"],"ans":1,"key":"The transport officer matches patients to ambulances and hospitals and tracks where every patient goes.","why":"The transport officer calls ambulances up from staging, confirms hospital capacity, assigns destinations, and keeps a record of each patient sent. This spreads patients across hospitals and keeps everyone accounted for.","wrong":["Triage belongs to the triage officer and teams; the transport officer should not be pulled into the sort.","","Hands-on care in the treatment area is the treatment officer's and treatment teams' job.","Directing fire suppression and search crews is a fire operations function, not an EMS transport role."],"src":"STD"},{"id":"SC-033","d":"SCENE","topic":"Resources and incident command","concept":"landing-zone-not-yours","b":0,"type":"mc","stem":"You are caring for a 23-year-old motorcyclist with a femur fracture and signs of shock on a rural highway. Air medical transport has been requested through command, which has assigned a landing zone officer. Your partner suggests he pick a nearby hayfield and wave the helicopter in himself. What is the best response?","opts":["Leave landing zone selection to the landing zone officer and stay with the patient","Agree, and have him mark the corners of the field with road flares","Choose the highway beside the ambulance instead, since it is flatter and closer to the patient","Have him guide the helicopter down by standing in the center of the field"],"ans":0,"key":"The landing zone is selected and controlled by the designated LZ officer; the EMT crew stays with the patient.","why":"Landing zone selection involves wires, slope, debris, and communication with the pilot, and command has already assigned someone to do it. Two landing zone efforts create confusion and danger, while the patient in shock needs both of you.","wrong":["","This sets up a competing landing zone, and loose flares can be blown around or start a fire in dry hay.","Picking a site yourself, even a flatter one, overrides the assigned landing zone officer and may not be secured.","Standing in the touchdown area puts him under a landing aircraft and takes a caregiver away from the patient."],"src":"STD"},{"id":"SC-034","d":"SCENE","topic":"Resources and incident command","concept":"landing-zone-not-yours","b":-1,"type":"mc","stem":"A medical helicopter has landed in a secured landing zone, and its rotors are still turning. You and your partner have the packaged patient on the stretcher 100 feet away. No one from the flight crew has looked toward you or signaled. What should you do?","opts":["Approach from the rear of the aircraft so you do not distract the pilot","Move the stretcher toward the aircraft quickly while keeping your heads low","Approach from the uphill side so you stay farther from the rotor","Wait with the patient until a flight crew member signals you to approach"],"ans":3,"key":"Never approach a helicopter until the flight crew signals you, and then only as they direct, in the pilot's view.","why":"The flight crew controls the aircraft and the area around it. Waiting for their signal keeps you away from rotors and lets them lead the approach from a safe direction.","wrong":["The tail rotor is nearly invisible when spinning, and the rear is the most dangerous place to approach.","Ducking does not replace permission; approaching unannounced can bring you into a rotor or a moving aircraft.","On a slope the main rotor is closer to the ground on the uphill side, so approaching from uphill is dangerous.",""],"src":"STD"},{"id":"SC-035","d":"SCENE","topic":"Triage","concept":"start-adult-categories","b":-0.5,"type":"order","stem":"You are the first EMT at a warehouse explosion with about 20 injured adults. You begin START triage. Place the START steps in the order you apply them.","opts":["Direct everyone who can walk to a designated area","Check for breathing, repositioning the airway if absent","Assess the respiratory rate","Assess perfusion with a radial pulse or capillary refill","Assess whether the patient can follow simple commands"],"key":"START sorts walkers first, then checks breathing, respiratory rate, perfusion, and mental status, in that order.","why":"Moving walking patients away first leaves the more injured for evaluation. Each remaining patient is then checked for respirations, rate, perfusion, and ability to follow commands, stopping as soon as an immediate finding is found.","src":"START"},{"id":"SC-036","d":"SCENE","topic":"Triage","concept":"triage-limited-interventions","b":0,"type":"mc","stem":"During START triage at a train derailment with dozens of patients, you find a 50-year-old man lying on his back. He is not breathing. You open his airway with a head-tilt chin-lift, and he still does not breathe. There is no major bleeding. What should you do?","opts":["Tag him immediate and begin CPR before moving on","Tag him expectant (deceased) and move to the next patient","Tag him immediate and give two rescue breaths before moving on","Tag him delayed so he is reassessed after the immediate patients"],"ans":1,"key":"In adult START, a patient who stays apneic after airway repositioning is tagged expectant; CPR is not started during triage.","why":"With many patients and few rescuers, triage aims to save the most lives. An adult who does not breathe after the airway is opened is tagged expectant so the rescuer can reach patients who can still be saved.","wrong":["Starting CPR ties up a rescuer for one patient with little chance of survival while others go unassessed.","","Rescue breaths for persistent apnea belong to JumpSTART for children, not adult START.","A delayed tag is for breathing, perfused patients who follow commands; apnea after repositioning is not delayed."],"src":"START"},{"id":"SC-037","d":"SCENE","topic":"Triage","concept":"start-adult-categories","b":0.5,"type":"mc","stem":"At a bus crash, you triage a 38-year-old woman who cannot walk. She is breathing 24 times per minute, her radial pulse is absent, and her skin is pale and cool. She answers questions and squeezes your hand when asked. Under START, what is her category?","opts":["Delayed, because her respiratory rate is under 30 and she follows commands","Minor, because she is alert and answering questions","Immediate, because her radial pulse is absent","Expectant, because shock this severe is unlikely to be survivable"],"ans":2,"key":"In START, an absent radial pulse (or capillary refill over 2 seconds) makes the patient immediate, whatever her mental status.","why":"START checks perfusion before mental status, and a missing radial pulse signals shock. She is tagged immediate as soon as that is found, and any severe bleeding is controlled before you move on.","wrong":["Following commands matters only if perfusion is adequate; the absent radial pulse makes her immediate first.","Patients who cannot walk are not minor, and being alert does not offset signs of shock.","","Expectant is for patients who stay apneic after repositioning; she is breathing and talking."],"src":"START"},{"id":"SC-038","d":"SCENE","topic":"Triage","concept":"start-adult-categories","b":1.5,"type":"table","stem":"After a bleacher collapse at a high school stadium, you are performing START triage on the injured adults. Classify each patient.","cols":["Minor (green)","Delayed (yellow)","Immediate (red)","Expectant (black)"],"rows":[["Walks to the collection area holding a small bleeding forearm cut",0],["Cannot walk; RR 20; radial pulse present; follows commands; open lower-leg fracture",1],["Cannot walk; RR 36; radial pulse present",2],["Cannot walk; RR 18; radial pulse present; does not follow simple commands",2],["Not breathing; still apneic after airway repositioning",3]],"key":"START: walkers are minor; RR over 30, poor perfusion, or not following commands is immediate; apnea after repositioning is expectant.","why":"Walking patients are sorted as minor first. Non-walking patients are immediate if RR is over 30, perfusion is poor, or they cannot follow simple commands; otherwise they are delayed, even with a serious-looking fracture.","src":"START"},{"id":"SC-039","d":"SCENE","topic":"Triage","concept":"jumpstart-pediatric","b":1.5,"type":"mc","stem":"You are using JumpSTART after a daycare van crash. A 5-year-old boy is lying still and is not breathing. You position his airway, and he still does not breathe, but he has a palpable peripheral pulse. What should you do?","opts":["Give 5 rescue breaths; tag him immediate if he starts breathing, expectant if he does not","Tag him expectant and move on, as you would an adult who stays apneic","Begin CPR and call for another rescuer to take over triage","Tag him immediate without giving breaths, since he has a pulse, and move to the next child"],"ans":0,"key":"In JumpSTART, an apneic child with a pulse gets 5 rescue breaths; breathing resumes means immediate, still apneic means expectant.","why":"Children often stop breathing from a primary breathing problem while the heart is still beating, so a brief trial of ventilation can save them. JumpSTART adds this step for apneic children with a pulse before tagging them expectant.","wrong":["","Tagging him expectant without the rescue-breath trial skips the step JumpSTART adds for children.","He has a pulse, so CPR is not indicated, and stopping triage leaves other children unassessed.","A pulse does not make him immediate; JumpSTART requires the breath trial, which decides immediate versus expectant."],"src":"START"},{"id":"SC-040","d":"SCENE","topic":"Triage","concept":"jumpstart-pediatric","b":1,"type":"mc","stem":"At an elementary school bus crash, you are using JumpSTART. A 4-year-old girl cannot walk. She is drowsy and moaning, breathing shallowly at 12 breaths per minute, with a palpable radial pulse. What is her category?","opts":["Delayed, because her respiratory rate is under the limit of 30","Minor, because she is moaning and has a palpable pulse","Delayed, because she has a palpable peripheral pulse and responds","Immediate, because a respiratory rate under 15 is a JumpSTART red finding"],"ans":3,"key":"In JumpSTART, a child's respiratory rate under 15 or over 45 makes the child immediate.","why":"JumpSTART uses child-specific respiratory limits of 15 to 45 breaths per minute. A rate of 12 is too slow for a 4-year-old and signals respiratory failure, so she is immediate.","wrong":["The cutoff of 30 is the adult START rule; JumpSTART uses under 15 or over 45 for children.","A child who cannot walk is not minor, and moaning with a slow respiratory rate is a warning sign.","A palpable pulse and some response do not offset a respiratory rate below the JumpSTART limit of 15.",""],"src":"START"},{"id":"SC-041","d":"SCENE","topic":"Triage","concept":"retriage","b":0.5,"type":"mc","stem":"Thirty minutes into a highway pileup MCI, you are reassessing a 44-year-old man in the treatment area. He was tagged delayed for a closed femur fracture. His RR is now 34, he is pale and anxious, and he still follows commands. The next ambulance is 15 minutes out. What should you do?","opts":["Keep his delayed tag, since categories are fixed at the initial sort","Re-triage him to immediate and tell the treatment officer","Leave his tag as is and add a note for the receiving hospital","Move him to the expectant area, since his condition is worsening"],"ans":1,"key":"Triage is ongoing: re-triage a patient whose condition changes and tell the officer in charge so priorities update.","why":"A respiratory rate over 30 now meets immediate criteria. Changing his tag and notifying the treatment officer moves him up for care and transport.","wrong":["Triage categories are not fixed; patients are reassessed and re-tagged as their condition changes.","","A note does not change his priority, so he would still wait behind patients who are now more stable than he is.","Expectant is for patients unlikely to survive with available resources; he is breathing, perfused, and following commands."],"src":"START"},{"id":"SC-042","d":"SCENE","topic":"Triage","concept":"retriage","b":0,"type":"mc","stem":"At a restaurant fire with many patients, a 60-year-old man walked to the minor (green) area with soot on his face and clothes. Twenty minutes later he is coughing hard, his voice is hoarse, and he can no longer speak in full sentences. What should you do?","opts":["Leave him in the green area, since he was able to walk at initial triage","Have him breathe slowly into a paper bag until transport is available","Re-triage him and move him for care based on his current condition","Have him wait until all red- and yellow-tagged patients have been transported"],"ans":2,"key":"A walking patient can deteriorate; reassess minor-area patients and re-triage anyone who worsens.","why":"Soot on the face plus a hoarse voice and worsening breathing after a fire suggest airway burns or smoke inhalation, which can quickly obstruct the airway. His earlier green tag no longer reflects his condition, so he is re-triaged and moved up.","wrong":["Ambulation at the first sort does not guarantee he stays stable; new airway signs require re-triage.","Paper-bag breathing is not appropriate and can worsen hypoxia in smoke inhalation.","","Holding him to the end ignores signs of a possible airway emergency that may now make him a priority."],"src":"START"},{"id":"SC-043","d":"SCENE","topic":"Triage","concept":"triage-limited-interventions","b":0.5,"type":"mr","stem":"You are triaging 25 patients after a stage collapse at an outdoor concert. Additional EMS crews are 10 minutes away. Which interventions are appropriate to perform during START triage before moving to the next patient? Select TWO.","opts":["Open the airway of a non-breathing patient by repositioning the head","Splint an angulated forearm fracture before moving to the next patient","Begin CPR on a patient who has no pulse and is not breathing","Apply a tourniquet to spurting bleeding from the thigh","Obtain a full set of vital signs, including blood pressure"],"ans":[0,3],"key":"During START, limit care to quick lifesaving steps such as opening the airway and controlling severe bleeding, then move on.","why":"Triage aims to sort every patient quickly so resources go where they save the most lives. Repositioning an airway and stopping major bleeding take seconds and can be lifesaving; everything else waits for treatment teams.","wrong":["","Splinting takes minutes and is not lifesaving; it belongs in the treatment area.","CPR ties up the person triaging with one pulseless patient who has a poor chance of survival in an MCI.","","START does not use blood pressure; full vitals slow triage and delay sorting of the remaining patients."],"src":"START"},{"id":"PA1-001","d":"PRIMARY","topic":"General impression","concept":"sick-not-sick","b":-1,"type":"mc","stem":"You are called to an apartment for a 58-year-old woman with difficulty breathing. From the doorway you see her sitting upright, leaning forward with her hands on her knees, pale and sweaty, speaking only two words at a time. What is the most appropriate conclusion from your general impression?","opts":["She appears unstable; begin the primary assessment now and plan for priority transport.","She appears stable enough to start with a focused history before assessing her airway and breathing.","Her condition cannot be judged until a complete set of baseline vital signs has been obtained.","She is most likely anxious; coach her breathing first and reassess her appearance in five minutes."],"ans":0,"key":"The general impression sorts sick from not sick in seconds; obvious distress means act on the primary assessment at once.","why":"Tripod positioning, pale diaphoretic skin and two-word dyspnea are signs of serious respiratory compromise visible from the doorway. The general impression should set a high-priority mindset so airway, breathing and circulation problems are found and treated without delay.","wrong":["","Tripod positioning, diaphoresis and two-word dyspnea signal a possible life threat; history never comes before the primary assessment.","The general impression is formed in seconds from what you see and hear; waiting for vital signs delays recognizing the threat.","Assuming anxiety in a pale, sweaty patient with severe dyspnea risks missing respiratory failure or a cardiac cause."],"src":"STD"},{"id":"PA1-002","d":"PRIMARY","topic":"General impression","concept":"primary-assessment-approach","b":-1.5,"type":"order","stem":"You form a general impression of a responsive 64-year-old man who complains of shortness of breath. There is no trauma and no external bleeding. Place the remaining steps of the primary assessment in the correct order.","opts":["Assess level of responsiveness using AVPU","Assess airway patency","Assess breathing rate, depth and effort","Assess circulation: pulse and skin color, temperature and condition","Make a transport priority decision"],"key":"For a responsive medical patient the primary assessment runs mental status, airway, breathing, circulation, then a priority decision.","why":"Mental status tells you how well the patient can protect the airway, and each later step depends on the one before it: air must get in before breathing matters, and breathing before circulation. The priority decision comes last because it rests on everything found in the primary assessment.","src":"STD"},{"id":"PA1-003","d":"PRIMARY","topic":"General impression","concept":"sick-not-sick","b":-0.5,"type":"table","stem":"During your general impression, classify each patient by what you can see and hear as you approach.","cols":["Immediate life threat apparent","No immediate life threat apparent"],"rows":[["Adult slumped in a chair with gurgling respirations",0],["Toddler limp in a parent's arms, not looking at anyone",0],["Adult sitting calmly, speaking full sentences, pink skin, holding a sprained wrist",1],["Older adult with gray skin who moans but does not open her eyes",0],["Teenager walking around the scene, talking, with a small cut on one finger",1]],"key":"Gurgling, limpness, gray skin and decreased responsiveness are visible from a distance and mark a sick patient.","why":"The general impression relies on appearance, airway sounds, work of breathing and skin color. Patients who are alert, talking normally and well colored have no obvious immediate threat, though they still receive a full primary assessment.","src":"STD"},{"id":"PA1-004","d":"PRIMARY","topic":"General impression","concept":"primary-assessment-approach","b":-0.5,"type":"mc","stem":"A 24-year-old man walks over to you after a car crash, talking clearly and saying he feels fine. He was the unrestrained driver, and the steering wheel is bent. What is the best next action?","opts":["Let him sit on the curb, since being able to walk and talk shows he has no serious injury.","Complete a primary assessment; a reassuring first look does not rule out a hidden life threat.","Skip the primary assessment and move directly to a detailed head-to-toe examination.","Obtain his medical history and medication list first, then assess his breathing and circulation."],"ans":1,"key":"Looking well is not the same as being well; every patient receives a primary assessment regardless of the general impression.","why":"The general impression guides urgency but is only a first look. Significant mechanism with a calm, ambulatory patient is a classic setup for a missed chest or abdominal injury, so the primary assessment is still completed.","wrong":["Walking and talking do not exclude serious injury; a bent steering wheel suggests significant force to the chest.","","A detailed exam never replaces the primary assessment, which must come first to find threats to airway, breathing and circulation.","History is gathered after life threats have been looked for and managed in the primary assessment."],"src":"STD"},{"id":"PA1-005","d":"PRIMARY","topic":"General impression","concept":"sick-not-sick","b":0,"type":"mc","stem":"You enter a bedroom where a 78-year-old woman lies in bed. Her skin is mottled, her eyes are closed, and she moans when you speak loudly but says no words. Her daughter says she was 'just tired' yesterday. Based on your general impression, how should you proceed?","opts":["Obtain a detailed history from the daughter before you begin examining the patient.","Assume she is sleeping deeply and let her rest while you obtain baseline vital signs.","Treat her as high priority and immediately assess airway, breathing and circulation.","Classify her as stable because she still responds when you speak to her."],"ans":2,"key":"Altered mental status with abnormal skin signs on first look makes a patient high priority until proven otherwise.","why":"Mottled skin and a patient who only moans to loud voice are red flags visible before any equipment is used. The correct response is to move immediately into the primary assessment and look for problems with airway, breathing and circulation.","wrong":["History can wait; mottled skin and decreased responsiveness suggest hypoxia or poor perfusion that must be addressed first.","A patient who only moans to a loud voice is not simply asleep; this is an altered mental status needing immediate assessment.","","Moaning to a loud voice is a decreased level of responsiveness, and mottling suggests poor perfusion; she is not stable."],"src":"STD"},{"id":"PA1-006","d":"PRIMARY","topic":"Level of consciousness","concept":"avpu-classification","b":-1,"type":"mc","stem":"A 45-year-old man lies on a sidewalk with his eyes closed. He does not respond when you call his name loudly. When you pinch his trapezius muscle, he grimaces and moans. How should you classify his responsiveness on the AVPU scale?","opts":["V: responds to verbal stimulus","U: unresponsive to any stimulus","A: alert and awake","P: responds to painful stimulus"],"ans":3,"key":"AVPU is scored by the least stimulus that produces a response; response only to pain is P.","why":"He showed no response to voice but reacted to a painful stimulus, which is the definition of P on the AVPU scale. Tracking AVPU over time helps you recognize improvement or deterioration.","wrong":["He did not respond to your voice; the moaning occurred only after a painful stimulus.","Grimacing and moaning to pain is a response, so he is not unresponsive.","An alert patient has eyes open and interacts without any stimulus.",""],"src":"STD"},{"id":"PA1-007","d":"PRIMARY","topic":"Level of consciousness","concept":"avpu-classification","b":0,"type":"mc","stem":"A 70-year-old woman is sitting up with her eyes open, watching you as you enter. She answers your questions, but she believes it is 1998 and cannot say where she is. What is the most accurate description of her mental status?","opts":["Verbal on AVPU, because her answers are confused","Alert and oriented, because she answers questions","Alert on AVPU, and disoriented to time and place","Painful on AVPU, because she cannot follow the conversation"],"ans":2,"key":"AVPU 'A' means awake and spontaneously interacting; orientation is assessed and documented separately.","why":"AVPU describes the stimulus needed to get a response, and she needs none. Her confusion about time and place is documented as disorientation, which is an important finding even in an alert patient.","wrong":["V describes a patient who responds only when spoken to; she is awake and interacting on her own.","Answering questions is not the same as being oriented; she is wrong about the year and her location.","","She responds without any stimulus; P is reserved for patients who respond only to pain."],"src":"STD"},{"id":"PA1-008","d":"PRIMARY","topic":"Level of consciousness","concept":"gcs-calculation","b":0.5,"type":"mc","stem":"A 32-year-old man struck his head in a fall. His eyes open only when you press on his fingernail, he makes moaning sounds with no recognizable words, and he pulls his hand away from the pressure. What is his Glasgow Coma Scale score?","opts":["8","7","9","10"],"ans":0,"key":"GCS adds eye (1-4), verbal (1-5) and motor (1-6); opening to pain, moaning and withdrawal total 8.","why":"Eyes open to pressure score 2, incomprehensible sounds score 2, and withdrawal from pressure scores 4, for a total of 8. A GCS of 8 or less means the patient may not be able to protect the airway.","wrong":["","This undercounts motor: pulling away from pressure is withdrawal (4), not abnormal flexion (3).","Moaning without words is incomprehensible sounds (2), not inappropriate words (3).","Eyes opening only to pressure score 2, and moaning scores 2; 10 overscores the eye and verbal responses."],"src":"STD"},{"id":"PA1-009","d":"PRIMARY","topic":"Level of consciousness","concept":"gcs-calculation","b":1,"type":"mc","stem":"A 19-year-old woman is found after a bicycle crash. Her eyes open when you speak to her. She answers in full sentences but is confused about what happened and what day it is. She squeezes and releases your hand when asked. What is her Glasgow Coma Scale sco
