<title>Registry Ready</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column, phone-first; a chevron-striped header band like rig livery, sticky bottom nav. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#11212B; --muted:#56666E; --line:#D3DBDC;
  --accent:#D9480F; --accent-ink:#FFFFFF; --navy:#16324A; --navy-ink:#F2F6F7;
  --good:#1D7A3F; --good-bg:#E3F3E8; --bad:#B42318; --bad-bg:#FBE7E5; --warn:#9A5B00; --warn-bg:#FBF0DC;
  --chev-a:#D9480F; --chev-b:#F4C430;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E171C; --surface:#152229; --ink:#E5EDEF; --muted:#93A4AB; --line:#26363F;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --navy:#0A1A26; --navy-ink:#E5EDEF;
  --good:#5CCB84; --good-bg:#14301F; --bad:#FF7B6E; --bad-bg:#3A1A17; --warn:#F2B54A; --warn-bg:#352A12;
  --chev-a:#E2551B; --chev-b:#D9AE2B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E171C; --surface:#152229; --ink:#E5EDEF; --muted:#93A4AB; --line:#26363F;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --navy:#0A1A26; --navy-ink:#E5EDEF;
  --good:#5CCB84; --good-bg:#14301F; --bad:#FF7B6E; --bad-bg:#3A1A17; --warn:#F2B54A; --warn-bg:#352A12;
  --chev-a:#E2551B; --chev-b:#D9AE2B; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--navy);color:var(--navy-ink)}
header.top .wrap{padding-block:18px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:2rem;letter-spacing:.04em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:.8rem;letter-spacing:.02em;text-transform:none;opacity:.8;margin-top:6px}
.chev{height:14px;background:repeating-linear-gradient(-45deg,var(--chev-a) 0 14px,var(--chev-b) 14px 28px)}
.sync{font-family:var(--f-mono);font-size:.72rem;opacity:.8}
main .wrap{padding-block:18px 24px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
h1{font-size:1.9rem;line-height:1.05}
h2{font-size:1.4rem;line-height:1.1}
h3{font-size:1.1rem;text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
.muted{color:var(--muted)}
.label{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.82rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:10px 16px;border-radius:4px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 10px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.seg button:focus-visible,nav.tabs button:focus-visible,.chk input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--f-mono);font-weight:700;font-size:2.2rem;line-height:1}
.pill{display:inline-block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;padding:3px 8px;border-radius:3px}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border-left:4px solid var(--line);padding-left:10px;min-width:0}
.stat.hot{border-left-color:var(--accent)}
/* domain bars */
.dom{display:grid;gap:4px}
.dom .head{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.bar{position:relative;height:12px;background:var(--bg);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--navy)}
:root[data-theme="dark"] .bar i{background:#5A87A8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar i{background:#5A87A8}}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent)}
/* question */
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stem{font-size:1.12rem;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:5px;padding:12px;cursor:pointer;min-height:48px}
.opt .k{font-family:var(--f-mono);font-weight:700;min-width:1.4em;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--bg)}
:root[data-theme="dark"] .opt[aria-pressed="true"]{border-color:#7FA9C7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt[aria-pressed="true"]{border-color:#7FA9C7}}
.opt.is-right{border-color:var(--good);background:var(--good-bg)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.olist{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.olist li{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:5px;padding:8px 10px;background:var(--surface)}
.olist li span.t{flex:1;min-width:0}
.olist li.is-right{border-color:var(--good)} .olist li.is-wrong{border-color:var(--bad)}
.trow{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.9rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:6px 10px;cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--navy-ink)}
.seg button.is-right{border-color:var(--good);outline:2px solid var(--good)}
.feedback{border-left:5px solid var(--good);background:var(--good-bg);padding:12px;border-radius:0 4px 4px 0;display:grid;gap:6px}
.feedback.wrong{border-left-color:var(--bad);background:var(--bad-bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
/* skills */
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--good);flex:none}
.crit{border:2px solid var(--bad);border-radius:5px;padding:12px;display:grid;gap:6px}
.crit ul{margin:0;padding-left:20px}
.timer{font-family:var(--f-mono);font-weight:700;font-size:2rem}
.list{display:grid;gap:0}
.list > *{padding:10px 0;border-bottom:1px solid var(--line)}
.confirm{border:2px solid var(--bad);padding:12px;border-radius:5px;display:grid;gap:10px}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px}
nav.tabs button{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.88rem;background:none;border:0;color:var(--muted);padding:10px 2px;border-top:3px solid transparent;cursor:pointer;min-height:48px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
.foot{font-size:.82rem;color:var(--muted);display:grid;gap:6px}
@media (max-width:420px){.big{font-size:1.6rem}h1{font-size:1.6rem}.stat{padding-left:8px}}
@media (prefers-reduced-motion:no-preference){.opt,.seg button,.chip{transition:border-color .12s,background .12s}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">Registry Ready<small>Practice for the NREMT EMT cognitive exam and skills</small></div>
    <div class="sync" id="sync">Saved on this device</div>
  </div>
  <div class="chev" aria-hidden="true"></div>
</header>
<main><div class="wrap" id="view"></div></main>
<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button data-tab="today">Today</button><button data-tab="exam">Exam</button><button data-tab="drill">Drill</button><button data-tab="skills">Skills</button><button data-tab="progress">Progress</button>
</div></nav>

<script>
/* Registry Ready — original item bank.
   All items are original. None are taken from the NREMT item pool.
   Domains and weights follow the NREMT EMT Examination Specifications (2023 BLS
   Practice Analysis; administered from April 2025). Clinical content follows the
   2025 AHA Guidelines for CPR and ECC where resuscitation is involved.
   b = practice difficulty on this app's internal scale (-2 easy ... +2 hard). */

const DOMAINS = {
  SCENE:     { name: "Scene Size-up and Safety",       lo: 15, hi: 19 },
  PRIMARY:   { name: "Primary Assessment",             lo: 39, hi: 43 },
  SECONDARY: { name: "Secondary Assessment",           lo: 5,  hi: 9  },
  TREAT:     { name: "Patient Treatment and Transport", lo: 20, hi: 24 },
  OPS:       { name: "Operations",                     lo: 10, hi: 14 }
};

const SRC = {
  NR: "NREMT EMT Examination Specifications (2025)",
  AHA: "AHA 2025 Guidelines for CPR and ECC",
  STD: "National EMS Education Standards, EMT level",
  START: "START / JumpSTART mass-casualty triage",
  ERG: "Emergency Response Guidebook (PHMSA)"
};

const BANK = [];
function M(id, d, topic, b, stem, opts, ans, why, src) { BANK.push({ id, d, topic, b, type: "mc", stem, opts, ans, why, src: src || "STD" }); }
function R(id, d, topic, b, stem, opts, ans, why, src) { BANK.push({ id, d, topic, b, type: "mr", stem, opts, ans, why, src: src || "STD" }); }
function O(id, d, topic, b, stem, steps, why, src) { BANK.push({ id, d, topic, b, type: "order", stem, opts: steps, why, src: src || "STD" }); }
function T(id, d, topic, b, stem, cols, rows, why, src) { BANK.push({ id, d, topic, b, type: "table", stem, cols, rows, why, src: src || "STD" }); }

/* ---------------- SCENE SIZE-UP AND SAFETY ---------------- */
M("S01","SCENE","Scene safety",-1.0,
 "You are dispatched to a residence for a man with a gunshot wound. Dispatch reports the shooter may still be inside. What do you do?",
 ["Enter quickly with your partner and remove the patient","Stage at a safe distance until law enforcement reports the scene secure","Call the patient's phone and ask him to walk outside","Approach the door and announce yourself as EMS"],1,
 "Your own safety comes first. An unsecured violent scene is entered only after law enforcement makes it safe.");
M("S02","SCENE","Hazardous materials",-0.5,
 "An overturned tanker truck displays a placard with a four-digit number. Which reference identifies the material and the initial isolation distance?",
 ["The truck driver's logbook","The Emergency Response Guidebook","Poison control by phone after patient contact","The bill of lading inside the cab, retrieved by you"],1,
 "The ERG converts the placard number to the material and gives initial isolation and protective-action distances.","ERG");
M("S03","SCENE","Hazardous materials",-1.0,
 "Where should you position the ambulance at a suspected hazardous-materials spill?",
 ["Downhill and downwind, close enough to see the placard","Uphill and upwind, at a safe distance","Directly beside the vehicle to shorten patient carry","Downhill and upwind"],1,
 "Gases and liquids travel with wind and gravity. Uphill and upwind keeps the crew out of the plume and runoff.","ERG");
M("S04","SCENE","Triage",-1.5,
 "Using START triage, a patient who can walk to the designated area on command is tagged:",
 ["Immediate (red)","Delayed (yellow)","Minor (green)","Expectant (black)"],2,
 "Anyone able to walk is sorted to minor (green) first and re-triaged later.","START");
M("S05","SCENE","Triage",-0.5,
 "In START triage, an adult is not breathing. You reposition the airway and the patient still does not breathe. Category?",
 ["Immediate (red)","Delayed (yellow)","Minor (green)","Expectant/deceased (black)"],3,
 "An adult who stays apneic after one airway repositioning is tagged expectant/deceased in START.","START");
M("S06","SCENE","Triage",0.0,
 "In START triage, an adult who cannot walk is breathing 36 times per minute. Category?",
 ["Immediate (red)","Delayed (yellow)","Minor (green)","Re-check after all others are tagged"],0,
 "A respiratory rate over 30 is an immediate (red) finding in START.","START");
M("S07","SCENE","Triage",0.5,
 "In START triage, a non-ambulatory adult breathes 22 times per minute and has a radial pulse but cannot follow simple commands. Category?",
 ["Delayed (yellow)","Immediate (red)","Minor (green)","Expectant (black)"],1,
 "Failure to follow simple commands is an immediate (red) criterion even when breathing and perfusion pass.","START");
T("S08","SCENE","Triage",0.5,
 "Classify each adult patient using START.",
 ["Minor","Delayed","Immediate","Expectant"],
 [["Walking, holding a deformed forearm",0],["Cannot walk; RR 24, radial pulse present, follows commands",1],["Cannot walk; RR 34",2],["Apneic after airway repositioning",3]],
 "Walk = minor. RR over 30, no radial pulse (or capillary refill over 2 s), or not following commands = immediate. Apneic after repositioning = expectant.","START");
M("S09","SCENE","Triage",1.0,
 "Using JumpSTART, a 5-year-old is apneic with a palpable peripheral pulse after you reposition the airway. Next step?",
 ["Tag expectant and move on","Give 5 rescue breaths, then reassess breathing","Begin chest compressions","Tag immediate without further action"],1,
 "JumpSTART adds 5 rescue breaths for an apneic child with a pulse. If breathing resumes, tag immediate; if not, expectant.","START");
R("S10","SCENE","PPE",0.5,
 "A patient has a productive cough, fever, night sweats and weight loss. Tuberculosis is suspected. Select the TWO most appropriate precautions.",
 ["Fit-tested N95 (or higher) respirator for the EMT","Surgical mask on the patient if tolerated","Gown as the only added protection","Surgical mask alone for the EMT","No added precautions unless the patient is coughing blood"],[0,1],
 "TB is airborne. Responders wear an N95 or higher; a surgical mask on the patient reduces droplet spread.");
M("S11","SCENE","Scene safety",0.0,
 "You arrive at a closed garage where a car engine is running. Two family members report headache and dizziness and say someone is down inside. Best action?",
 ["Hold your breath, enter and drag the patient out","Keep everyone out, request fire department with SCBA, and treat the symptomatic family outside","Open the door and enter after 2 minutes of ventilation","Enter with a surgical mask and gloves"],1,
 "Suspected carbon monoxide is an atmospheric hazard. Rescue from it requires SCBA, which is not EMT equipment.");
M("S12","SCENE","Mechanism of injury",-0.5,
 "An unrestrained driver struck a pole head-on. The steering wheel is bent. Which injury pattern should you suspect first?",
 ["Isolated ankle fractures","Chest and upper-abdominal injury","Hand burns from the airbag","Lower back strain only"],1,
 "A deformed steering wheel means the chest struck it with force. Suspect rib fractures, pulmonary contusion, cardiac and upper-abdominal injury.");
M("S13","SCENE","Resources",-0.5,
 "You and your partner arrive at a single-vehicle crash and find three injured occupants. When should you request more units?",
 ["After the first patient is packaged","After completing primary assessments on all three","During scene size-up, before committing to patient care","Only if a patient becomes unstable"],2,
 "Resource needs are identified during size-up. Patients outnumbering crew is the trigger to call early.");
R("S14","SCENE","Scene safety",0.0,
 "At a vehicle crash, which THREE findings must be addressed or mitigated before you make patient contact?",
 ["Fuel pooling under the engine near a hot exhaust","Power line lying across the hood","Vehicle resting on its side and rocking","Patient screaming that his leg hurts","A bystander recording video","Police already blocking traffic"],[0,1,2],
 "Fire, electrical and vehicle-stability hazards can injure the crew. A screaming patient is breathing and perfused; the other items are not hazards.");
M("S15","SCENE","Scene safety",-0.5,
 "A power line lies across a car. The driver is awake and asks if he should get out. You should:",
 ["Tell him to step out carefully without touching the ground","Tell him to stay inside, not touch metal, and wait while the utility company is called","Remove the line with a dry wooden backboard","Approach and open the door to assess him"],1,
 "Stepping out can complete a circuit to ground. Lines stay energized until the utility confirms otherwise.");
M("S16","SCENE","Scene safety",0.0,
 "While treating a patient at a large gathering, the crowd becomes hostile and starts pushing toward you. Best action?",
 ["Continue full assessment on scene","Move the patient into the ambulance and leave the area, completing care en route or at a safe location","Ask the crowd to step back and continue","Leave the patient and retreat"],1,
 "When the scene turns unsafe, remove yourself and, if possible, the patient. Care continues once safe.");
M("S17","SCENE","PPE",-1.0,
 "Your patient is actively vomiting. In addition to gloves, which protection is indicated?",
 ["None; gloves are sufficient","Eye protection and a mask","Gown only","Shoe covers"],1,
 "Splash or spray risk calls for eye and face protection on top of gloves.");

/* ---------------- PRIMARY ASSESSMENT ---------------- */
M("P01","PRIMARY","Level of consciousness",-1.5,
 "An adult patient opens his eyes and moans only when you pinch his trapezius. On AVPU he is:",
 ["A","V","P","U"],2,"He responds only to a painful stimulus: P.");
M("P02","PRIMARY","Level of consciousness",0.5,
 "A patient opens her eyes when spoken to, is confused about the date, and moves your hand away from a painful stimulus. Her GCS is:",
 ["10","11","12","13"],2,"Eyes to voice 3 + confused 4 + localizes pain 5 = 12.");
M("P03","PRIMARY","Airway",-1.0,
 "An unresponsive medical patient with no suspected trauma has snoring respirations. First action?",
 ["Insert a nasopharyngeal airway","Head-tilt, chin-lift","Apply a non-rebreather","Begin chest compressions"],1,
 "Snoring means the tongue is partially obstructing the airway. Open it manually first.");
M("P04","PRIMARY","Airway",-1.0,
 "An unresponsive patient fell from a ladder. Which maneuver opens the airway?",
 ["Head-tilt, chin-lift","Jaw thrust","Hyperextend the neck","Recovery position"],1,
 "With possible spinal injury, the jaw thrust opens the airway with minimal neck movement.");
M("P05","PRIMARY","Airway",-0.5,
 "How do you size an oropharyngeal airway?",
 ["Tip of the nose to the earlobe","Corner of the mouth to the earlobe or angle of the jaw","Center of the lips to the chin","Length of the patient's little finger"],1,
 "OPA: corner of mouth to earlobe or angle of jaw. Tip of nose to earlobe is the NPA measurement.");
M("P06","PRIMARY","Airway",0.0,
 "Which finding is a reason to avoid a nasopharyngeal airway?",
 ["Intact gag reflex","Clenched teeth","Clear fluid draining from the nose after head trauma","Snoring respirations"],2,
 "Clear nasal drainage after head trauma suggests a basilar skull fracture. An NPA is avoided in that setting.");
M("P07","PRIMARY","Airway",-1.0,
 "You hear gurgling when your unresponsive patient breathes. Next action?",
 ["Insert an OPA","Suction the airway","Apply high-flow oxygen","Count the respiratory rate"],1,
 "Gurgling means fluid in the upper airway. Clear it before anything else.");
M("P08","PRIMARY","Airway",-0.5,
 "What is the maximum duration of a single suction attempt in an adult?",
 ["5 seconds","10 seconds","15 seconds","30 seconds"],2,
 "Suction removes oxygen along with secretions. Adults: no more than 15 seconds per attempt.");
M("P09","PRIMARY","Breathing",0.0,
 "An adult has a strong carotid pulse but is not breathing. How often do you ventilate?",
 ["1 breath every 2 to 3 seconds","1 breath every 6 seconds","2 breaths every 30 seconds","1 breath every 10 seconds"],1,
 "Adult rescue breathing with a pulse: 1 breath every 6 seconds (10 per minute).","AHA");
M("P10","PRIMARY","Breathing",0.5,
 "A child with a pulse of 110 has respiratory arrest. How often do you ventilate?",
 ["1 breath every 6 seconds","1 breath every 2 to 3 seconds","1 breath every second","2 breaths after every 15 seconds"],1,
 "Infants and children with a pulse: 1 breath every 2 to 3 seconds (20 to 30 per minute).","AHA");
M("P11","PRIMARY","Breathing",0.0,
 "When ventilating with a BVM, each breath should be:",
 ["Delivered as fast as possible","Given over about 1 second with just enough volume for visible chest rise","Given until the bag is fully empty","Held for 3 seconds"],1,
 "Over-ventilation raises intrathoracic pressure and causes gastric inflation. Give each breath over about 1 second with visible chest rise.","AHA");
M("P12","PRIMARY","Breathing",0.0,
 "A confused adult breathes 8 times per minute with shallow chest rise and cyanotic lips. Best intervention?",
 ["Non-rebreather at 15 L/min","Nasal cannula at 4 L/min","Assist ventilations with a BVM and supplemental oxygen","Recovery position and observe"],2,
 "A slow, shallow rate with cyanosis is inadequate breathing. A mask cannot move air for the patient; a BVM can.");
M("P13","PRIMARY","Circulation",-1.0,
 "How long should a pulse check take in an unresponsive adult?",
 ["No more than 10 seconds","15 to 20 seconds","30 seconds","As long as needed to be sure"],0,
 "Long pulse checks delay compressions. Check for no more than 10 seconds.","AHA");
M("P14","PRIMARY","CPR",-1.5,
 "Adult chest compression rate:",
 ["60 to 80 per minute","80 to 100 per minute","100 to 120 per minute","120 to 140 per minute"],2,"100 to 120 per minute.","AHA");
M("P15","PRIMARY","CPR",-0.5,
 "Adult chest compression depth:",
 ["About 1 inch","At least 2 inches but not more than 2.4 inches","At least 3 inches","One-half the chest depth"],1,
 "Adults: at least 2 in (5 cm), not more than 2.4 in (6 cm), with full recoil.","AHA");
M("P16","PRIMARY","CPR",0.0,
 "Two EMTs are performing CPR on an infant. Compression-to-ventilation ratio?",
 ["30:2","15:2","5:1","3:1"],1,"Two-rescuer infant and child CPR uses 15:2.","AHA");
M("P17","PRIMARY","CPR",0.5,
 "Under the 2025 AHA guidelines, which infant chest compression technique is no longer recommended?",
 ["Two-thumb encircling hands","Heel of one hand","Two-finger technique","All three remain recommended"],2,
 "The two-finger technique often fails to reach adequate depth. Use the heel of one hand or the two-thumb encircling technique.","AHA");
O("P18","PRIMARY","CPR",0.5,
 "Put the steps for an unresponsive adult in cardiac arrest in order once an AED is brought to you.",
 ["Confirm the scene is safe","Check responsiveness, breathing and pulse (10 seconds or less)","Begin high-quality chest compressions","Apply the AED pads","Clear the patient while the AED analyzes","Deliver a shock if advised","Resume compressions immediately"],
 "Compressions start as soon as arrest is recognized and continue until the pads are on. After a shock, compressions resume without a pulse check.","AHA");

/* Registry Ready — engine: grading, ability estimate, adaptive selection, spaced review, weak-domain analysis.
   Pure functions; no DOM. */

const ENGINE = (() => {
  const DKEYS = Object.keys(DOMAINS);
  const target = d => (DOMAINS[d].lo + DOMAINS[d].hi) / 2 / 100;
  const byId = Object.fromEntries(BANK.map(i => [i.id, i]));

  /* ---- grading: dichotomous, like the real exam ---- */
  function grade(item, resp) {
    if (resp == null) return false;
    if (item.type === "mc") return resp === item.ans;
    if (item.type === "mr") {
      const a = [...item.ans].sort().join(","), r = [...resp].sort().join(",");
      return a === r;
    }
    if (item.type === "order") return resp.every((v, i) => v === i) && resp.length === item.opts.length;
    if (item.type === "table") return item.rows.every((row, i) => resp[i] === row[1]);
    return false;
  }

  /* ---- Rasch ability estimate (EAP, N(0,1) prior) ---- */
  const GRID = []; for (let t = -4; t <= 4.0001; t += 0.05) GRID.push(t);
  function eap(responses) { // [{b, ok}]
    let w = GRID.map(t => Math.exp(-t * t / 2));
    for (const r of responses) {
      w = w.map((v, k) => { const p = 1 / (1 + Math.exp(-(GRID[k] - r.b))); return v * (r.ok ? p : 1 - p); });
      const s = w.reduce((a, c) => a + c, 0); w = w.map(v => v / s);
    }
    const s = w.reduce((a, c) => a + c, 0);
    const mean = GRID.reduce((a, t, k) => a + t * w[k], 0) / s;
    const v = GRID.reduce((a, t, k) => a + (t - mean) ** 2 * w[k], 0) / s;
    return { theta: mean, se: Math.sqrt(v) };
  }

  /* ---- adaptive practice exam ---- */
  const CAT = { min: 30, max: 60, cut: 0, z: 1.96 };
  function nextCatItem(session, rand = Math.random) {
    const used = new Set(session.items.map(x => x.id));
    const n = session.items.length;
    const counts = Object.fromEntries(DKEYS.map(d => [d, 0]));
    session.items.forEach(x => counts[byId[x.id].d]++);
    const order = DKEYS.map(d => ({ d, def: target(d) * (n + 1) - counts[d] })).sort((a, b) => b.def - a.def);
    const theta = session.theta ?? 0;
    for (const { d } of order) {
      const pool = BANK.filter(i => i.d === d && !used.has(i.id));
      if (!pool.length) continue;
      pool.sort((a, b) => Math.abs(a.b - theta) - Math.abs(b.b - theta));
      const top = pool.slice(0, Math.min(3, pool.length));
      return top[Math.floor(rand() * top.length)];
    }
    return null;
  }
  function catRecord(session, item, ok) {
    session.items.push({ id: item.id, ok });
    const est = eap(session.items.map(x => ({ b: byId[x.id].b, ok: x.ok })));
    session.theta = est.theta; session.se = est.se;
    return est;
  }
  function catShouldStop(session) {
    const n = session.items.length;
    if (n >= CAT.max) return "max";
    if (n >= CAT.min) {
      const lo = session.theta - CAT.z * session.se, hi = session.theta + CAT.z * session.se;
      if (lo > CAT.cut || hi < CAT.cut) return "confident";
    }
    if (!nextCatItem(session, () => 0)) return "bank";
    return null;
  }
  function catVerdict(session) {
    const lo = session.theta - CAT.z * session.se, hi = session.theta + CAT.z * session.se;
    if (lo > CAT.cut) return "above";
    if (hi < CAT.cut) return "below";
    return session.theta >= CAT.cut ? "near-above" : "near-below";
  }

  /* ---- spaced review (Leitner boxes) ---- */
  const DAY = 86400000;
  const INTERVAL = [0, 0, 1, 3, 7, 16, 35]; // days, index = box (1..6)
  function srsUpdate(srs, id, ok, now = Date.now()) {
    const c = srs[id] || { box: 0, due: now, seen: 0, right: 0 };
    c.seen++; if (ok) c.right++;
    c.box = ok ? Math.min(6, Math.max(1, c.box) + 1) : 1;
    c.due = now + (ok ? INTERVAL[c.box] * DAY : 10 * 60000); // missed: back in 10 minutes
    srs[id] = c;
    return c;
  }
  function dueItems(srs, now = Date.now()) {
    return Object.entries(srs).filter(([id, c]) => c.due <= now && byId[id]).sort((a, b) => a[1].due - b[1].due).map(([id]) => byId[id]);
  }

  /* ---- weak-domain analysis ---- */
  function domainStats(hist, window = 40) {
    const out = {};
    for (const d of DKEYS) {
      const rows = hist.filter(h => byId[h.id] && byId[h.id].d === d).slice(-window);
      const n = rows.length, right = rows.filter(r => r.ok).length;
      const acc = n ? right / n : null;
      const accForPriority = n >= 3 ? acc : 0.5;
      out[d] = { n, right, acc, weight: target(d), priority: target(d) * (1 - accForPriority), bank: BANK.filter(i => i.d === d).length };
    }
    return out;
  }
  function topicStats(hist) {
    const t = {};
    for (const h of hist) {
      const it = byId[h.id]; if (!it) continue;
      const k = it.d + "|" + it.topic;
      t[k] = t[k] || { d: it.d, topic: it.topic, n: 0, right: 0 };
      t[k].n++; if (h.ok) t[k].right++;
    }
    return Object.values(t).filter(x => x.n >= 2).map(x => ({ ...x, acc: x.right / x.n })).sort((a, b) => a.acc - b.acc);
  }
  function overallAbility(hist, last = 150) {
    const rows = hist.slice(-last).filter(h => byId[h.id]).map(h => ({ b: byId[h.id].b, ok: h.ok }));
    return rows.length ? { ...eap(rows), n: rows.length } : null;
  }

  /* ---- build a smart review queue: due first, then unseen items from the weakest domain ---- */
  function reviewQueue(state, size = 15, now = Date.now()) {
    const q = dueItems(state.srs, now).slice(0, size);
    if (q.length < size) {
      const ds = domainStats(state.hist);
      const ranked = DKEYS.slice().sort((a, b) => ds[b].priority - ds[a].priority);
      const seen = new Set(Object.keys(state.srs));
      const inQ = new Set(q.map(i => i.id));
      for (const d of ranked) {
        for (const it of BANK.filter(i => i.d === d && !seen.has(i.id) && !inQ.has(i.id)).sort((a, b) => a.b - b.b)) {
          if (q.length >= size) break;
          q.push(it); inQ.add(it.id);
        }
      }
      if (q.length < size) { // everything seen: earliest-due next
        const rest = Object.entries(state.srs).filter(([id]) => !inQ.has(id) && byId[id]).sort((a, b) => a[1].due - b[1].due);
        for (const [id] of rest) { if (q.length >= size) break; q.push(byId[id]); }
      }
    }
    return q;
  }

  return { DKEYS, target, byId, grade, eap, CAT, nextCatItem, catRecord, catShouldStop, catVerdict, srsUpdate, dueItems, domainStats, topicStats, overallAbility, reviewQueue };
})();

  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.setAttribute("style", v);
    else el.setAttribute(k, v === true ? "" : v);

}

    h("p", { class: "muted" }, "Rehearse each station step by step with a partner or out loud. These are practice prompts; your program grades on the official NREMT skill sheets, so compare against those."),
    h("div", { class: "opts" }, SKILLS.map(s => {
      const runs = S.skills.filter(r => r.id === s.id);
      const lastRun = runs[runs.length - 1];
      return h("button", { class: "opt", onclick: () => openSkill(s) }, h("span", { style: "flex:1" }, h("strong", null, s.name), h("br"),
        h("span", { class: "muted", style: "font-size:.88rem" }, lastRun ? `Last run ${fmtDate(lastRun.t)} · ${lastRun.missed} missed, ${lastRun.crit} critical` : `${s.steps.length} steps · not practiced yet`)));
    })),
    recent.length ? h("section", { class: "panel" }, h("h3", null, "Recent runs"), h("div", { class: "list" }, recent.map(r => h("div", { class: "row", style: "justify-content:space-between" },
      h("span", null, SKILLS.find(s => s.id === r.id)?.name || r.id), h("span", { class: "mono" }, `${fmtDate(r.t)} · ${r.missed} missed · ${fmtTime(r.sec)}`))))) : null
  ];
}
const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

function openSkill(s) {
  ctx = { mode: "skill" };
  const checks = s.steps.map(() => false), crits = s.critical.map(() => false);
  let start = null, timerId = null, sec = 0;
  const tEl = h("span", { class: "timer" }, "0:00");
  const tick = () => { sec = Math.floor((Date.now() - start) / 1000); tEl.textContent = fmtTime(sec); };
  const tBtn = h("button", { class: "btn", onclick: () => {
    if (timerId) { clearInterval(timerId); timerId = null; tBtn.textContent = "Resume timer"; }
    else { start = Date.now() - sec * 1000; timerId = setInterval(tick, 250); tBtn.textContent = "Pause timer"; }
  } }, "Start timer");
  const stepList = h("div", null, s.steps.map((st, i) => h("label", { class: "chk", for: `st-${s.id}-${i}` },
    h("input", { type: "checkbox", id: `st-${s.id}-${i}`, onchange: e => checks[i] = e.target.checked }), h("span", null, h("span", { class: "mono muted" }, `${i + 1}. `), st))));
  const critList = h("div", null, s.critical.map((c, i) => h("label", { class: "chk", for: `cr-${s.id}-${i}` },
    h("input", { type: "checkbox", id: `cr-${s.id}-${i}`, style: "accent-color:var(--bad)", onchange: e => crits[i] = e.target.checked }), h("span", null, c))));
  const finish = () => {
    if (timerId) clearInterval(timerId);
    const missed = checks.filter(x => !x).length, crit = crits.filter(x => x).length;
    S.skills.push({ id: s.id, t: Date.now(), missed, crit, sec, missedSteps: checks.map((c, i) => c ? null : i).filter(x => x != null) });
    save();
    ctx = null;
    $view.replaceChildren(h("h1", null, s.name), h("section", { class: "panel" },
      h("span", { class: "pill " + (crit ? "bad" : missed ? "warn" : "good") }, crit ? "Critical failure marked" : missed ? `${missed} step${missed > 1 ? "s" : ""} missed` : "All steps done"),
      missed ? h("ul", null, checks.map((c, i) => c ? null : h("li", null, s.steps[i]))) : null,
      h("p", { class: "mono" }, `Time ${fmtTime(sec)}`),
      h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => openSkill(s) }, "Run again"), h("button", { class: "btn", onclick: () => go("skills") }, "All skills"))));
    window.scrollTo(0, 0);
  };
  $view.replaceChildren(
    h("div", { class: "row", style: "justify-content:space-between" }, h("button", { class: "btn small", onclick: () => { if (timerId) clearInterval(timerId); ctx = null; go("skills"); } }, "← Skills"), h("span", { class: "label" }, "Practice checklist")),
    h("h1", null, s.name),
    h("section", { class: "panel" }, h("div", { class: "row", style: "justify-content:space-between" }, tEl, tBtn),
      h("p", { class: "muted", style: "font-size:.88rem" }, "Talk through each step as you do it. A partner ticks the box when the step is done or clearly verbalized.")),
    h("section", { class: "panel" }, h("h3", null, "Steps"), stepList),
    h("section", { class: "crit" }, h("h3", { style: "color:var(--bad)" }, "Critical failures"), h("p", { class: "muted", style: "font-size:.88rem" }, "Tick any that happened. One is enough to fail a station."), critList),
    h("div", { class: "row" }, h("button", { class: "btn primary", onclick: finish }, "Finish and log run")));
  window.scrollTo(0, 0);
}

function viewProgress() {
  const ds = E.domainStats(S.hist);
  const ranked = E.DKEYS.slice().sort((a, b) => ds[b].priority - ds[a].priority);
  const topics = E.topicStats(S.hist).slice(0, 6);
  const confirmBox = h("div", { class: "confirm", hidden: true },
    h("p", null, "Erase all answers, review schedule, exam history and skill runs? This cannot be undone."),
    h("div", { class: "row" },
      h("button", { class: "btn", style: "border-color:var(--bad);color:var(--bad)", onclick: () => { S = blank(); save(); render(); } }, "Erase everything"),
      h("button", { class: "btn", onclick: () => confirmBox.hidden = true }, "Keep my data")));
  return [
    h("h1", null, "Progress"),
    h("section", { class: "panel" }, h("h3", null, "Accuracy by domain"),
      h("p", { class: "muted", style: "font-size:.85rem" }, "Last 40 answers per domain. The orange tick marks 70%."),
      ...domainBars(ds)),
    h("section", { class: "panel" }, h("h3", null, "Where to spend time"),
      h("p", { class: "muted", style: "font-size:.85rem" }, "Ranked by exam weight × share of items missed. High-weight domains with modest gaps outrank small domains with big gaps."),
      h("ol", { style: "margin:0;padding-left:22px;display:grid;gap:6px" }, ranked.map(d => h("li", null, h("strong", null, DOMAINS[d].name), h("span", { class: "muted" }, ` — ${ds[d].n >= 3 ? pct(ds[d].acc) + " correct" : "needs more answers"}`))))),
    topics.length ? h("section", { class: "panel" }, h("h3", null, "Weakest topics"),
      h("div", { class: "list" }, topics.map(t => h("div", { class: "row", style: "justify-content:space-between" },
        h("span", null, t.topic, h("span", { class: "muted", style: "font-size:.85rem" }, ` · ${DOMAINS[t.d].name}`)), h("span", { class: "mono" }, `${pct(t.acc)} of ${t.n}`))))) : null,
    h("section", { class: "panel foot" },
      h("h3", { style: "color:var(--ink)" }, "About"),
      h("p", null, `Registry Ready ${VERSION}. ${BANK.length} original practice items and ${SKILLS.length} skills checklists by Jae H. Choi, PhD, DVSc · HAKOYA LLC.`),
      h("p", null, "Domains and weights follow the NREMT EMT Examination Specifications (2023 BLS Practice Analysis, in use since April 2025). Resuscitation content follows the 2025 AHA Guidelines for CPR and ECC. Follow your local protocols and your program's teaching where they differ."),
      h("p", null, "NREMT is a registered trademark of the National Registry of Emergency Medical Technicians. This app is not affiliated with or endorsed by the National Registry, and its questions are not taken from the exam."),
      h("div", { class: "row" }, h("button", { class: "btn small", onclick: () => { confirmBox.hidden = false; } }, "Erase my data")), confirmBox)
  ];
}

/* ---------- sessions ---------- */
function startSet(mode, items, title) {
  if (!items.length) return;
  ctx = { mode, items, i: 0, right: 0, missed: [], title: title || "Review set" };
  stepSet();
}
function startDrill(d) {
  const ds = E.domainStats(S.hist);
  const pool = BANK.filter(i => i.d === d);
  // unseen first, then lowest box, then random
  const scored = shuffle(pool).sort((a, b) => ((S.srs[a.id]?.box ?? -1) - (S.srs[b.id]?.box ?? -1)));
  startSet("drill", scored.slice(0, 10), DOMAINS[d].name);
}
function stepSet() {
  const c = ctx;
  if (c.i >= c.items.length) return endSet();
  const item = c.items[c.i];
  const quit = h("button", { class: "btn small", onclick: endSet }, "End set");
  $view.replaceChildren(
    h("div", { class: "row", style: "justify-content:space-between" }, h("span", { class: "label" }, c.title), h("span", { class: "mono" }, `${c.i + 1} / ${c.items.length}`)),
    player(item, { feedback: true, footer: quit, onDone: ok => { record(item, ok, c.mode); if (ok) c.right++; else c.missed.push(item.id); c.i++; stepSet(); window.scrollTo(0, 0); } }));
}
function endSet() {
  const c = ctx; ctx = null;
  const n = c.i;
  $view.replaceChildren(h("h1", null, "Set complete"),
    h("section", { class: "panel" },
      h("p", null, h("span", { class: "big" }, `${c.right}/${n}`), " ", h("span", { class: "muted" }, "correct")),
      c.missed.length ? h("p", null, `${c.missed.length} missed item${c.missed.length > 1 ? "s" : ""} will come back in about 10 minutes.`) : n ? h("p", null, "Nothing missed. These items move to longer intervals.") : null,
      h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => startSet("review", E.reviewQueue(S, 15)) }, "Another review set"), h("button", { class: "btn", onclick: () => go("today") }, "Today"))));
}

function startExam() {
  ctx = { mode: "exam", s: { items: [] }, t0: Date.now(), confirm: false };
  stepExam();
}
function stepExam() {
  const c = ctx;
  const stop = E.catShouldStop(c.s);
  if (stop) return endExam();
  const item = E.nextCatItem(c.s);
  const elapsed = h("span", { class: "mono" });
  const updT = () => { elapsed.textContent = fmtTime(Math.floor((Date.now() - c.t0) / 1000)); };
  updT(); clearInterval(c.tid); c.tid = setInterval(updT, 1000);
  const confirm = h("div", { class: "confirm", hidden: true }, h("p", null, "End the exam now? Answers so far will be scored."),
    h("div", { class: "row" }, h("button", { class: "btn", onclick: endExam }, "End and score"), h("button", { class: "btn", onclick: () => confirm.hidden = true }, "Keep going")));
  $view.replaceChildren(
    h("div", { class: "row", style: "justify-content:space-between" }, h("span", { class: "label" }, `Practice exam · item ${c.s.items.length + 1}`), elapsed),
    player(item, { feedback: false, footer: h("button", { class: "btn small", onclick: () => confirm.hidden = false }, "End exam"), onDone: ok => { E.catRecord(c.s, item, ok); record(item, ok, "exam"); stepExam(); window.scrollTo(0, 0); } }),
    confirm);
}
function endExam() {
  const c = ctx; clearInterval(c.tid); ctx = null;
  const s = c.s;
  if (!s.items.length) return go("exam");
  const by = {};
  for (const x of s.items) { const d = E.byId[x.id].d; by[d] = by[d] || { n: 0, right: 0 }; by[d].n++; if (x.ok) by[d].right++; }
  const verdict = E.catVerdict(s);
  const sec = Math.floor((Date.now() - c.t0) / 1000);
  S.exams.push({ t: Date.now(), n: s.items.length, theta: +s.theta.toFixed(3), se: +s.se.toFixed(3), verdict, by, sec });
  save();
  const missed = s.items.filter(x => !x.ok).map(x => E.byId[x.id]);
  $view.replaceChildren(h("h1", null, "Practice exam result"),
    h("section", { class: "panel" },
      h("span", { class: "pill " + verdictCls(verdict) }, verdictText(verdict)),
      h("p", { class: "mono" }, `${s.items.length} items · ${s.items.filter(x => x.ok).length} correct · ${fmtTime(sec)}`),
      h("p", { class: "muted", style: "font-size:.85rem" }, "Like the real exam, the verdict depends on the difficulty of what you answered correctly, not only on percent correct.")),
    h("section", { class: "panel" }, h("h3", null, "By domain"),
      h("div", { class: "list" }, E.DKEYS.filter(d => by[d]).map(d => h("div", { class: "row", style: "justify-content:space-between" }, h("span", null, DOMAINS[d].name), h("span", { class: "mono" }, `${by[d].right}/${by[d].n}`))))),
    missed.length ? h("section", { class: "panel" }, h("h3", null, `Missed items (${missed.length})`),
      h("p", { class: "muted", style: "font-size:.88rem" }, "These are now in your review set."),
      h("div", { class: "list" }, missed.map(it => h("div", null, h("p", null, h("strong", null, it.stem)), h("p", { class: "muted", style: "font-size:.92rem" }, it.why))))) : null,
    h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => startSet("review", missed.length ? missed : E.reviewQueue(S, 15), "Exam review") }, missed.length ? "Review missed items" : "Review set"), h("button", { class: "btn", onclick: () => go("today") }, "Today")));
  window.scrollTo(0, 0);
}

/* ---------- routing ---------- */
const VIEWS = { today: viewToday, exam: viewExam, drill: viewDrill, skills: viewSkills, progress: viewProgress };
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  $view.replaceChildren(...VIEWS[tab]().filter(Boolean));
}
function go(t) {
  if (ctx && ctx.mode === "exam") clearInterval(ctx.tid);
  ctx = null; tab = t; render(); window.scrollTo(0, 0);
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
const start = (location.hash || "").slice(1);
if (VIEWS[start]) tab = start;
render();
})();

</script>
