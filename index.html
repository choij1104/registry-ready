re?","opts":["14","12","15","13"],"ans":3,"key":"Eyes to voice (3), confused speech (4) and obeying commands (6) give a GCS of 13.","why":"Each component is scored on the best response: eye opening to voice is 3, confused conversation is 4, and obeying commands is 6. Recording the components, not just the total, makes later changes easier to interpret.","wrong":["Eyes that open only when spoken to score 3; spontaneous eye opening would be needed for 4.","Following a command is the best motor response (6); localizing pain would score 5.","A score of 15 requires spontaneous eye opening and oriented speech; she is confused and opens her eyes to voice.",""],"src":"STD"},{"id":"PA1-010","d":"PRIMARY","topic":"Level of consciousness","concept":"avpu-classification","b":0.5,"type":"mc","stem":"A 50-year-old man with a head injury responded to your voice when you arrived. Ten minutes later in the ambulance, he responds only to a painful stimulus and his breathing has become irregular. What does this change most likely mean, and what should you do?","opts":["He is tired from the event; let him rest and recheck his mental status at the hospital.","He is deteriorating; support his airway and breathing and give the hospital early notice.","The change is expected after a head injury and does not alter your plan of care or priority.","Complete the secondary assessment of his extremities before addressing his breathing."],"ans":1,"key":"A falling level of responsiveness is a red flag for deterioration; return to airway and breathing and escalate care.","why":"A decline on AVPU, especially with a change in breathing pattern, suggests the brain injury is worsening and the patient may soon lose the ability to protect the airway. Repeat the primary assessment, manage airway and ventilation, and give the hospital early warning.","wrong":["A drop from V to P is a decline in mental status, not fatigue, and needs immediate reassessment.","","Declining responsiveness with irregular breathing suggests worsening brain injury and threatens the airway; care must change.","Life threats found on reassessment take priority over the secondary examination."],"src":"STD"},{"id":"PA1-011","d":"PRIMARY","topic":"Airway","concept":"manual-airway-maneuver","b":-0.5,"type":"mc","stem":"A 40-year-old man fell from a ladder and is unresponsive on the ground with snoring respirations. Bystanders say he struck his head on the way down. What is the most appropriate way to open his airway?","opts":["Jaw thrust, keeping his head and neck in line","Head tilt-chin lift with the neck fully extended","Insert an oral airway before any manual maneuver","Roll him onto his side into the recovery position"],"ans":0,"key":"For an unresponsive patient with possible spinal injury, open the airway with a jaw thrust first.","why":"Snoring in an unresponsive patient means the tongue or soft tissue is partly blocking the airway. The jaw thrust lifts the tongue forward while limiting neck movement, which matters when the mechanism suggests spinal injury.","wrong":["","With suspected spinal injury the jaw thrust is tried first because it opens the airway with less neck movement.","An adjunct supports an airway that has already been opened manually; it does not replace positioning.","The recovery position moves the spine and does not reliably open the airway of a trauma patient."],"src":"AHA"},{"id":"PA1-012","d":"PRIMARY","topic":"Airway","concept":"manual-airway-maneuver","b":1.5,"type":"mc","stem":"An unresponsive 30-year-old woman was thrown from a horse. You have repositioned her twice with a jaw thrust and inserted an oral airway, but you still get no chest rise with the BVM. What should you do next?","opts":["Keep the jaw thrust and squeeze the bag harder and faster to overcome the resistance.","Switch to a head tilt-chin lift, since an open airway outranks possible spine injury.","Stop ventilating and apply a cervical collar before trying again.","Switch to mouth-to-mask ventilation while keeping the same jaw thrust."],"ans":1,"key":"If a jaw thrust cannot open the airway of a trauma patient, use a head tilt-chin lift; the airway comes first.","why":"AHA guidance is to use the jaw thrust when spinal injury is suspected but to switch to a head tilt-chin lift if the jaw thrust does not open the airway. A patient who cannot be ventilated will die of hypoxia regardless of a spinal injury.","wrong":["More force or speed does not open a blocked airway and increases gastric inflation.","","A collar does not open the airway, and pausing ventilation worsens hypoxia.","Changing the ventilation device does not correct the failure to open the airway."],"src":"AHA"},{"id":"PA1-013","d":"PRIMARY","topic":"Airway","concept":"suction-and-drainage","b":0,"type":"order","stem":"A 55-year-old man found on the floor is unresponsive, is not breathing adequately, and has vomit in his mouth. He has a pulse, and there is no suspected trauma. Place your airway and ventilation steps in the correct order.","opts":["Open the airway with a head tilt-chin lift","Suction the vomit from the mouth","Insert an oropharyngeal airway","Begin BVM ventilation with supplemental oxygen"],"key":"Open the airway, clear it, hold it open with an adjunct, then ventilate.","why":"Positioning opens the airway and lets you see and reach the vomit. Suctioning before ventilation keeps you from forcing vomit into the lungs, and an oral airway helps maintain patency during BVM ventilation.","src":"STD"},{"id":"PA1-014","d":"PRIMARY","topic":"Airway","concept":"opa-npa-selection","b":-0.5,"type":"mc","stem":"You are inserting a correctly sized oropharyngeal airway in a 62-year-old woman who responds only to pain after a seizure. As the airway passes her tongue, she gags and begins to retch. What should you do?","opts":["Push the OPA the rest of the way in to finish the insertion.","Tape the OPA in place so that she cannot expel it.","Remove the OPA, have suction ready, and consider an NPA instead.","Remove it and reinsert a smaller OPA right away so it sits less deeply."],"ans":2,"key":"An OPA is only for patients without a gag reflex; if they gag, remove it and use an NPA if one is needed.","why":"A gag response shows she still has protective airway reflexes, so an OPA will provoke vomiting. An NPA is usually better tolerated in a patient with a gag reflex, and suction should be ready in case she vomits.","wrong":["Forcing an OPA in a patient with a gag reflex can cause vomiting and aspiration.","Securing an OPA against a gag reflex does not make it tolerable and still risks vomiting.","","The problem is the intact gag reflex, not the size; any OPA can trigger gagging."],"src":"STD"},{"id":"PA1-015","d":"PRIMARY","topic":"Airway","concept":"opa-npa-selection","b":0.5,"type":"mc","stem":"An unresponsive 28-year-old man was struck in the face with a bat. He has bruising around both eyes, clear fluid draining from his nose, and snoring respirations that improve with a jaw thrust. He has no gag reflex. Which airway adjunct is most appropriate?","opts":["A nasopharyngeal airway sized from the tip of the nose to the earlobe","No adjunct, because airway adjuncts are unsafe in patients with a head injury","A nasopharyngeal airway, because he may regain a gag reflex later","An oropharyngeal airway sized from the corner of the mouth to the earlobe"],"ans":3,"key":"Avoid an NPA with signs of a skull base fracture; an OPA suits an unresponsive patient without a gag reflex.","why":"Raccoon eyes and clear fluid from the nose suggest a basilar skull fracture, a reason to avoid inserting a nasal airway. Because he has no gag reflex, a correctly sized OPA will hold the tongue forward while you maintain the jaw thrust.","wrong":["Clear nasal fluid and bruising around the eyes suggest a skull base fracture, where an NPA should be avoided.","Adjuncts are appropriate in head injury; the choice depends on the gag reflex and the facial injuries.","He has no gag reflex now, and the possible skull base fracture makes the nasal route the riskier choice.",""],"src":"STD"},{"id":"PA1-016","d":"PRIMARY","topic":"Airway","concept":"opa-npa-selection","b":0,"type":"mr","stem":"You decide to insert a nasopharyngeal airway in a 47-year-old man who responds only to pain and still has a gag reflex. He has no facial trauma. Select TWO correct elements of this procedure.","opts":["Measure the airway from the tip of the nose to the earlobe","Lubricate the airway with a water-soluble lubricant","Lubricate the airway with petroleum-based jelly","Rotate the airway 180 degrees after it passes the tongue","Push through any resistance until the flange is seated"],"ans":[0,1],"key":"Size an NPA from nose tip to earlobe, lubricate with water-soluble gel, and never force it.","why":"A correctly measured, well-lubricated NPA slides along the floor of the nasal passage with little trauma. Water-soluble lubricant is used because petroleum products can injure tissue, and resistance means trying the other nostril rather than forcing the device.","wrong":["","","Petroleum-based lubricants can damage tissue and are not used on airway devices.","Rotation is an OPA insertion technique, not part of NPA insertion.","If you meet resistance, withdraw and try the other nostril; forcing it causes bleeding."],"src":"STD"},{"id":"PA1-017","d":"PRIMARY","topic":"Airway","concept":"suction-and-drainage","b":-1,"type":"mc","stem":"You open the airway of an unresponsive 35-year-old woman and hear gurgling with each breath. What is your immediate next action?","opts":["Begin BVM ventilations at 1 breath every 6 seconds","Apply a nonrebreather mask at 15 liters per minute","Suction the mouth and oropharynx until the gurgling clears","Count her respiratory rate for a full 30 seconds to establish a baseline"],"ans":2,"key":"Gurgling means fluid in the upper airway; suction it before anything else.","why":"Gurgling signals blood, vomit or secretions in the upper airway that can be aspirated. Suctioning restores a clear airway so breathing can then be assessed and supported.","wrong":["Ventilating through fluid pushes it into the lungs; the airway must be cleared first.","Oxygen cannot reach the lungs through a fluid-filled airway.","","Gurgling is an airway problem to treat now, not something to measure first."],"src":"STD"},{"id":"PA1-018","d":"PRIMARY","topic":"Airway","concept":"suction-and-drainage","b":0.5,"type":"mc","stem":"A 60-year-old man with a known seizure disorder is postictal, responds only to pain, and is breathing adequately. He begins vomiting large amounts, and your suction cannot keep up. There is no suspected trauma. What should you do?","opts":["Roll him onto his side so the vomit drains while you keep suctioning.","Insert an oral airway to hold the mouth open for drainage.","Begin BVM ventilations to push air past the vomit.","Keep him supine with a head tilt-chin lift and keep suctioning until the vomiting stops."],"ans":0,"key":"When suction cannot keep up, turn the patient on the side so gravity drains the airway.","why":"Large-volume vomiting can overwhelm a suction unit. Turning a non-trauma patient onto the side lets gravity clear the mouth while suction continues, reducing the risk of aspiration.","wrong":["","An OPA does not drain vomit, and a patient who is actively vomiting likely has a gag reflex that it will provoke further.","He is breathing adequately, and ventilating through vomit forces it into the lungs.","Leaving him supine during ongoing vomiting allows the vomit to be aspirated."],"src":"STD"},{"id":"PA1-019","d":"PRIMARY","topic":"Airway","concept":"fbao-2025","b":0,"type":"mc","stem":"In a restaurant, a 52-year-old man stands clutching his throat. He cannot speak or cough, and his face is turning dusky. He nods when you ask if he is choking. What should you do?","opts":["Give abdominal thrusts only, repeating them until the object comes out or he collapses.","Perform a blind finger sweep of his mouth to try to remove the object.","Encourage him to keep trying to cough while you stand by and watch.","Give cycles of 5 back blows then 5 abdominal thrusts until the object comes out."],"ans":3,"key":"2025 AHA: for a responsive choking adult with severe obstruction, alternate 5 back blows and 5 abdominal thrusts.","why":"Inability to speak or cough with a dusky color indicates severe airway obstruction. The 2025 AHA guidelines recommend repeated cycles of 5 back blows and 5 abdominal thrusts for adults and children until the object is expelled; if he becomes unresponsive, start CPR.","wrong":["2025 AHA guidance for a responsive choking adult alternates 5 back blows with 5 abdominal thrusts.","Blind finger sweeps can push the object deeper; remove only an object you can see.","He cannot cough or speak, so this is a severe obstruction that needs immediate action.",""],"src":"AHA"},{"id":"PA1-020","d":"PRIMARY","topic":"Airway","concept":"fbao-2025","b":0.5,"type":"mc","stem":"A woman who is 34 weeks pregnant is choking on food at a family party. She cannot speak or cough. She is standing, and her pregnant abdomen prevents you from performing abdominal thrusts. What technique should you use?","opts":["Alternate 5 back blows with 5 abdominal thrusts","Alternate 5 back blows with 5 chest thrusts","Give abdominal thrusts placed lower than usual","Lay her supine and give abdominal thrusts"],"ans":1,"key":"2025 AHA: in late pregnancy, or when you cannot encircle the abdomen, use back blows with chest thrusts.","why":"Chest thrusts are the alternative when abdominal thrusts are not possible or safe, such as late pregnancy. They are combined with back blows in repeated cycles until the object is expelled or she becomes unresponsive.","wrong":["Abdominal thrusts are not used in late pregnancy; chest thrusts replace them.","","A lower hand position increases the risk to the uterus and fetus and is not recommended.","Abdominal thrusts are avoided in late pregnancy whether she is standing or lying down."],"src":"AHA"},{"id":"PA1-021","d":"PRIMARY","topic":"Airway","concept":"fbao-2025","b":0,"type":"mc","stem":"A father hands you his 7-month-old daughter, who was eating small pieces of fruit. She is awake, has a weak silent cry, cannot cough, and is turning blue. What should you do?","opts":["Give 5 back blows, then 5 chest thrusts with the heel of one hand; repeat.","Give 5 back blows then 5 abdominal thrusts, and repeat.","Perform a blind finger sweep of her mouth to find the food.","Hold her upright and let her keep trying to cough or cry it out on her own."],"ans":0,"key":"2025 AHA: for a choking infant, alternate 5 back blows and 5 chest thrusts; no abdominal thrusts.","why":"A silent cry, no effective cough and cyanosis mean severe obstruction. Infant foreign-body removal uses back blows with the infant head-down along your forearm, then chest thrusts, repeated until the object comes out or the infant becomes unresponsive.","wrong":["","Abdominal thrusts are not used in infants because of the risk of injuring abdominal organs.","Blind sweeps can push the object deeper; remove only an object you can see.","An infant who cannot cry or cough has a severe obstruction and needs back blows and chest thrusts now."],"src":"AHA"},{"id":"PA1-022","d":"PRIMARY","topic":"Airway","concept":"fbao-2025","b":-1,"type":"mc","stem":"A 40-year-old woman began choking on a piece of chicken. She is coughing forcefully, is red in the face, and says, 'I think it's stuck.' Her lips are pink. What is the most appropriate action?","opts":["Give her 5 back blows between the shoulder blades right away to dislodge the food.","Encourage her to keep coughing and watch for signs of severe obstruction.","Give abdominal thrusts until the food comes out or she stops coughing.","Reach into her mouth and sweep out any food you can feel with a finger."],"ans":1,"key":"A patient who can speak and cough forcefully has a mild obstruction; support the cough and watch for worsening.","why":"Speaking and forceful coughing show that air is moving past the obstruction. The best help is to let her cough while you monitor for a weakening cough, inability to speak or cyanosis, which would call for back blows and abdominal thrusts.","wrong":["Back blows and thrusts are for severe obstruction; her forceful cough is clearing the airway effectively.","","Abdominal thrusts are not indicated while she can speak and cough forcefully.","Reaching into the mouth interferes with an effective cough and can push the food deeper."],"src":"AHA"},{"id":"PA1-023","d":"PRIMARY","topic":"Airway","concept":"stridor-and-airway-sounds","b":1,"type":"mc","stem":"A 4-year-old boy has a sudden high fever and is sitting upright leaning forward, drooling, with soft inspiratory stridor. He is alert and frightened on his mother's lap. What is the most appropriate approach?","opts":["Lay him supine so you can look in his mouth with a tongue blade.","Insert an oral airway to keep his swollen airway open during transport to the hospital.","Keep him calm on his mother's lap with oxygen as tolerated; do not examine his throat.","Separate him from his mother so you can hold an oxygen mask firmly over his face."],"ans":2,"key":"Suspected upper-airway swelling in a child: keep calm, position of comfort, oxygen as tolerated, nothing in the mouth.","why":"Sudden fever, drooling, tripod positioning and stridor suggest severe swelling above the vocal cords. Crying and agitation can turn a partial obstruction into a complete one, so care focuses on calm, comfort, gentle oxygen and prompt transport.","wrong":["Agitating him or inspecting the throat can trigger complete obstruction of a swollen upper airway.","An OPA is for unresponsive patients without a gag reflex and could provoke complete obstruction here.","","Separation and forcing a mask increase distress, which can worsen the obstruction."],"src":"STD"},{"id":"PA1-024","d":"PRIMARY","topic":"Airway","concept":"stridor-and-airway-sounds","b":-0.5,"type":"table","stem":"During the primary assessment of several patients, match each airway finding to the most appropriate immediate response.","cols":["Reposition the airway manually","Suction the airway","Treat as upper-airway narrowing and prepare for rapid deterioration"],"rows":[["Snoring respirations in an unresponsive adult",0],["Gurgling with each breath in an unresponsive adult",1],["High-pitched inspiratory stridor and a hoarse voice after a bee sting",2],["Throat tightness and swollen lips minutes after eating shrimp",2],["Bubbling sounds from blood in the mouth after a facial injury",1]],"key":"Snoring means reposition, gurgling means suction, and stridor or throat tightness means upper-airway narrowing.","why":"Each airway sound points to a cause: snoring to soft tissue blocking the airway, gurgling to fluid, and stridor or hoarseness to swelling or narrowing of the upper airway. Swelling from an allergic reaction can progress quickly to complete obstruction.","src":"STD"},{"id":"PA1-025","d":"PRIMARY","topic":"Breathing","concept":"adequate-vs-inadequate-ventilation","b":0,"type":"mc","stem":"A 67-year-old man is lethargic and responds only to a loud voice. His respirations are 8 per minute and shallow, with minimal chest rise. SpO2 is 86% and pulse is 108. What is the most appropriate intervention?","opts":["Apply a nonrebreather mask at 15 liters per minute","Apply a nasal cannula at 4 liters per minute and monitor","Place him in the recovery position and recheck in 5 minutes","Assist ventilations with a BVM and high-flow oxygen"],"ans":3,"key":"Inadequate rate or depth of breathing calls for ventilation with a BVM, not just an oxygen mask.","why":"A slow, shallow rate with minimal chest rise and altered mental status means he is not moving enough air. Assisted ventilation with a BVM and oxygen improves both ventilation and oxygenation, which a mask alone cannot do.","wrong":["A nonrebreather only enriches the air he moves himself; at 8 shallow breaths per minute he needs ventilation.","Low-flow oxygen does nothing to correct inadequate rate and depth of breathing.","Inadequate breathing is a life threat to correct now, not to observe.",""],"src":"STD"},{"id":"PA1-026","d":"PRIMARY","topic":"Breathing","concept":"adequate-vs-inadequate-ventilation","b":-1,"type":"mc","stem":"A 30-year-old woman is anxious after a minor fender-bender. She is alert and speaking in full sentences, with respirations of 24, deep and equal chest rise, clear lung sounds, and SpO2 of 98%. How should you classify her breathing?","opts":["Inadequate, because the rate is above 20; begin BVM ventilation.","Inadequate; apply CPAP because of the elevated respiratory rate.","Adequate; no ventilatory help is needed, but keep monitoring her.","Respiratory failure; prepare to assist her with an airway adjunct."],"ans":2,"key":"Judge breathing by rate, depth, effort and mental status together, not by rate alone.","why":"Good chest rise, normal speech, clear lungs and a normal SpO2 show adequate ventilation despite a slightly fast rate. Ongoing monitoring is appropriate because her condition can change.","wrong":["A mildly fast rate with good depth, clear speech and normal SpO2 is adequate; BVM is not needed.","CPAP is for moderate to severe respiratory distress such as pulmonary edema, not anxiety with normal oxygenation.","","She shows no signs of failure: she is alert, speaking easily and well oxygenated."],"src":"STD"},{"id":"PA1-027","d":"PRIMARY","topic":"Breathing","concept":"adequate-vs-inadequate-ventilation","b":0.5,"type":"mr","stem":"You are assessing a 58-year-old man with shortness of breath. Select THREE findings that indicate inadequate breathing requiring ventilatory support.","opts":["Shallow breaths with minimal chest rise","Increasing drowsiness as you assess him","Respiratory rate of 6 per minute","Speaking in complete sentences","Respiratory rate of 22 with full chest expansion","Warm, pink, dry skin"],"ans":[0,1,2],"key":"Shallow breathing, a very slow rate and worsening mental status signal inadequate ventilation.","why":"Ventilation depends on both rate and depth; either too slow or too shallow fails to move enough air. Increasing drowsiness suggests rising carbon dioxide or falling oxygen, which confirms the need for assisted ventilation.","wrong":["","","","Speaking in full sentences shows he is moving enough air to talk.","A slightly elevated rate with full expansion indicates adequate tidal volume.","Normal skin signs suggest adequate oxygenation and perfusion."],"src":"STD"},{"id":"PA1-028","d":"PRIMARY","topic":"Breathing","concept":"bvm-technique","b":0.5,"type":"mc","stem":"You are ventilating an apneic 50-year-old man who has a pulse, using a BVM. Each squeeze produces no visible chest rise, and you hear air escaping around the mask. What should you do first?","opts":["Reposition his head and reseal the mask, using two rescuers if available.","Squeeze the bag faster to make up for the volume that is lost.","Switch to a nonrebreather mask at 15 liters per minute.","Continue as you are, since some of the air is still reaching his lungs with each squeeze."],"ans":0,"key":"No chest rise with a BVM means fix the airway position and mask seal first; two-rescuer BVM seals best.","why":"Air escaping around the mask with no chest rise points to a poor seal or a poorly opened airway. Repositioning the head, reseating the mask and having one rescuer hold the mask with both hands usually restores effective ventilation.","wrong":["","Faster squeezing does not fix a leak and causes excessive ventilation and gastric inflation.","An apneic patient cannot draw oxygen from a nonrebreather; he needs ventilation.","No chest rise means the ventilation is ineffective and must be corrected now."],"src":"STD"},{"id":"PA1-029","d":"PRIMARY","topic":"Breathing","concept":"bvm-technique","b":1.5,"type":"mc","stem":"While ventilating a 45-year-old woman with a BVM, you notice her upper abdomen becoming more and more distended. Her chest does rise with each breath. What adjustment is most appropriate?","opts":["Increase the rate to 20 breaths per minute so that her oxygenation improves faster.","Press firmly on her upper abdomen to push out the trapped air.","Stop ventilating until the distension goes away on its own.","Give each breath over about 1 second, just enough to make the chest rise."],"ans":3,"key":"Gastric distension comes from too much volume or force; give 1-second breaths just large enough for chest rise.","why":"Air enters the stomach when breaths are too large or too forceful. Delivering each breath over about 1 second with only visible chest rise limits gastric inflation, vomiting and aspiration.","wrong":["Faster rates add gastric inflation and raise chest pressure, which reduces blood return to the heart.","Pressing on a distended stomach can cause vomiting and aspiration.","Stopping ventilation in a patient who needs it causes hypoxia.",""],"src":"AHA"},{"id":"PA1-030","d":"PRIMARY","topic":"Breathing","concept":"bvm-technique","b":-0.5,"type":"mc","stem":"You and your partner are ventilating a 72-year-old man who has a pulse but is breathing only 4 times per minute. He has a full beard and no teeth. Which approach gives the most effective BVM ventilation?","opts":["One EMT ventilates alone with a one-hand seal so the other can obtain vital signs.","One EMT seals the mask with both hands; the other squeezes the bag.","Hold the mask loosely to avoid pressing on his face.","Use the smallest mask so it fits inside his beard."],"ans":1,"key":"Two-rescuer BVM, with one rescuer sealing the mask with both hands, gives the most reliable ventilation.","why":"Beards and missing teeth make a mask seal difficult. A two-handed seal by one rescuer while the other squeezes the bag overcomes most leaks; an oral airway can also help keep the airway open.","wrong":["One-person BVM often leaks, especially with a beard and no teeth; two rescuers ventilate more effectively.","","A loose mask leaks air and prevents adequate chest rise.","An undersized mask will not cover both the mouth and nose and will leak."],"src":"STD"},{"id":"PA1-031","d":"PRIMARY","topic":"Breathing","concept":"ventilation-rates-by-age","b":-0.5,"type":"mc","stem":"After a prolonged seizure, a 38-year-old man has a strong carotid pulse but only occasional gasps. Your partner connects oxygen to the BVM. At what rate should you ventilate him?","opts":["1 breath every 6 seconds","1 breath every 2-3 seconds","1 breath every 3-4 seconds","1 breath every 10 seconds"],"ans":0,"key":"Adult with a pulse and inadequate breathing: 1 breath every 6 seconds, each over about 1 second with chest rise.","why":"Occasional gasps are not adequate breathing. AHA recommends 1 breath every 6 seconds (10 per minute) for an adult with a pulse, avoiding excessive ventilation.","wrong":["","This is the rate for an infant or child with a pulse; it is too fast for an adult.","This is faster than the adult recommendation and risks excessive ventilation.","This is too slow to provide adequate ventilation for an adult."],"src":"AHA"},{"id":"PA1-032","d":"PRIMARY","topic":"Breathing","concept":"ventilation-rates-by-age","b":0.5,"type":"table","stem":"Each patient below has a pulse but is not breathing adequately. Classify the correct rescue breathing rate for each patient.","cols":["1 breath every 6 seconds","1 breath every 2-3 seconds"],"rows":[["45-year-old man after a heroin overdose",0],["4-year-old girl pulled from a swimming pool",1],["8-month-old infant with severe bronchiolitis",1],["80-year-old woman after a large stroke",0]],"key":"Rescue breathing with a pulse: adults 1 breath every 6 seconds; infants and children 1 breath every 2-3 seconds.","why":"Infants and children have higher metabolic demands and normal respiratory rates, so they are ventilated faster. Adults are ventilated at 10 breaths per minute to avoid hyperventilation.","src":"AHA"},{"id":"PA1-033","d":"PRIMARY","topic":"Breathing","concept":"opioid-ventilate-first","b":0,"type":"mc","stem":"A 26-year-old man is found in a gas station restroom. He responds only to pain, has pinpoint pupils, respirations of 4 per minute, cyanotic lips, and a radial pulse of 58. A syringe is on the floor. What is your first priority?","opts":["Give naloxone and wait for him to start breathing","Open his airway and ventilate with a BVM and oxygen","Apply a nonrebreather mask at 15 liters per minute","Check his blood glucose level before any treatment is started"],"ans":1,"key":"In suspected opioid overdose with a pulse, ventilate first; naloxone is given in addition, not instead.","why":"Opioid toxicity kills through respiratory depression and hypoxia. AHA guidance is to open the airway and support ventilation first, then give naloxone while continuing to ventilate.","wrong":["Naloxone takes time to work; ventilation must start first to correct hypoxia.","","Four breaths per minute cannot draw in enough oxygen; he needs ventilation.","Glucose can be checked later; inadequate breathing is the immediate life threat."],"src":"AHA"},{"id":"PA1-034","d":"PRIMARY","topic":"Breathing","concept":"opioid-ventilate-first","b":0.5,"type":"order","stem":"A 41-year-old woman with a suspected opioid overdose has a pulse, responds only to pain, and is breathing 3 times per minute. Place your initial actions in the correct order.","opts":["Open the airway with a head tilt-chin lift","Begin BVM ventilations with supplemental oxygen","Give naloxone per protocol while ventilation continues","Reassess breathing and mental status after naloxone"],"key":"Opioid emergency with a pulse: open the airway, ventilate, give naloxone, then reassess.","why":"Ventilation corrects the hypoxia that makes opioid overdose deadly, so it comes before naloxone. Naloxone may restore breathing, but reassessment is needed because its effect can wear off before the opioid's does.","src":"AHA"},{"id":"PA1-035","d":"PRIMARY","topic":"Breathing","concept":"asthma-copd-chf-primary","b":1.5,"type":"mc","stem":"A 16-year-old girl with asthma had loud wheezing when you arrived. Despite using her inhaler, she is now drowsy, her wheezing has become very faint, and her chest barely moves. SpO2 is 85%. What is the best interpretation and action?","opts":["Her bronchospasm is improving; continue to observe her on a nasal cannula.","She is tired but stable after the inhaler; let her rest in a position of comfort and monitor.","Impending respiratory failure; assist ventilations with a BVM and oxygen and transport now.","She is having a panic attack; coach her to slow her breathing."],"ans":2,"key":"A quiet chest with drowsiness in asthma signals respiratory failure; assist ventilation.","why":"Wheezing requires air movement; when it fades while the patient becomes drowsy, very little air is moving. This is a pre-arrest pattern that requires assisted ventilation and rapid transport.","wrong":["Fainter wheezing with drowsiness and poor chest movement means less air movement, not improvement.","Drowsiness and an SpO2 of 85% indicate failing ventilation, not stability.","","Her findings show severe asthma with failing ventilation, not anxiety."],"src":"STD"},{"id":"PA1-036","d":"PRIMARY","topic":"Breathing","concept":"asthma-copd-chf-primary","b":0.5,"type":"mc","stem":"A 74-year-old woman with heart failure woke up gasping. She sits upright, alert and anxious, with crackles in both lungs and pink frothy sputum. BP 172/98, pulse 112, respirations 30, SpO2 87%. She follows commands. What is the most appropriate breathing intervention?","opts":["Lay her flat so that she is more comfortable and can rest","Begin BVM ventilation at 1 breath every 6 seconds","Apply a nasal cannula at 2 liters per minute","Apply CPAP per protocol, monitoring mental status and BP"],"ans":3,"key":"An alert patient in severe distress from pulmonary edema, with adequate BP, benefits from CPAP.","why":"Crackles, frothy sputum and severe dyspnea in a heart failure patient suggest pulmonary edema. CPAP keeps the alveoli open and improves oxygenation in a patient who is alert, can follow commands and has an adequate blood pressure.","wrong":["Lying flat worsens pulmonary edema and breathing effort; she should stay upright.","She is alert and breathing on her own; CPAP supports her breathing without taking it over.","Low-flow oxygen is not enough for severe distress and hypoxia from pulmonary edema.",""],"src":"STD"},{"id":"PA1-037","d":"PRIMARY","topic":"Breathing","concept":"asthma-copd-chf-primary","b":1.5,"type":"mr","stem":"You are considering CPAP for a 69-year-old man in respiratory distress from suspected pulmonary edema. Select TWO findings that make CPAP inappropriate and call for a different approach.","opts":["He now responds only to painful stimuli","His blood pressure is 76/48","Crackles are heard in both lungs","SpO2 is 88% on room air","Respirations are 28 and labored while he stays alert"],"ans":[0,1],"key":"CPAP requires a patient alert enough to protect the airway and a blood pressure that can tolerate it.","why":"A patient who responds only to pain cannot protect the airway or cooperate with a sealed mask and needs BVM ventilation instead. CPAP raises chest pressure and can lower blood pressure further, so marked hypotension is a reason not to use it.","wrong":["","","Crackles from pulmonary edema are a reason to use CPAP, not to avoid it.","Hypoxia from pulmonary edema is an indication for CPAP.","An alert patient with labored breathing is the typical CPAP candidate."],"src":"STD"},{"id":"PA1-038","d":"PRIMARY","topic":"Breathing","concept":"peds-distress-vs-failure","b":0,"type":"mc","stem":"A 3-year-old boy with a cough and fever sits on his mother's lap. He is alert and fussy, with nasal flaring, intercostal retractions, respirations of 44, and pink skin. SpO2 is 93%. How should you classify his condition?","opts":["Respiratory failure; begin BVM ventilation immediately with high-flow oxygen.","Normal for his age; no intervention is needed.","Respiratory distress; keep him calm and give oxygen as tolerated.","Respiratory arrest; begin rescue breathing right away."],"ans":2,"key":"Increased work of breathing in an alert child is distress; altered mental status or slowing breathing marks failure.","why":"An alert, interactive child with good color who is working hard to breathe is compensating. Keeping him calm with his parent and giving oxygen as tolerated supports him while you watch for signs of failure.","wrong":["He is alert and pink and still compensating; BVM is for failure signs such as lethargy or slowing breathing.","Retractions, nasal flaring and a rate of 44 show increased work of breathing.","","He is alert and breathing on his own, so he is not in arrest."],"src":"STD"},{"id":"PA1-039","d":"PRIMARY","topic":"Breathing","concept":"peds-distress-vs-failure","b":1,"type":"mr","stem":"A 2-year-old girl with asthma had retractions and nasal flaring 15 minutes ago. Select TWO findings that indicate she has progressed from respiratory distress to respiratory failure.","opts":["She is now limp and does not react to you","Her breathing rate has slowed from 50 to 14 with poor effort","She is crying loudly and pushing the oxygen mask away from her face","She has intercostal retractions with a respiratory rate of 46","She is clinging to her father and watching you closely"],"ans":[0,1],"key":"Decreasing responsiveness and a slowing respiratory rate in a struggling child mean respiratory failure.","why":"A child in failure is too tired or hypoxic to keep up the work of breathing, so mental status drops and the rate slows. These signs require assisted ventilation, whereas crying and fighting the mask are reassuring.","wrong":["","","Vigorous crying and resistance show good mental status and air movement.","Retractions with a fast rate are signs of distress; she is still compensating.","Alertness and interaction show she is still compensating."],"src":"STD"},{"id":"PA1-040","d":"PRIMARY","topic":"Oxygenation","concept":"oxygen-device-choice","b":0.5,"type":"mc","stem":"A 60-year-old man has severe shortness of breath from pneumonia. He is alert, breathing 26 times per minute with good chest rise, and speaking in short sentences. SpO2 is 84%. Which oxygen delivery is most appropriate?","opts":["Nonrebreather at 12-15 L/min, then titrate to his SpO2 target per protocol","Nasal cannula turned up to 15 liters per minute to deliver the most oxygen possible","BVM ventilation at 1 breath every 6 seconds with high-flow oxygen","No oxygen until a second SpO2 reading confirms the low value"],"ans":0,"key":"Adequate breathing with significant hypoxia calls for high-concentration oxygen by mask, titrated to target.","why":"His breathing rate and depth are adequate, so the problem is oxygenation, not ventilation. A nonrebreather delivers a high oxygen concentration, and the flow or device can be adjusted once his SpO2 reaches the target.","wrong":["","A nasal cannula is a low-flow device; flows above about 6 L/min add little and irritate the nose.","He is breathing adequately; he needs supplemental oxygen, not assisted ventilation.","An SpO2 of 84% with distress needs oxygen now; waiting allows hypoxia to worsen."],"src":"STD"},{"id":"PA1-041","d":"PRIMARY","topic":"Oxygenation","concept":"oxygen-device-choice","b":-1,"type":"mc","stem":"A 35-year-old woman twisted her ankle stepping off a curb. She is alert, breathing 16 times per minute without distress, and her SpO2 is 98% on room air. What is appropriate regarding oxygen?","opts":["Apply a nonrebreather at 15 L/min because all injured patients need it.","Apply a nasal cannula at 4 L/min to relieve her pain and anxiety.","Apply a simple face mask at 10 L/min as a general precaution.","Oxygen is not needed; continue to monitor her breathing and SpO2."],"ans":3,"key":"Give oxygen for a reason, such as hypoxia or distress, not routinely to every patient.","why":"Current practice is to give supplemental oxygen when a patient is hypoxic, short of breath or showing signs of shock. A comfortable patient with normal breathing and SpO2 does not benefit from it.","wrong":["Routine high-flow oxygen is not indicated for a well-oxygenated patient without distress.","Oxygen does not treat pain or anxiety in a patient with normal oxygenation.","Precautionary oxygen is not indicated when breathing and SpO2 are normal.",""],"src":"STD"},{"id":"PA1-042","d":"PRIMARY","topic":"Oxygenation","concept":"spo2-limits","b":0.5,"type":"mc","stem":"A family complains of headaches and nausea that began after they turned on an old furnace this morning. The 40-year-old father is confused, and his SpO2 reads 99%. After moving everyone out of the house, what is the most appropriate oxygen care for him?","opts":["Withhold oxygen because his SpO2 reading is normal","Give high-flow oxygen by nonrebreather despite the normal reading","Give oxygen by nasal cannula at 2 liters per minute","Recheck his SpO2 on another finger in 10 minutes before deciding on oxygen"],"ans":1,"key":"Standard pulse oximetry cannot detect carbon monoxide; treat suspected CO poisoning with high-flow oxygen.","why":"A shared headache and nausea after starting a furnace strongly suggest carbon monoxide exposure. Because standard oximeters cannot tell carbon monoxide from oxygen on hemoglobin, the patient's symptoms, not the SpO2, guide high-flow oxygen therapy.","wrong":["Pulse oximeters read carbon monoxide-bound hemoglobin as oxygenated, so the reading is falsely reassuring.","","Suspected carbon monoxide poisoning calls for the highest oxygen concentration available.","Any finger will read falsely normal, and delaying high-flow oxygen prolongs tissue hypoxia."],"src":"STD"},{"id":"PA1-043","d":"PRIMARY","topic":"Oxygenation","concept":"spo2-limits","b":1.5,"type":"mr","stem":"You use pulse oximetry on several patients during your shift. Select TWO situations in which the SpO2 reading is most likely to be misleading.","opts":["A man pulled from a smoky house fire","A hypothermic woman with cold, pale fingers","An alert teenager with a sprained ankle","A man with asthma who is wheezing but alert","A woman wearing a nasal cannula at 2 L/min"],"ans":[0,1],"key":"SpO2 can mislead with carbon monoxide exposure and with poor peripheral perfusion such as cold fingers.","why":"Smoke inhalation often includes carbon monoxide, which standard oximeters read as normal saturation. Cold, poorly perfused fingers can give low, erratic or no readings, so findings must always be matched to the patient's appearance.","wrong":["","","Normal perfusion and no toxic exposure make an accurate reading likely.","Asthma does not make the device inaccurate; the reading reflects his oxygenation.","Supplemental oxygen does not make the reading inaccurate."],"src":"STD"},{"id":"PA1-044","d":"PRIMARY","topic":"Oxygenation","concept":"copd-oxygen","b":0.5,"type":"mc","stem":"A 71-year-old woman with COPD is in moderate respiratory distress. She is alert and using accessory muscles, and her SpO2 is 82%. Her husband says she was told never to use 'too much oxygen.' What is most appropriate?","opts":["Give oxygen titrated to her target SpO2 per protocol and watch her breathing","Withhold oxygen because extra oxygen may suppress her drive to breathe and stop her breathing","Give oxygen only if her SpO2 falls below 75 percent.","Begin BVM ventilation because she has a history of COPD."],"ans":0,"key":"Never withhold oxygen from a hypoxic COPD patient; titrate it and watch for changes in breathing.","why":"Some COPD patients retain carbon dioxide when given large amounts of oxygen, but untreated hypoxia is far more dangerous. Oxygen is titrated to a target range set by protocol, and the patient is watched for drowsiness or slowing respirations.","wrong":["","Hypoxia is the greater immediate danger; oxygen is never withheld from a hypoxic patient.","She is already significantly hypoxic; waiting for a lower value risks harm.","She is alert and moving air; she needs oxygen and monitoring, not assisted ventilation."],"src":"STD"},{"id":"PA1-045","d":"PRIMARY","topic":"Oxygenation","concept":"copd-oxygen","b":1.5,"type":"mc","stem":"A 68-year-old man with COPD has been on a nonrebreather for 20 minutes during a long transport. He was alert and anxious at first; now he is drowsy, his respirations have slowed to 8 and shallow, and his SpO2 is 95%. What is the most appropriate action?","opts":["Turn off the oxygen so that his drive to breathe returns.","Assist ventilations with a BVM and oxygen; reassess mental status.","Continue the nonrebreather unchanged, since his SpO2 of 95% is acceptable.","Switch him to CPAP to hold his airways open."],"ans":1,"key":"Falling mental status with slow, shallow breathing means inadequate ventilation; assist with a BVM rather than removing oxygen.","why":"SpO2 measures oxygenation, not ventilation, so carbon dioxide can rise while the reading looks good. Assisting ventilation with a BVM corrects the underlying problem and keeps him oxygenated; oxygen should then be titrated to the protocol target rather than left at maximum.","wrong":["Removing oxygen causes hypoxia; the problem is inadequate ventilation, which must be supported.","","A good SpO2 does not show adequate ventilation; slow, shallow breathing with drowsiness needs assistance.","CPAP requires an alert patient who can protect the airway; he is now drowsy."],"src":"STD"},{"id":"PA1-046","d":"PRIMARY","topic":"Pediatric primary assessment","concept":"pediatric-assessment-triangle","b":-0.5,"type":"mc","stem":"You enter a living room where an 18-month-old girl with two days of vomiting lies on a couch. Before touching her, you use the Pediatric Assessment Triangle. Which finding is most concerning?","opts":["She cries loudly and clings tightly to her mother whenever you come close.","Her breathing rate seems a little fast while she is crying.","She lies still, ignores you and her mother, and has a weak cry.","She follows you with her eyes and reaches for your penlight."],"ans":2,"key":"Appearance (tone, interaction, consolability, gaze, cry) is the most telling PAT element of how sick a child is.","why":"A child who is limp, uninterested in surroundings and has a weak cry has an abnormal appearance, which reflects poor brain oxygenation or perfusion. This makes her a high priority even before any hands-on assessment.","wrong":["Crying and clinging show good tone and interaction, which is a reassuring appearance.","Crying raises the respiratory rate; this alone is not a sign of serious illness.","","Tracking and reaching show normal interaction and mental status."],"src":"STD"},{"id":"PA1-047","d":"PRIMARY","topic":"Pediatric primary assessment","concept":"pediatric-assessment-triangle","b":0,"type":"table","stem":"From the doorway, you observe a sick 2-year-old. Classify each finding by the Pediatric Assessment Triangle component it belongs to.","cols":["Appearance","Work of breathing","Circulation to skin"],"rows":[["Head bobbing with each breath",1],["Mottled skin on the legs",2],["Does not track your movement or reach for toys",0],["Supraclavicular retractions",1],["Pale lips and face",2]],"key":"The PAT looks at appearance, work of breathing and circulation to skin, all from across the room.","why":"Head bobbing and retractions are signs of increased work of breathing. Mottling and pallor reflect circulation to the skin, and lack of interest in surroundings is an abnormal appearance.","src":"STD"},{"id":"PA1-048","d":"PRIMARY","topic":"Pediatric primary assessment","concept":"peds-airway-anatomy","b":0,"type":"mc","stem":"A 9-month-old infant lying supine on a firm surface responds only to pain and has snoring respirations. Her head is flexed forward on her chest. What is the best way to position her airway?","opts":["Place a pillow under her head to raise it slightly off the firm surface.","Hyperextend her neck as you would for an adult.","Insert an oral airway first, then adjust her head position.","Place a folded towel under her shoulders to bring her head to neutral."],"ans":3,"key":"An infant's large occiput flexes the neck; shoulder padding achieves a neutral position without hyperextension.","why":"Infants have a proportionally large back of the head that pushes the chin toward the chest when supine. A thin pad under the shoulders aligns the airway, while too much extension can also close the soft infant airway.","wrong":["Raising the head flexes the neck further and worsens obstruction caused by the large occiput.","Hyperextension can kink the soft, flexible infant trachea and obstruct the airway.","Positioning comes first; an adjunct does not overcome a flexed neck.",""],"src":"STD"},{"id":"PA1-049","d":"PRIMARY","topic":"Pediatric primary assessment","concept":"peds-airway-anatomy","b":0.5,"type":"mc","stem":"A 2-month-old with a cold has noisy breathing, mild retractions, and is struggling to feed. You see thick secretions in both nostrils. The infant is alert and pink. What is the most appropriate first step?","opts":["Insert a nasopharyngeal airway to open the nose","Begin BVM ventilation for the retractions","Gently suction the nostrils with a bulb syringe","Suction deep in the throat with a rigid catheter"],"ans":2,"key":"Young infants breathe mainly through the nose, so clearing nasal secretions can greatly ease their breathing.","why":"Because young infants depend heavily on nasal breathing, even modest nasal congestion can cause distress and feeding trouble. Gentle bulb suction of the nostrils is often enough to relieve it.","wrong":["An alert infant does not need an NPA; clearing the secretions treats the cause.","The infant is alert and pink; mild distress from congestion does not need ventilation.","","Deep suctioning can slow the heart rate and is not needed for nasal secretions."],"src":"STD"},{"id":"PA1-050","d":"PRIMARY","topic":"Pediatric primary assessment","concept":"peds-distress-vs-failure","b":1.5,"type":"mc","stem":"A 14-month-old with bronchiolitis had a respiratory rate of 60 with retractions when you arrived. Ten minutes later the child is limp and barely responds, respirations are 16 and shallow, and the heart rate has fallen from 160 to 70. What should you do?","opts":["Begin BVM ventilation with oxygen at 1 breath every 2-3 seconds; transport now.","Recognize that the child is improving and continue blow-by oxygen.","Apply a pediatric nonrebreather mask at 15 L/min and reassess the child in 5 minutes.","Have the parent hold the child upright to make breathing easier."],"ans":0,"key":"Slowing breathing, limpness and a falling heart rate in a sick child mean respiratory failure; ventilate immediately.","why":"Children usually deteriorate from respiratory failure, and a falling heart rate in a hypoxic child is an ominous late sign. Prompt BVM ventilation with oxygen at the pediatric rate can reverse the hypoxia before arrest occurs; if the heart rate falls below 60 with poor perfusion despite effective ventilation, begin CPR.","wrong":["","Slowing breathing with limpness and a falling heart rate signal failure, not improvement.","Shallow breathing at 16 cannot be corrected with a mask; the child needs ventilation now.","Positioning helps a compensating child; this child needs assisted ventilation."],"src":"STD"},{"id":"PA1-051","d":"PRIMARY","topic":"Pediatric primary assessment","concept":"pediatric-assessment-triangle","b":0.5,"type":"mc","stem":"A 5-year-old boy with croup has a barking cough, mild stridor when he cries, and suprasternal retractions. He is alert, interactive and pink. Using the Pediatric Assessment Triangle, what is the best approach?","opts":["Treat it as respiratory failure and begin BVM ventilation.","Lay him flat and examine his throat with a tongue blade.","Classify him as stable and suggest that the family drive him to his clinic later today.","Treat as distress: keep him calm with a parent, give oxygen as tolerated, transport."],"ans":3,"key":"Abnormal work of breathing with normal appearance and color is respiratory distress; avoid agitating the child.","why":"In the PAT, an abnormal work of breathing with a normal appearance and circulation indicates respiratory distress. Keeping the child calm with a caregiver prevents crying, which worsens stridor, while you provide oxygen and transport.","wrong":["Normal appearance and color show he is compensating; BVM is for respiratory failure.","Agitation and throat inspection can worsen upper-airway obstruction.","Stridor with retractions is abnormal work of breathing that warrants EMS assessment and transport.",""],"src":"STD"},{"id":"PA2-001","d":"PRIMARY","topic":"Cardiac arrest","concept":"agonal-breathing-means-arrest","b":-1,"type":"mc","stem":"A 58-year-old man collapses at a gym. You find him unresponsive on his back. Every 8 to 10 seconds he makes a loud, snoring gasp. You check for a carotid pulse and feel none within 10 seconds. Your partner is bringing the AED from the truck. What should you do now?","opts":["Insert an oral airway and apply oxygen by nonrebreather mask","Place him in the recovery position and recheck his pulse in 1 minute","Begin chest compressions at 100 to 120 per minute","Give two rescue breaths, then recheck the pulse for 10 seconds"],"ans":2,"key":"Occasional gasping (agonal breathing) is not normal breathing; with no pulse, start compressions immediately.","why":"Agonal gasps are a sign of cardiac arrest, not effective breathing. A pulseless patient with only gasping needs immediate high-quality compressions, with the AED applied as soon as it arrives.","wrong":["Gasping with no pulse is cardiac arrest; oxygen by mask does nothing without circulation and delays compressions.","The recovery position is for a patient who is breathing normally and has a pulse; this patient is in arrest.","","The pulse has already been checked; adult CPR begins with compressions once arrest is identified, and a second check only adds delay."],"src":"AHA"},{"id":"PA2-002","d":"PRIMARY","topic":"Cardiac arrest","concept":"agonal-breathing-means-arrest","b":0,"type":"mc","stem":"A 71-year-old woman slumps over in a church pew. Members lay her on the floor and tell you she is still breathing. You see her chest move only with an occasional deep gasp. While checking her carotid artery for 10 seconds, you are not sure whether you feel a faint pulse. What is the best action?","opts":["Start chest compressions and apply the AED","Keep palpating the carotid pulse until you are certain","Move to the radial artery and check for another 10 seconds","Apply high-flow oxygen and reassess her breathing in 2 minutes"],"ans":0,"key":"If you cannot definitely feel a pulse within 10 seconds in a patient who is not breathing normally, start CPR.","why":"Pulse checks are unreliable and must not exceed 10 seconds. A patient with only occasional gasps and no definite pulse is treated as being in cardiac arrest; compressions on a patient who turns out to have a pulse rarely cause serious harm.","wrong":["","Prolonged pulse checks delay compressions; the limit is 10 seconds.","A radial pulse is harder to feel than a carotid and extends the delay without changing the decision.","Gasping is not normal breathing; waiting 2 minutes on oxygen leaves a possibly pulseless patient without circulation."],"src":"AHA"},{"id":"PA2-003","d":"PRIMARY","topic":"Cardiac arrest","concept":"aed-special-situations","b":-0.5,"type":"mc","stem":"Lifeguards pull a 30-year-old man from a pool onto the deck. He is unresponsive and pulseless, and your partner starts compressions. His chest is wet. The AED is ready. What should you do?","opts":["Delay defibrillation until he is moved indoors and completely dried","Quickly wipe his chest dry, then apply the pads and analyze","Apply the pads directly over the wet skin to avoid any delay","Withhold the AED because water makes defibrillation unsafe for rescuers"],"ans":1,"key":"A wet chest is wiped dry quickly before pad placement; water is not a reason to withhold or delay the AED.","why":"Water on the chest can reduce pad adhesion and let current travel across the skin instead of through the heart. A quick wipe takes seconds; the patient does not need to be fully dried or moved indoors once he is out of the water and no one touches him during the shock.","wrong":["Moving and fully drying the patient wastes minutes when only the chest needs to be wiped.","","Water on the chest can reduce pad adhesion and divert current; wiping it first takes only seconds.","An AED can be used once the patient is out of the water and the chest is dried; withholding it removes his best chance."],"src":"AHA"},{"id":"PA2-004","d":"PRIMARY","topic":"Cardiac arrest","concept":"aed-special-situations","b":0.5,"type":"mc","stem":"A 66-year-old man is in cardiac arrest in his kitchen. When you expose his chest, you see a firm, coin-sized bulge under the skin just below his right collarbone, exactly where the upper AED pad normally goes. What is the correct approach?","opts":["Skip the AED because the implanted device will treat the rhythm","Place the upper pad directly over the bulge to ensure good contact","Do CPR only, because a shock could damage the implanted device","Place the pad off the device and analyze without delay"],"ans":3,"key":"Avoid placing an AED pad directly over an implanted pacemaker or defibrillator, but do not delay defibrillation.","why":"A pad directly over an implanted device can block or divert current. Shifting the pad so it is not over the device, or using front-to-back placement, keeps current flowing through the heart without delaying the shock.","wrong":["An implanted device may have failed or be unable to correct the rhythm; the AED must still be used.","A pad directly over the device can impede current delivery to the heart.","Concern for the device never outweighs the need to defibrillate a shockable rhythm.",""],"src":"AHA"},{"id":"PA2-005","d":"PRIMARY","topic":"Cardiac arrest","concept":"aed-special-situations","b":-1,"type":"mc","stem":"An 80-year-old woman in cardiac arrest has a medication patch on her right upper chest, exactly where the AED pad should go. Your partner is doing compressions. What should you do before applying that pad?","opts":["Remove the patch, wipe the skin, then apply the pad","Apply the pad on top of the patch to save time","Place both pads on her back to avoid the patch","Leave the patch and skip defibrillation until ALS arrives"],"ans":0,"key":"Remove a medication patch and wipe the skin before placing an AED pad over that area.","why":"A patch under the pad can block current delivery and cause a skin burn. Removing it with gloves and wiping the area takes only seconds and does not meaningfully delay the shock.","wrong":["","A pad over a patch can block current delivery and may burn the skin.","Both pads on the back will not direct current through the heart.","The patch is easily removed; skipping defibrillation removes her best chance of survival."],"src":"AHA"},{"id":"PA2-006","d":"PRIMARY","topic":"Cardiac arrest","concept":"aed-special-situations","b":0.5,"type":"mc","stem":"A 4-year-old boy is found unresponsive and pulseless at a daycare. CPR is in progress. Your AED kit has only adult pads, and there is no pediatric attenuator. What should you do?","opts":["Withhold the AED and continue CPR until ALS arrives with pediatric equipment","Use the adult pads, placing them so they do not touch, front-to-back if needed","Cut the adult pads in half so they fit the child's chest","Place both adult pads side by side on the front of the chest, overlapping if needed"],"ans":1,"key":"Use pediatric pads or an attenuator if available; otherwise use adult pads that do not touch, front-to-back on a small chest.","why":"Defibrillation of a shockable rhythm is more important than the dose reduction pediatric equipment provides. Adult pads are used when nothing else is available, as long as they do not touch; front-to-back placement makes room on a small chest.","wrong":["If pediatric pads or an attenuator are unavailable, adult pads are used rather than withholding defibrillation.","","Cutting pads damages them and makes current delivery unpredictable.","Touching or overlapping pads let current arc across the chest instead of through the heart."],"src":"AHA"},{"id":"PA2-007","d":"PRIMARY","topic":"Cardiac arrest","concept":"cpr-ratios-by-age","b":0.5,"type":"mc","stem":"You and your partner are performing CPR on a 7-month-old infant in cardiac arrest. Your partner is giving breaths with a bag-valve mask while you compress. Which compression technique and ratio should you use?","opts":["Two fingers on the lower sternum, 15 compressions to 2 breaths","Two-thumb encircling hands, 30 compressions to 2 breaths","Two-thumb encircling hands, 15 compressions to 2 breaths","Heel of one hand, 30 compressions to 2 breaths"],"ans":2,"key":"Two-rescuer infant CPR uses 15:2; compress with two-thumb encircling or heel of one hand, not two fingers (2025).","why":"With two rescuers, infants and children receive 15 compressions to 2 breaths. The 2025 guidelines recommend the two-thumb encircling technique or the heel of one hand because the two-finger technique often fails to reach adequate depth.","wrong":["The 2025 guidelines no longer recommend the two-finger technique; it produces shallower compressions.","30:2 is the single-rescuer ratio; two rescuers use 15:2 for infants and children.","","30:2 is the single-rescuer ratio; with two rescuers the infant ratio is 15:2."],"src":"AHA"},{"id":"PA2-008","d":"PRIMARY","topic":"Cardiac arrest","concept":"cpr-ratios-by-age","b":0,"type":"mc","stem":"Off duty and alone, you find a 3-month-old infant unresponsive, not breathing, and with no brachial pulse. You call 911 on speakerphone and begin CPR. Which ratio and compression depth are correct?","opts":["30 compressions to 2 breaths, about 1.5 inches (one-third of chest depth)","15 compressions to 2 breaths, about 1.5 inches (one-third of chest depth)","30 compressions to 2 breaths, about 2.5 inches deep","15 compressions to 2 breaths, about 1 inch deep"],"ans":0,"key":"Single-rescuer infant CPR is 30:2 with compressions about 1.5 in (4 cm), one-third of the chest depth.","why":"A lone rescuer uses 30:2 for all ages. Infant compressions should be at least one-third of the front-to-back chest depth, about 1.5 inches.","wrong":["","15:2 is used only when two rescuers are present.","2.5 inches is deeper than recommended for an infant and risks injury.","15:2 is for two rescuers, and 1 inch is shallower than one-third of the chest depth."],"src":"AHA"},{"id":"PA2-009","d":"PRIMARY","topic":"Cardiac arrest","concept":"cpr-ratios-by-age","b":-0.5,"type":"table","stem":"You are reviewing CPR calls from the past month. No advanced airway was in place on any of them. Classify the correct compression-to-ventilation ratio for each situation.","cols":["30:2","15:2"],"rows":[["One EMT alone with a 50-year-old adult",0],["Two EMTs with a 6-year-old child",1],["One EMT alone with a 9-month-old infant",0],["Two EMTs with a 45-year-old adult",0],["Two EMTs with a 2-month-old infant",1]],"key":"Adults are 30:2 regardless of rescuer number; children and infants are 30:2 with one rescuer and 15:2 with two.","why":"The adult ratio stays 30:2 with any number of rescuers. For children and infants, a second rescuer allows 15:2, which delivers more ventilations because pediatric arrest is often caused by respiratory failure.","src":"AHA"},{"id":"PA2-010","d":"PRIMARY","topic":"Cardiac arrest","concept":"high-quality-cpr","b":-0.5,"type":"mc","stem":"You and a firefighter are doing two-rescuer CPR on a 62-year-old woman with an AED attached. You have been compressing for about 2 minutes, you feel fine, and your compressions still look deep. The AED is about to analyze. What should happen?","opts":["Keep compressing because you are not yet fatigued","Switch only when your compressions visibly become shallow","Switch compressors every 5 minutes to limit interruptions","Switch compressors during the analysis, in under 5 seconds"],"ans":3,"key":"Change compressors about every 2 minutes, ideally during rhythm analysis, with the switch done in under 5 seconds.","why":"Compression quality declines within about 2 minutes, often before the rescuer notices fatigue. Swapping during the AED analysis uses a pause that already exists and keeps interruptions short.","wrong":["Rescuers fatigue before they notice it; compressors should switch about every 2 minutes regardless.","Compression quality declines before fatigue is visible; waiting allows poor compressions.","Five minutes is too long; quality drops within about 2 minutes.",""],"src":"AHA"},{"id":"PA2-011","d":"PRIMARY","topic":"Cardiac arrest","concept":"resume-compressions-after-shock","b":-0.5,"type":"order","stem":"You and your partner arrive at a witnessed collapse of a 60-year-old man in a hardware store. Put your actions in the correct order.","opts":["Confirm the scene is safe and the patient is unresponsive","Check for normal breathing and a pulse for no more than 10 seconds","Begin chest compressions while your partner applies the AED pads","Stop compressions and clear the patient when the AED analyzes","Deliver the shock with no one touching the patient","Immediately resume compressions for about 2 minutes before the next analysis"],"key":"After a shock, compressions resume immediately; there is no pulse check until the next 2-minute analysis.","why":"Compressions start as soon as arrest is identified and continue while the AED is applied. After the shock, compressions restart at once because the heart rarely produces an effective pulse immediately, and any pause reduces blood flow.","src":"AHA"},{"id":"PA2-012","d":"PRIMARY","topic":"Cardiac arrest","concept":"termination-not-emt-decision","b":1,"type":"mc","stem":"A 79-year-old man is pulseless and apneic on his bedroom floor. He is warm, with no rigor mortis or dependent lividity. His daughter says he has terminal lung cancer and 'would not want this,' but no DNR order or POLST form can be found. What should you do?","opts":["Withhold CPR because the daughter has stated his wishes","Begin CPR with the AED and contact medical direction","Start CPR only if the daughter gives permission","Call the medical examiner and document the time of death"],"ans":1,"key":"Without a valid DNR or obvious signs of death, begin resuscitation; stopping is a medical direction or protocol decision.","why":"A family member's verbal report is not a valid advance directive. With no documentation and no obvious signs of death, the EMT starts resuscitation and involves medical direction, who can help weigh the family's information.","wrong":["A verbal report from family is not a valid advance directive; without documentation, resuscitation is started.","","Without valid documentation, starting resuscitation does not depend on family permission; begin care and involve medical direction.","No obvious signs of death are present, so declaring death is not an EMT decision here."],"src":"STD"},{"id":"PA2-013","d":"PRIMARY","topic":"Cardiac arrest","concept":"termination-not-emt-decision","b":0.5,"type":"mc","stem":"You and your partner have done 20 minutes of high-quality CPR on a 55-year-old man. The AED has advised no shock at every analysis, and ALS is 10 minutes away. Your partner says it is time to stop. Your protocols do not authorize EMTs to terminate resuscitation on their own. What should you do?","opts":["Stop CPR and record the time, since the rhythm is not shockable","Stop CPR only if family members agree it is time","Continue CPR and contact medical direction for guidance","Stop compressions but continue ventilations until ALS arrives"],"ans":2,"key":"Terminating resuscitation is not an EMT's own decision; continue CPR and follow protocol or online medical direction.","why":"A non-shockable rhythm does not by itself authorize an EMT to stop. Unless a protocol allows it, resuscitation continues while medical direction is contacted for a termination decision.","wrong":["A no-shock rhythm alone does not authorize an EMT to stop; termination requires protocol or medical direction.","Family agreement does not give the EMT authority to terminate resuscitation.","","Ventilation without compressions provides no circulation and still amounts to stopping resuscitation."],"src":"STD"},{"id":"PA2-014","d":"PRIMARY","topic":"Cardiac arrest","concept":"high-quality-cpr","b":-1,"type":"mr","stem":"You are coaching a new EMT who is doing compressions on an adult in cardiac arrest. Which actions reflect high-quality CPR? Select THREE.","opts":["Compressing at 100 to 120 per minute","Pushing at least 2 inches but not more than 2.4 inches deep","Allowing the chest to fully recoil after each compression","Pausing every 30 seconds to check for a carotid pulse","Leaning on the chest between compressions to keep the hands in place","Compressing at about 150 per minute to increase blood flow"],"ans":[0,1,2],"key":"High-quality adult CPR: 100–120/min, 2–2.4 in deep, full recoil, and minimal interruptions.","why":"Correct rate, correct depth, and full recoil together produce the best blood flow during CPR. Pauses, leaning, and excessive rates all reduce the effectiveness of compressions.","wrong":["","","","Frequent pulse checks interrupt compressions; pauses should be minimized and pulse checks wait for rhythm analysis.","Leaning prevents full recoil and reduces filling of the heart between compressions.","Rates above 120 per minute reduce compression depth and filling time."],"src":"AHA"},{"id":"PA2-015","d":"PRIMARY","topic":"Hemorrhage","concept":"match-bleeding-control","b":-1,"type":"mc","stem":"A 40-year-old man cut his forearm on a broken window. Dark red blood flows steadily from a 3-inch laceration but is not spurting or pooling. He is alert, and his skin is warm and pink. What is the first step to control the bleeding?","opts":["Apply a tourniquet high on the upper arm","Apply firm direct pressure with a dressing over the wound","Pack the wound with gauze before applying pressure","Elevate the arm and wait to see if the bleeding slows"],"ans":1,"key":"Steady bleeding that is not life-threatening is controlled first with firm direct pressure.","why":"Direct pressure controls most external bleeding. This wound is not spurting or pooling and the patient is perfusing well, so a tourniquet or packing is not needed unless pressure fails.","wrong":["A tourniquet is for life-threatening extremity bleeding or bleeding that direct pressure cannot control.","","Packing is for deep wounds where surface pressure cannot reach the bleeding source, such as junctional wounds; this laceration responds to direct pressure.","Elevation alone is not an effective bleeding control method and delays direct pressure."],"src":"STD"},{"id":"PA2-016","d":"PRIMARY","topic":"Hemorrhage","concept":"tourniquet-application","b":-0.5,"type":"mc","stem":"A 25-year-old landscaper slipped with a chainsaw. Bright red blood is spurting from a deep wound in the middle of his right thigh, and a large pool is forming on the ground. He is pale and anxious. What should you do first?","opts":["Obtain a full set of vital signs to establish a baseline","Apply direct pressure and reassess after 10 minutes","Apply a pressure bandage and elevate the leg","Apply a tourniquet 2 to 3 inches above the wound"],"ans":3,"key":"Spurting or pooling extremity bleeding is life-threatening: apply a tourniquet 2–3 in proximal to the wound immediately.","why":"Massive extremity hemorrhage can be fatal within minutes, so it is controlled before vital signs or further assessment. A tourniquet placed 2 to 3 inches above the wound, avoiding a joint, is the fastest reliable control.","wrong":["Vital signs can wait; uncontrolled arterial bleeding can kill him within minutes.","Waiting 10 minutes with spurting, pooling bleeding risks fatal blood loss; a tourniquet is indicated now.","A pressure bandage is unlikely to control arterial bleeding of this size, and elevation adds little.",""],"src":"STD"},{"id":"PA2-017","d":"PRIMARY","topic":"Hemorrhage","concept":"second-tourniquet","b":0.5,"type":"mc","stem":"You applied a tourniquet 3 inches above a deep lower-thigh wound on a 34-year-old man and tightened the windlass until it would not turn further without great force. Blood is still flowing briskly from the wound. What should you do next?","opts":["Apply a second tourniquet just above the first","Remove the first tourniquet and reapply it lower","Loosen the tourniquet and switch to direct pressure","Pack the thigh wound and remove the tourniquet"],"ans":0,"key":"If a fully tightened tourniquet does not stop bleeding, apply a second tourniquet proximal to the first.","why":"A large thigh may need more compression than one tourniquet can deliver. Leaving the first in place and adding a second just above it increases the compressed area without allowing more blood loss.","wrong":["","Removing it allows more bleeding, and placing it lower moves it closer to the wound.","Loosening restores flow to the wound and allows further blood loss.","Removing a tourniquet that is partly working causes more bleeding; add a second one instead."],"src":"STD"},{"id":"PA2-018","d":"PRIMARY","topic":"Hemorrhage","concept":"do-not-loosen-tourniquet","b":0.5,"type":"mc","stem":"Fifteen minutes ago you applied a tourniquet that stopped severe bleeding from a 50-year-old woman's lower leg. She is now crying from pain at the tourniquet site and begs you to loosen it. Transport to the trauma center will take 25 more minutes. What should you do?","opts":["Loosen it for 1 minute every 10 minutes to restore circulation","Remove it and apply a pressure dressing, since the bleeding has stopped","Leave it in place, reassure her, and record the application time","Loosen it slightly until she can tolerate the pain"],"ans":2,"key":"Once applied, a tourniquet is not loosened or removed in the field; document the time and reassure the patient.","why":"Pain is expected with an effective tourniquet. Loosening or removing it risks renewed bleeding, so it stays in place and the time of application is documented for the receiving team.","wrong":["Periodic loosening causes repeated blood loss and is not recommended.","Removing a tourniquet in the field risks rebleeding; removal is a hospital decision.","","Partial loosening can let arterial bleeding resume while blocking venous return, worsening blood loss."],"src":"STD"},{"id":"PA2-019","d":"PRIMARY","topic":"Hemorrhage","concept":"junctional-wound-packing","b":0.5,"type":"mc","stem":"A 19-year-old man was stabbed in the left groin crease. Bright red blood is pouring from a deep 1-inch wound. He is pale and restless, HR 128. There is no room to place a tourniquet above the wound. What is the best method to control this bleeding?","opts":["Apply a tourniquet as high on the thigh as it will go","Pack the wound with gauze and hold firm pressure","Cover the wound with an occlusive dressing taped on three sides","Apply ice packs to the groin and elevate the legs"],"ans":1,"key":"Junctional wounds (groin, armpit, neck) that cannot take a tourniquet are packed with gauze and held with firm pressure.","why":"Packing places gauze directly against the bleeding vessel deep in the wound, and firm pressure on top compresses it. A tourniquet cannot be placed above a groin crease wound.","wrong":["A thigh tourniquet sits below a groin crease wound and cannot compress the bleeding vessel.","","An occlusive dressing is for open chest wounds and does not control junctional hemorrhage.","Cold and elevation do not control arterial bleeding from a deep wound."],"src":"STD"},{"id":"PA2-020","d":"PRIMARY","topic":"Hemorrhage","concept":"junctional-wound-packing","b":1.5,"type":"mc","stem":"A 45-year-old man was struck by flying glass and has a deep wound in his right armpit. Blood is flowing heavily and has soaked through two stacked trauma dressings under your hand. What should you do next?","opts":["Apply a tourniquet on the upper arm below the wound","Add more dressings on top and continue the same pressure","Apply a cold pack and raise the arm above his head","Pack gauze into the wound and hold firm pressure"],"ans":3,"key":"Heavy bleeding from a deep armpit wound is controlled by packing the wound and holding firm pressure, not by a limb tourniquet.","why":"The armpit is a junctional area where a tourniquet cannot be placed above the wound. Packing puts pressure on the bleeding source inside the wound, which stacked surface dressings cannot do.","wrong":["A tourniquet on the arm is below an armpit wound and will not control it.","Stacking dressings on the surface of a deep wound does not press on the bleeding source inside it.","Cold and elevation do not control heavy bleeding from a deep wound.",""],"src":"STD"},{"id":"PA2-021","d":"PRIMARY","topic":"Hemorrhage","concept":"recognize-life-threatening-bleeding","b":-0.5,"type":"mr","stem":"You arrive at a multi-vehicle crash with several bleeding patients. Which findings indicate life-threatening bleeding that needs immediate control? Select THREE.","opts":["Blood spurting from a wound on a patient's upper arm","Blood pooling on the pavement under a patient's leg","Blood soaking through a dressing that is already being pressed on a wound","A scraped forearm with slow oozing that stopped with light pressure","A small scalp laceration that bled briefly and is now controlled","A shin skin tear with a slow trickle of dark blood"],"ans":[0,1,2],"key":"Spurting blood, pooling blood, or bleeding that soaks through applied pressure is life-threatening.","why":"These signs show rapid blood loss that can cause shock and death within minutes and must be controlled during the primary assessment. Slow oozing or bleeding already controlled can wait.","wrong":["","","","Slow oozing that stops with light pressure is not life-threatening.","A scalp wound that is already controlled does not need immediate intervention.","A slow trickle of dark blood is minor venous or capillary bleeding."],"src":"STD"},{"id":"PA2-022","d":"PRIMARY","topic":"Hemorrhage","concept":"match-bleeding-control","b":0,"type":"table","stem":"You are directing bleeding control for several injured workers after an industrial accident. Classify the most appropriate primary bleeding-control method for each patient.","cols":["Direct pressure","Wound packing with pressure","Extremity tourniquet"],"rows":[["Steady dark bleeding from a forearm laceration that slows under your hand",0],["Deep, heavily bleeding wound in the groin crease",1],["Spurting wound on the lower leg with blood pooling",2],["Deep, heavily bleeding wound in the armpit",1],["Upper-arm laceration that keeps soaking through firm direct pressure",2]],"key":"Direct pressure for controllable bleeding, tourniquet for life-threatening limb bleeding, packing for junctional wounds.","why":"Bleeding control matches the wound location and severity. Limb wounds that are life-threatening or fail direct pressure get a tourniquet, while groin and armpit wounds, where a tourniquet cannot be placed, are packed.","src":"STD"},{"id":"PA2-023","d":"PRIMARY","topic":"Hemorrhage","concept":"tourniquet-application","b":-0.5,"type":"order","stem":"A 30-year-old woman has spurting, pooling bleeding from a deep wound in the middle of her upper arm. Put the steps of tourniquet application in the correct order.","opts":["Expose the wound and identify the bleeding site","Place the tourniquet 2 to 3 inches above the wound, not over a joint","Pull the strap as tight as possible and secure it","Twist the windlass until the bleeding stops","Lock the windlass in place","Record the time the tourniquet was applied"],"key":"Tourniquet: place 2–3 in proximal, tighten the strap, twist the windlass until bleeding stops, lock it, and note the time.","why":"Removing slack with the strap before twisting lets the windlass reach occlusion with fewer turns. Locking keeps it from unwinding, and the recorded time guides hospital care.","src":"STD"},{"id":"PA2-024","d":"PRIMARY","topic":"Shock","concept":"compensated-shock-recognition","b":-0.5,"type":"mc","stem":"A 34-year-old man was the driver in a moderate-speed crash. He is anxious and keeps asking what happened. His skin is pale, cool, and moist. HR 118, BP 124/82, RR 22, SpO2 97%. Capillary refill is about 3 seconds. His abdomen is tender and distended. How should you interpret his condition?","opts":["Compensated shock, likely internal bleeding; high priority","Normal stress response, since his blood pressure is normal","Decompensated shock, since his heart rate is above 100","Anxiety reaction; reassess vital signs after calming him"],"ans":0,"key":"Tachycardia, cool pale moist skin, and anxiety with a normal BP indicate compensated shock.","why":"The body keeps blood pressure normal early in shock by raising the heart rate and shunting blood away from the skin. His abdominal findings suggest internal bleeding, which needs rapid transport.","wrong":["","A normal BP does not rule out shock; tachycardia, cool moist skin, and delayed refill show compensation.","Decompensation is marked by falling blood pressure, which has not occurred yet.","Attributing these signs to anxiety risks missing hemorrhage; the abdominal findings point to internal bleeding."],"src":"STD"},{"id":"PA2-025","d":"PRIMARY","topic":"Shock","concept":"compensated-shock-recognition","b":-0.5,"type":"mc","stem":"You are transporting a 45-year-old woman with a pelvic injury. On scene her HR was 112 and BP 128/84. Twenty minutes later she is confused, HR 136, BP 82/50, and her skin is gray and clammy. What does this change indicate?","opts":["Improvement, since compensation is no longer needed","An expected effect o
