# Builds the Google Play release of Registry Ready as an Android App Bundle (.aab).
#
# The web bundle is android/scripts/build-store.py run on the repository's index.html: the web app
# unchanged except that its three typefaces are bundled locally instead of loaded from Google
# Fonts, so the app makes no network request. Capacitor 8.5.3, targetSdk 36, Java 21, Node 22.
# No Capacitor plugins.
#
# Signing: when the repository secrets UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD and
# UPLOAD_KEY_ALIAS are set (entered by the account holder; never stored in the repository), the
# bundle is also signed with the HAKOYA LLC upload key and verified, producing
# registry-ready-<version>-<code>-signed.aab ready for Play Console. Google re-signs it with the
# app signing key (Play App Signing). Without the secrets only the unsigned bundle is produced.
#
# Runs on a push to main that touches the app or the Android build, or by manual dispatch. The
# unsigned bundle is kept as a workflow artifact and committed to the android-artifacts branch
# (dist/registry-ready-<version>-<code>-unsigned.aab; dist/LATEST names the newest).
name: Android build (Google Play)
on:
  push:
    branches: [main]
    paths: ["index.html", "icon-512.png", "android/package.json", "android/package-lock.json", "android/capacitor.config.json", "android/scripts/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown on Google Play (versionName)"
        required: true
        default: "1.0"
permissions:
  contents: write
concurrency:
  group: android-build
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_NAME: ${{ inputs.version_name || '1.0' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build store web bundle
        working-directory: android
        run: |
          npm ci
          npm run build:www
          grep -q '<meta name="registry-ready-build" content="store">' www/index.html

      - name: Generate and prepare the Android project
        working-directory: android
        run: |
          pip3 install --quiet --break-system-packages pillow || pip3 install --quiet pillow
          rm -rf android
          npx cap add android
          python3 scripts/native-setup.py
          npx cap sync android

      - name: Build App Bundle (unsigned release)
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          ls -l app/build/outputs/bundle/release/

      - name: Collect bundle
        id: out
        run: |
          NAME="registry-ready-${VERSION_NAME}-${BUILD_NUMBER}-unsigned.aab"
          mkdir -p "$RUNNER_TEMP/dist"
          cp android/android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Built $NAME (versionCode $BUILD_NUMBER, versionName $VERSION_NAME). Sign with the upload key before uploading." >> "$GITHUB_STEP_SUMMARY"

      - name: Sign with the upload key (if secrets are set)
        id: sign
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "Signing secrets not set; unsigned bundle only." >> "$GITHUB_STEP_SUMMARY"
            echo "signed=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          KS="$RUNNER_TEMP/upload.jks"
          echo "$KS_B64" | tr -d ' \r\n' | base64 -d > "$KS"
          SIGNED="registry-ready-${VERSION_NAME}-${BUILD_NUMBER}-signed.aab"
          jarsigner -keystore "$KS" -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -signedjar "$RUNNER_TEMP/dist/$SIGNED" "$RUNNER_TEMP/dist/${{ steps.out.outputs.name }}" "$KS_ALIAS"
          jarsigner -verify "$RUNNER_TEMP/dist/$SIGNED" | tail -1
          keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias "$KS_ALIAS" | grep -i "fingerprint" >> "$GITHUB_STEP_SUMMARY" || true
          rm -f "$KS"
          echo "Signed: $SIGNED" >> "$GITHUB_STEP_SUMMARY"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: ${{ runner.temp }}/dist/

      - name: Commit bundle to the android-artifacts branch
        run: |
          cd "$RUNNER_TEMP"
          git init -q art && cd art
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin android-artifacts && git checkout -q -b android-artifacts FETCH_HEAD || git checkout -q --orphan android-artifacts
          mkdir -p dist
          cp "$RUNNER_TEMP/dist/${{ steps.out.outputs.name }}" dist/
          echo "${{ steps.out.outputs.name }}" > dist/LATEST
          if [ -n "${{ steps.sign.outputs.signed }}" ]; then
            cp "$RUNNER_TEMP/dist/${{ steps.sign.outputs.signed }}" dist/
            echo "${{ steps.sign.outputs.signed }}" > dist/LATEST-SIGNED
          fi
          git add dist
          git commit -q -m "Android bundle ${{ steps.out.outputs.name }} from ${{ github.sha }}"
          git push -q origin android-artifacts
